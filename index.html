<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My I-Car V8</title>
<style>
:root{
  --bg:#06111f;
  --bg2:#08172a;
  --panel:#0e1c31;
  --panel2:#12233b;
  --panel3:#102139;
  --line:rgba(117,174,255,.16);
  --softline:rgba(255,255,255,.06);
  --text:#f3f7ff;
  --muted:#94a3bf;
  --teal:#73e0cd;
  --teal2:#49cbb7;
  --green:#56d7c7;
  --cyan:#73d0ff;
  --amber:#f3b35e;
  --amber-soft:rgba(243,179,94,.18);
  --red:#dd7382;
  --red-soft:rgba(221,115,130,.18);
  --violet:#8c7cff;
  --violet-soft:rgba(140,124,255,.18);
  --shadow:0 18px 44px rgba(0,0,0,.32);
  --radius:26px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 72% 18%, rgba(43,184,160,.20), transparent 22%),
    radial-gradient(circle at 40% 12%, rgba(73,103,255,.18), transparent 24%),
    linear-gradient(180deg,#040c18 0%, #081120 30%, #071320 100%);
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:0 18px 110px}
.topbar{
  position:sticky;top:0;z-index:40;
  backdrop-filter:blur(14px);
  background:linear-gradient(180deg,rgba(4,12,24,.95),rgba(4,12,24,.78));
  border-bottom:1px solid rgba(255,255,255,.05);
}
.topbar-inner{max-width:1280px;margin:0 auto;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:48px;height:48px;border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.08);display:grid;place-items:center;box-shadow:var(--shadow)}
.mark img{width:34px;height:34px;display:block;opacity:.92}
.brand-title{font-size:24px;font-weight:900;letter-spacing:-.03em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ver{font-size:12px;font-weight:900;padding:6px 10px;border-radius:999px;background:linear-gradient(180deg,rgba(115,224,205,.26),rgba(115,224,205,.14));color:#a9fff0;border:1px solid rgba(115,224,205,.26)}
.brand-sub{font-size:13px;color:var(--muted);margin-top:4px}
.top-badge{padding:10px 13px;border-radius:14px;background:rgba(115,224,205,.10);border:1px solid rgba(115,224,205,.16);color:#baffef;font-weight:800;font-size:13px}
.hero{
  margin-top:18px;
  border-radius:34px;
  padding:28px 24px;
  background:
    radial-gradient(circle at 78% 20%, rgba(115,224,205,.18), transparent 22%),
    radial-gradient(circle at 60% 10%, rgba(88,110,255,.15), transparent 28%),
    linear-gradient(180deg, rgba(15,28,49,.96), rgba(11,23,40,.96));
  border:1px solid rgba(115,208,255,.18);
  box-shadow:var(--shadow);
}
.kicker{font-size:12px;font-weight:900;letter-spacing:.24em;text-transform:uppercase;color:#87f7e2;display:flex;align-items:center;gap:8px}
.hero h1{font-size:clamp(38px,6vw,66px);line-height:1.04;letter-spacing:-.045em;margin:14px 0 14px;max-width:780px}
.hero p{font-size:clamp(18px,2.8vw,22px);line-height:1.5;color:#adc0dc;max-width:850px;margin:0}
.hero-actions{display:flex;gap:14px;flex-wrap:wrap;margin-top:24px}
.btn{border:0;border-radius:20px;padding:18px 24px;font-size:17px;font-weight:900;line-height:1;display:inline-flex;align-items:center;gap:10px}
.btn-primary{background:linear-gradient(180deg,#76e3d1,#67d8c7);color:#062222;box-shadow:0 14px 30px rgba(103,216,199,.25)}
.btn-secondary{background:rgba(13,33,53,.75);color:#9ff6e6;border:1px solid rgba(115,224,205,.22)}
.btn-dark{background:rgba(255,255,255,.03);color:#d7e6ff;border:1px solid rgba(255,255,255,.08)}
.hint-card{margin-top:20px;border-radius:24px;padding:18px 18px;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.02));border:1px solid rgba(115,208,255,.14)}
.hint-card strong{display:block;font-size:21px;margin-bottom:8px}
.hint-card span{display:block;font-size:17px;color:#afbed6;line-height:1.55}
.grid{display:grid;gap:16px}
.metrics{grid-template-columns:repeat(4,minmax(0,1fr));margin-top:18px}
.card{
  background:linear-gradient(180deg,rgba(13,27,47,.96),rgba(10,22,39,.96));
  border:1px solid rgba(112,162,234,.16);
  border-radius:30px;
  box-shadow:var(--shadow);
}
.metric{padding:22px 20px 20px;min-height:170px;display:flex;flex-direction:column;justify-content:space-between}
.metric-label{font-size:15px;font-weight:700;color:#aab9d1}
.metric-num{font-size:58px;font-weight:900;letter-spacing:-.05em;line-height:1;margin:16px 0 8px}
.metric-sub{font-size:16px;color:#91a4c0;line-height:1.45}
.metric .orange{color:#ffcb74}
.metric .mint{color:var(--teal)}
.metric .white{color:#f5f7fd}
.section{margin-top:22px;padding:22px}
.section-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.section-title{font-size:21px;font-weight:900;letter-spacing:-.03em;display:flex;align-items:center;gap:10px}
.section-badge{padding:10px 14px;border-radius:14px;font-size:14px;font-weight:900;border:1px solid transparent}
.badge-amber{background:var(--amber-soft);color:#ffcf87;border-color:rgba(243,179,94,.24)}
.badge-violet{background:var(--violet-soft);color:#c8bdff;border-color:rgba(140,124,255,.24)}
.badge-mint{background:rgba(115,224,205,.10);color:#a7fff3;border-color:rgba(115,224,205,.22)}
.alert-list{display:grid;gap:14px}
.alert-item{border-radius:22px;padding:18px;background:linear-gradient(180deg,rgba(16,33,58,.90),rgba(15,28,49,.92));border:1px solid rgba(255,255,255,.08);display:flex;gap:16px;align-items:flex-start}
.alert-icon{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:24px;font-weight:900;flex:0 0 auto;border:1px solid rgba(255,255,255,.06)}
.icon-red{background:var(--red-soft);color:#ffc3ce}
.icon-amber{background:var(--amber-soft);color:#ffcf87}
.alert-body strong{display:block;font-size:18px;line-height:1.35;margin-bottom:6px}
.alert-body p{margin:0;color:#9caeca;font-size:15px;line-height:1.5}
.alert-actions{display:flex;gap:22px;flex-wrap:wrap;margin-top:14px}
.text-link{font-size:16px;font-weight:900}
.text-link.mint{color:#8ff2df}
.text-link.muted{color:#9dacbf}
.two-col{grid-template-columns:1.15fr .85fr;margin-top:22px}
.info-card{padding:22px}
.info-card h3{font-size:19px;margin:0 0 14px;display:flex;align-items:center;gap:10px}
.info-text{padding:18px;border-radius:20px;background:linear-gradient(180deg,rgba(62,173,152,.13),rgba(62,173,152,.08));border:1px solid rgba(115,224,205,.18);font-size:17px;line-height:1.65;color:#d9edf1}
.mini-graph{height:210px;display:flex;align-items:flex-end;justify-content:center;padding:20px 10px 10px}
.spark{width:100%;max-width:320px;height:130px;position:relative}
.spark svg{width:100%;height:100%}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.search,.select,.field input,.field textarea,.field select{
  width:100%;background:rgba(9,20,36,.95);color:#f0f6ff;border:1px solid rgba(120,151,198,.18);border-radius:18px;padding:16px 17px;font-size:16px;outline:none;
}
.search:focus,.select:focus,.field input:focus,.field textarea:focus,.field select:focus{border-color:rgba(115,224,205,.35);box-shadow:0 0 0 4px rgba(115,224,205,.08)}
.grow{flex:1;min-width:230px}.w240{width:240px;max-width:100%}
.table-card{overflow:hidden}
.table-scroll{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:780px}
th,td{padding:16px 18px;text-align:left;border-bottom:1px solid rgba(255,255,255,.06)}
th{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#7f93b3;font-weight:900;background:rgba(255,255,255,.02)}
td{font-size:15px;color:#edf4ff;vertical-align:top}
tr:hover td{background:rgba(255,255,255,.012)}
.t-muted{color:#a8b6cb}
.pill{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:8px 12px;font-size:13px;font-weight:900;border:1px solid transparent;white-space:nowrap}
.pill.red{background:var(--red-soft);color:#ffc0cb;border-color:rgba(221,115,130,.22)}
.pill.orange{background:var(--amber-soft);color:#ffd08e;border-color:rgba(243,179,94,.22)}
.pill.green{background:rgba(115,224,205,.10);color:#b4fff1;border-color:rgba(115,224,205,.2)}
.pill.gray{background:rgba(255,255,255,.05);color:#cad6e8;border-color:rgba(255,255,255,.07)}
.table-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn-mini{border:0;border-radius:14px;padding:10px 12px;font-size:14px;font-weight:900}
.btn-edit{background:rgba(115,224,205,.12);color:#affff1}
.btn-del{background:rgba(221,115,130,.16);color:#ffc5d0}
.table-foot{padding:14px 18px;color:#90a2bd;font-size:14px}
.empty{padding:32px 18px;color:#9cb0cc;text-align:center;font-size:16px}
.modalback{position:fixed;inset:0;background:rgba(0,8,16,.7);display:grid;place-items:center;z-index:70;padding:18px}
.modal{width:min(760px,100%);max-height:92vh;overflow:auto;background:linear-gradient(180deg,#0d1b2f,#0b182b);border:1px solid rgba(118,164,235,.18);border-radius:28px;padding:22px;box-shadow:var(--shadow)}
.modal h2{margin:0 0 18px;font-size:30px;letter-spacing:-.04em}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{margin-bottom:14px}
.field label{display:block;font-size:14px;font-weight:900;color:#d5e4fb;margin-bottom:8px}
.field textarea{min-height:100px;resize:vertical}
.buttons{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:20px}
.notice{padding:18px;border-radius:20px;background:linear-gradient(180deg,rgba(19,43,56,.9),rgba(14,34,48,.88));border:1px solid rgba(115,224,205,.18);color:#d2edf0;font-size:16px;line-height:1.6}
.help-grid,.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.step-card,.settings-card{padding:20px}
.step-num{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:rgba(115,224,205,.14);border:1px solid rgba(115,224,205,.20);color:#b5fff1;font-weight:900;margin-bottom:12px}
.step-card h3,.settings-card h3{margin:0 0 10px;font-size:22px}
.step-card p,.settings-card p{margin:0;color:#a6b8d1;font-size:16px;line-height:1.6}
.mobile-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  padding:10px 10px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(5,12,22,.88),rgba(5,12,22,.96));backdrop-filter:blur(16px);border-top:1px solid rgba(255,255,255,.05)
}
.mobile-nav-grid{max-width:900px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.mtab{border:0;background:transparent;color:#a3b4cb;border-radius:22px;padding:12px 6px 10px;font-size:12px;font-weight:800;line-height:1.15;display:flex;flex-direction:column;align-items:center;gap:6px}
.mtab .ico{font-size:24px;line-height:1}
.mtab.active{background:linear-gradient(180deg,rgba(59,142,127,.32),rgba(34,90,79,.24));color:#9ff5e6;border:1px solid rgba(115,224,205,.18)}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#10283a;color:#e8f9ff;border:1px solid rgba(115,224,205,.2);padding:13px 18px;border-radius:16px;display:none;z-index:80;font-size:15px;font-weight:900}
@media (max-width:1100px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.two-col{grid-template-columns:1fr}}
@media (max-width:760px){
  .wrap{padding:0 14px 110px}
  .topbar-inner{padding:12px 14px}
  .brand-title{font-size:20px}
  .mark{width:42px;height:42px}.mark img{width:30px;height:30px}
  .top-badge{display:none}
  .hero{padding:24px 18px;border-radius:30px}
  .hero p{font-size:18px}
  .btn{width:100%;justify-content:center}
  .metrics{grid-template-columns:1fr 1fr}
  .metric{min-height:150px;padding:20px 18px}
  .metric-num{font-size:48px}
  .section{padding:18px}
  .alert-item{padding:16px}
  .fields,.help-grid,.settings-grid{grid-template-columns:1fr}
}
@media (max-width:520px){.metrics{grid-template-columns:1fr}.hero h1{font-size:34px}.metric-num{font-size:44px}.section-title{font-size:19px}.mobile-nav-grid{gap:6px}.mtab{font-size:11px}.mtab .ico{font-size:22px}}

/* Pilote vocal : contraste et ergonomie tactile */
.voice-entry{margin-top:18px;padding:18px 20px;border:1px solid rgba(115,224,205,.25);border-radius:26px;background:linear-gradient(135deg,rgba(49,141,132,.22),rgba(22,31,64,.25));display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}
.voice-entry h3{font-size:23px;margin:0 0 7px}.voice-entry p{font-size:16px;color:#b8c9dd;margin:0}.voice-entry .btn{padding:15px 20px}
.voice-shell{margin-top:18px;display:grid;gap:18px;grid-template-columns:minmax(0,1.5fr) minmax(260px,.85fr)}
.voice-panel{padding:24px;background:linear-gradient(150deg,rgba(17,37,59,.99),rgba(11,24,43,.96));border:1px solid rgba(115,224,205,.17);border-radius:30px;box-shadow:var(--shadow)}
.voice-title{font-size:clamp(25px,4vw,37px);letter-spacing:-.04em;font-weight:900;margin:10px 0 12px;line-height:1.15}
.voice-intro{font-size:17px;line-height:1.55;color:#a8bdd7}
.voice-progress{display:flex;justify-content:space-between;align-items:center;margin:20px 0 12px;color:#b9cee4;font-size:14px;font-weight:800}
.voice-progressbar{height:9px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden}
.voice-progressbar>div{height:100%;border-radius:999px;background:linear-gradient(90deg,#4cb7aa,#7bf6dd);transition:width .2s}
.voice-question{font-size:24px;font-weight:850;line-height:1.4;letter-spacing:-.025em;padding:23px;border-radius:22px;background:linear-gradient(120deg,rgba(115,224,205,.13),rgba(140,124,255,.10));border:1px solid rgba(115,224,205,.18);margin:18px 0}
.voice-state{font-size:15px;font-weight:750;color:#9fe7d8;margin:10px 0}
.voice-controls{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.voice-controls .btn{font-size:16px;padding:15px 19px}
.voice-textform{display:flex;gap:9px;margin-top:12px}.voice-textform input{min-width:0;flex:1;width:auto;background:#08172b;border:1px solid rgba(157,181,214,.26);border-radius:18px;padding:16px;color:#f3f7ff;font-size:17px}.voice-textform button{white-space:nowrap}
.voice-transcript{margin-top:12px;padding:15px;border-radius:18px;background:rgba(5,13,27,.65);border:1px solid rgba(255,255,255,.06);color:#c4d3e8;font-size:15px;line-height:1.6}
.voice-summary{display:grid;gap:9px;margin:14px 0}
.voice-srow{display:grid;grid-template-columns:minmax(135px, .9fr) 1.5fr auto;align-items:center;gap:10px;background:rgba(255,255,255,.025);border-radius:15px;padding:11px 12px;border:1px solid rgba(255,255,255,.06)}
.voice-srow small{font-size:14px;color:#97abc6}.voice-srow strong{font-size:16px;overflow-wrap:anywhere}.voice-srow button{border:0;background:rgba(115,224,205,.11);color:#b0fff1;border-radius:12px;padding:9px 12px;font-size:14px;font-weight:800}
.voice-side h3{font-size:21px;margin:0 0 12px}.voice-side p{font-size:16px;color:#adbfda;line-height:1.65}
.voice-feature{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.07);color:#e0ecff;font-size:15px;line-height:1.6}.voice-feature:last-child{border:0}
.voice-tip{color:#9df9e7;font-size:14px;font-weight:800;margin-top:12px}
.voice-warning{color:#ffd190;background:rgba(243,179,94,.10);border:1px solid rgba(243,179,94,.18);border-radius:15px;padding:12px 14px;font-size:14px;line-height:1.45;margin:10px 0}
.voice-entry-card{padding:24px;border-radius:28px;border:1px solid rgba(115,224,205,.16);background:linear-gradient(140deg,rgba(35,81,83,.28),rgba(12,24,43,.96));margin-top:18px}
.voice-entry-card h2{font-size:26px;margin:0 0 10px}.voice-entry-card p{font-size:17px;line-height:1.55;color:#adc5d5}
@media(max-width:900px){.voice-shell{grid-template-columns:1fr}.voice-panel{padding:19px}.voice-question{font-size:21px;padding:18px}.voice-srow{grid-template-columns:1fr auto;gap:5px}.voice-srow small{grid-column:1}.voice-srow strong{grid-column:1}.voice-srow button{grid-column:2;grid-row:1/3}.voice-textform{flex-direction:column}.voice-textform button{width:100%}}
</style>
</head>

<script>
const STORAGE_KEY='myicar_v8_data';
const LEGACY_KEYS=['myicar_v7_data','myicar_v6_data','myicar_v5_data','myicar_v4_data'];
const initial={expertises:[],vehicules:[],prets:[],clients:[],taches:[],planning:[]};
let db=load(), page='dashboard', query='', filter='';
const sections=[
  ['dashboard','◈','Cockpit'],
  ['vehicules','▤','Dossiers'],
  ['planning','▦','Planning'],
  ['prets','▬','Prêts'],
  ['assistant','✦','Pilote']
];
const configs={
  expertises:{sing:'expertise',title:'Expertises',cols:[['client','Client'],['immatriculation','Immatriculation'],['date','Date RDV'],['statut','Statut'],['notes','Observations']],fields:[['client','Client','text',1],['immatriculation','Immatriculation','text'],['date','Date de rendez-vous','date'],['statut','Statut','select','',['Sans RDV','RDV fixé','Réalisée','À relancer']],['notes','Observations','textarea']]},
  vehicules:{sing:'dossier',title:'Dossiers',cols:[['client','Client'],['modele','Véhicule'],['immatriculation','Immatriculation'],['statut','Étape'],['priorite','Priorité']],fields:[['client','Client','text',1],['modele','Modèle','text'],['immatriculation','Immatriculation','text'],['statut','Étape','select','',['À chiffrer','En attente','À planifier','En travaux','Peinture','Prêt à livrer','Livré']],['priorite','Priorité (1 à 10)','number'],['notes','Observations','textarea']]},
  prets:{sing:'prêt',title:'Prêts',cols:[['nom','Véhicule de prêt'],['client','Client'],['date_depart','Départ'],['date_retour','Retour prévu'],['statut','Statut']],fields:[['nom','Véhicule de prêt','text',1],['client','Client bénéficiaire','text'],['date_depart','Date de départ','date'],['date_retour','Retour prévu','date'],['statut','Statut','select','',['Disponible','Réservé','Prêté','Retourné']],['notes','Observations','textarea']]},
  planning:{sing:'rendez-vous',title:'Planning',cols:[['date','Date'],['heure','Heure'],['titre','Intervention / RDV'],['responsable','Responsable'],['statut','Statut']],fields:[['date','Date','date',1],['heure','Heure','time'],['titre','Intervention / RDV','text',1],['responsable','Responsable','select','',['Enzo','IB','Brahim','Aurel','Autre']],['statut','Statut','select','',['Prévu','En cours','Terminé']],['notes','Observations','textarea']]},
  clients:{sing:'client',title:'Clients',cols:[['nom','Nom'],['telephone','Téléphone'],['email','E-mail'],['vehicule','Véhicule'],['notes','Observations']],fields:[['nom','Nom du client','text',1],['telephone','Téléphone','tel'],['email','E-mail','email'],['vehicule','Véhicule','text'],['notes','Observations','textarea']]},
  taches:{sing:'signal',title:'Pilote',cols:[['titre','Tâche / signal'],['client','Client'],['echeance','Échéance'],['responsable','Responsable'],['statut','Statut']],fields:[['titre','Tâche / signal','text',1],['client','Client','text'],['echeance','Échéance','date'],['responsable','Responsable','select','',['Enzo','IB','Brahim','Aurel','Autre']],['statut','Statut','select','',['À faire','En cours','Terminée']],['notes','Observations','textarea']]}
};
function clone(v){return JSON.parse(JSON.stringify(v))}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function load(){
  try{
    const current=localStorage.getItem(STORAGE_KEY);
    if(current) return {...clone(initial),...JSON.parse(current)};
    for(const k of LEGACY_KEYS){
      const old=localStorage.getItem(k);
      if(old){
        const data={...clone(initial),...JSON.parse(old)};
        localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
        return data;
      }
    }
  }catch(e){}
  return clone(initial)
}
function save(silent=false){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(db)); if(!silent) toast('Enregistré sur cet appareil');}catch(e){alert('Sauvegarde locale indisponible.')}}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(window.__tt);window.__tt=setTimeout(()=>e.style.display='none',2200)}
function go(p){page=p;query='';filter='';render()}
function countActive(){return db.vehicules.filter(x=>String(x.statut||'')!=='Livré').length}
function countRisk(){return db.expertises.filter(x=>x.statut==='Sans RDV'||!x.date).length + db.taches.filter(x=>x.statut!=='Terminée').length}
function countLoansActive(){return db.prets.filter(x=>x.statut==='Prêté').length}
function countLoansAvailable(){return db.prets.filter(x=>x.statut==='Disponible').length}
function portfolioAmount(){let total=0; db.vehicules.forEach(x=>{const m=parseFloat(String(x.montant||'').replace(',','.')); if(!isNaN(m) && String(x.statut||'')!=='Livré') total+=m}); return total}
function localISO(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function todayCount(){const t=localISO(); return db.planning.filter(x=>x.date===t && x.statut!=='Terminé').length}
function status(v){
  const s=String(v??'').trim();
  let cl='gray';
  if(/Sans RDV|À faire|En attente|À relancer|À chiffrer/i.test(s)) cl='red';
  else if(/Prêté|En cours|À planifier|Réservé|Peinture|Prévu|RDV fixé|Prêt à livrer/i.test(s)) cl='orange';
  else if(/Terminé|Disponible|Livré|Réalisée|Retourné|Terminée/i.test(s)) cl='green';
  return `<span class="pill ${cl}">${esc(s||'—')}</span>`;
}
function bottomNav(){
  document.getElementById('mobiletabs').innerHTML=sections.map(s=>`<button class="mtab ${page===s[0]?'active':''}" onclick="go('${s[0]}')"><span class="ico">${s[1]}</span><span>${s[2]}</span></button>`).join('');
}
function hero(){
  const risk=countRisk();
  return `<section class="hero"><div class="kicker">✦ Pilotage intelligent de carrosserie</div><h1>Bonjour Aurel. <br>Ton atelier a une longueur d’avance.</h1><p>Les dossiers avancent. Le pilote t’aide à recueillir les informations d’un dossier et à repérer les points qui restent à traiter.</p><div class="hero-actions"><button class="btn btn-primary" onclick="go('assistant')">🎙 Parler au pilote</button><button class="btn btn-secondary" onclick="go('planning')">▦ Préparer demain</button><button class="btn btn-secondary" onclick="go('taches')">✦ Relances</button></div>${risk===0?`<div class="hint-card"><strong>Nouveau sur My I-Car ?</strong><span>Un parcours guidé t’explique les fonctions, sans jargon technique. <span style="color:#9ff6e6;font-weight:900;cursor:pointer" onclick="go('aide')">Démarrer avec le guide →</span></span></div>`:''}</section>`;
}
function linkedVehicule(e){const plate=String(e.immatriculation||'').replace(/[^A-Z0-9]/gi,'').toUpperCase(); return db.vehicules.find(v=>plate&&String(v.immatriculation||'').replace(/[^A-Z0-9]/gi,'').toUpperCase()===plate)||db.vehicules.find(v=>e.client&&v.client&&v.client.trim().toLowerCase()===e.client.trim().toLowerCase())}
function dashboard(){

  try{
    const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),25000);
    const r=await fetch(PILOTE_URL,{method:'POST',headers:{'Content-Type':'application/json'},signal:ctrl.signal,body:JSON.stringify({historique:voice.history.slice(-30),valeurs:voice.values,passes:Object.keys(voice.skipped).filter(k=>voice.skipped[k]),aujourdhui:localISO(),phase:voice.phase})});
    clearTimeout(timer);
    const d=await r.json().catch(()=>({erreur:'réponse illisible'}));
    if(!r.ok||d.erreur) throw Error(d.erreur||('erreur '+r.status));
    const keys=intakeFields.map(f=>f.key);
    for(const [k,v] of Object.entries(d.valeurs||{})) if(keys.includes(k)&&String(v??'').trim()){voice.values[k]=String(v).trim();delete voice.skipped[k]}
    for(const k of (d.passes||[])) if(keys.includes(k)&&!String(voice.values[k]||'').trim()) voice.skipped[k]=true;
    if(voice.phase==='intro') voice.intro=t;
    voice.thinking=false;
    if(d.termine||voice.phase==='review'){voice.phase='review';voice.key=null;voice.aiQuestion=''}
    else{voice.phase='questions';voice.key=null;voice.aiQuestion=d.question||'Autre chose à ajouter sur ce dossier ?'}
    render();voiceSpeakCurrent();return true;
  }catch(e){
    voice.thinking=false;voice.aiOff=true;voice.history.splice(-2);voice.aiQuestion='';
    voice.error='Pilote IA injoignable ('+(e.name==='AbortError'?'trop long à répondre':e.message)+'). Je continue avec les questions classiques.';
    return false;
  }
}
async function voiceApply(t){
  if(!t||voice.thinking)return;
  voice.transcript=t;voice.error='';
  const s=voiceClean(t);
  if(/^(annuler|arrete|stop)$/.test(s)){voiceCancel();return}
  if(voice.phase==='review'&&/^(oui|ok|valide|valider|enregistre|enregistrer|confirme|c'est bon|c est bon)/.test(s)){voiceSave();return;}
  if(!voice.aiOff&&!voice.editOnly&&['intro','questions','review'].includes(voice.phase)){
    if(await voiceAI(t))return;
  }
  if(voice.phase==='review'){
    voice.error=(voice.error?voice.error+' ':'')+'Pour corriger une information, appuie sur « Modifier » ; pour sauvegarder, dis « enregistre ».';render();return;
  }
  if(voice.phase==='intro'){voiceParseBrief(t);voiceNext();return}
  if(voice.phase!=='questions')return;
  if(!voice.key){voiceNext();return}
  const key=voice.key;
  if(/^(passe|je ne sais pas(?: encore)?|je sais pas|aucun|inconnu|non|pas encore|pas pour l'instant|rien|je connais pas)$/.test(s)){
    voice.skipped[key]=true;delete voice.values[key];
  }else{
    const answer=voiceFormatAnswer(key,t);
    voice.values[key]=answer;delete voice.skipped[key];
  }
  if(voice.editOnly){voice.editOnly=null;voice.phase='review';voice.key=null;render();voiceSpeakCurrent();return}
  voiceNext();
}
function voiceEditField(key){voice.phase='questions';voice.key=key;voice.editOnly=key;voice.skipped[key]=false;delete voice.values[key];render();voiceSpeakCurrent()}
function voiceCancel(){if(!confirm('Abandonner le dossier en cours de création ?'))return;voiceStop();voice.phase='idle';voice.values={};voice.key=null;render()}
function voiceSave(){
  const v=voice.values;
  if(!String(v.client||'').trim() && !String(v.modele||'').trim()){
    voice.error='Ajoute au moins le nom du client ou le véhicule avant de sauvegarder.';render();return;
  }
  const id=crypto.randomUUID?.()||String(Date.now());
  const notes=[v.nature&&`Sinistre : ${v.nature}`,v.description&&`Dégâts : ${v.description}`,v.assurance&&`Assurance : ${v.assurance}`,v.telephone&&`Téléphone : ${v.telephone}`,voice.intro&&`Déclaration initiale : ${voice.intro}`].filter(Boolean).join('\n');
  const step=v.expertise==='Réalisée'?'À planifier':'À chiffrer';
  db.vehicules.push({id,client:v.client||'',modele:v.modele||'',immatriculation:v.immatriculation||'',statut:step,priorite:v.priorite||'',notes,sinistre:v.nature||'',assurance:v.assurance||'',telephone:v.telephone||'',date_rdv:v.dateRDV||''});
  if(v.client && !db.clients.some(c=>voiceClean(c.nom||'')===voiceClean(v.client))){db.clients.push({id:crypto.randomUUID?.()||String(Date.now()+1),nom:v.client,telephone:v.telephone||'',email:'',vehicule:v.modele||'',notes:v.assurance?`Assurance : ${v.assurance}`:''})}
  if(v.expertise==='Réalisée'||v.expertise==='À planifier'){
    const validDate=/^20\d\d-\d\d-\d\d$/.test(v.dateRDV||'');
    db.expertises.push({id:crypto.randomUUID?.()||String(Date.now()+2),client:v.client||'',immatriculation:v.immatriculation||'',date:validDate?v.dateRDV:'',statut:v.expertise==='Réalisée'?'Réalisée':validDate?'RDV fixé':'Sans RDV',notes:(v.modele||'')+(v.nature?' • '+v.nature:'')});
  }
  if(v.prochaineAction)db.taches.push({id:crypto.randomUUID?.()||String(Date.now()+3),titre:v.prochaineAction,client:v.client||v.modele||'',echeance:'',responsable:'',statut:'À faire',notes:'Créé depuis le pilote vocal'});
  save(true);voice.phase='saved';voice.key=null;voice.autopilot=false;render();voiceSpeakCurrent();
}
function assistantPage(){
  const count=intakeFields.filter(f=>String(voice.values[f.key]||'').trim()||voice.skipped[f.key]).length;
  const pct=Math.round((count/intakeFields.length)*100);
  const micOK=!!SpeechRec;
  const q=voiceQuestion();
  const summary=intakeFields.map(f=>`<div class="voice-srow"><small>${esc(f.label)}</small><strong>${esc(voice.values[f.key]||'Non renseigné')}</strong><button onclick="voiceEditField('${f.key}')">Modifier</button></div>`).join('');
  const content=voice.phase==='idle'?`<div class="voice-entry-card"><h2>Constituer un dossier en parlant</h2><p>Tu m’expliques la situation. Le pilote pose les questions utiles, puis prépare le classement et la fiche du véhicule. Tu vérifies avant l’enregistrement.</p><button class="btn btn-primary" onclick="voiceNew()">🎙 Commencer un dossier</button></div>`:voice.phase==='saved'?`<div class="voice-question">✅ Dossier enregistré sur cet appareil.</div><div class="voice-intro">Le véhicule est ajouté aux dossiers. Tu peux le retrouver dans « Dossiers » et, si nécessaire, dans les relances et expertises.</div><div class="voice-controls"><button class="btn btn-primary" onclick="go('vehicules')">Voir les dossiers</button><button class="btn btn-secondary" onclick="voiceNew()">Créer un autre dossier</button></div>`:
  `<div class="voice-progress"><span>Constitution du dossier</span><span>${count} / ${intakeFields.length} informations traitées</span></div><div class="voice-progressbar"><div style="width:${pct}%"></div></div><div class="voice-question">${esc(q)}</div>
  ${voice.phase==='review'?`<div class="voice-intro">Vérifie le dossier. Les données non renseignées restent vides ; rien n’est ajouté sans ta confirmation.</div><div class="voice-summary">${summary}</div><div class="voice-controls"><button class="btn btn-primary" onclick="voiceSave()">✅ Confirmer et enregistrer</button>${voice.aiOff?'':`<button class="btn btn-secondary" onclick="voiceAutoStart()">${voice.thinking?'⏳ Je corrige…':voice.listening?'🔴 Écoute en cours':'🎙 Corriger en parlant'}</button>`}<button class="btn btn-dark" onclick="voiceCancel()">Annuler</button></div>${voice.aiOff?'':`<form class="voice-textform" onsubmit="voiceTextSubmit(event)"><input id="voiceAnswer" type="text" placeholder="Ex. : le téléphone c’est le 06 12 34 56 78" autocomplete="off" aria-label="Correction écrite"><button class="btn btn-secondary" type="submit">Corriger ↗</button></form>`}`:
  `<div class="voice-state">${voice.thinking?'⏳ Le pilote réfléchit…':voice.listening?'🔴 Je t’écoute…':'🔊 À toi de répondre — le micro se lance au toucher'}</div><div class="voice-controls"><button class="btn btn-primary" onclick="voiceAutoStart()">${voice.thinking?'⏳ Patiente…':voice.listening?'🔴 Écoute en cours':'🎙 Répondre au micro'}</button><button class="btn btn-secondary" onclick="voiceSpeakCurrent()">🔊 Répéter la question</button>${voice.phase==='questions'&&(voice.aiOff||voice.editOnly)?`<button class="btn btn-dark" onclick="voiceApply('passe')">Passer</button>`:''}<button class="btn btn-dark" onclick="voiceCancel()">Annuler</button></div>
    <form class="voice-textform" onsubmit="voiceTextSubmit(event)"><input id="voiceAnswer" type="text" placeholder="Ou écrire une réponse ici…" autocomplete="off" aria-label="Réponse écrite"><button class="btn btn-secondary" type="submit">Envoyer ↗</button></form>`}
  ${voice.transcript?`<div class="voice-transcript">Dernière réponse : « ${esc(voice.transcript)} »</div>`:''}`;
  return `<section class="hero"><div class="kicker">✦ Copilote de dossier</div><h1>Parle. Je construis le dossier.</h1><p>Une information à la fois, sans perdre le fil. Le pilote prépare la fiche et te demande confirmation avant de l’enregistrer.</p></section><div class="voice-shell"><section class="voice-panel"><div class="kicker">🎙️ Entretien guidé</div><div class="voice-title">${voice.phase==='review'?'Vérification finale':voice.phase==='saved'?'Dossier prêt':'Création interactive'}</div>${content}${voice.error?`<div class="voice-warning">⚠ ${esc(voice.error)}</div>`:''}</section><aside class="voice-panel voice-side"><h3>Comment ça marche ?</h3><div class="voice-feature">1. Tu racontes le dossier à ta façon.</div><div class="voice-feature">2. Le pilote IA comprend tout ce que tu dis, même plusieurs infos d’un coup.</div><div class="voice-feature">3. Il pose seulement les questions qui manquent.</div><div class="voice-feature">4. Il te montre le récap, tu corriges en parlant, puis tu confirmes.</div><p>${voice.aiOff?'⚠ Pilote IA injoignable pour l’instant : questions classiques (règles locales).':'Le pilote utilise l’IA Gemini via ton site Netlify. Ta clé reste cachée sur le serveur.'}</p><p>${micOK?'✅ Reconnaissance vocale détectée dans ce navigateur.':'⚠ Reconnaissance vocale indisponible dans ce navigateur. La saisie écrite reste utilisable.'}</p><p>Le navigateur peut demander l’autorisation d’utiliser le micro. Selon l’appareil, tu devras retoucher le bouton micro à chaque réponse.</p><div class="voice-tip">Tu peux dire « passe », « je ne sais pas », « annuler » ou « enregistre » lors de la confirmation.</div><div class="voice-controls"><button class="btn btn-dark" onclick="go('expertises')">Expertises</button><button class="btn btn-dark" onclick="go('clients')">Clients</button><button class="btn btn-dark" onclick="go('taches')">Relances</button><button class="btn btn-dark" onclick="go('parametres')">Sauvegardes</button></div></aside></div>`;
}
// Ajoute un montant estimé saisissable ; un portefeuille vide affiche 0 et non un montant fictif.
configs.vehicules.fields.push(['montant','Montant estimé (€)','number']);

render();
</script>
