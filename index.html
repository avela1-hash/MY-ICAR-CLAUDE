// V13 — PLANNING EN CALENDRIER : semaine en haut, journée en dessous, code couleur par type
var cal={jour:new Date().toLocaleDateString('en-CA'),vue:'jour',mode:'jour'};
const CAL_TYPES={
  pret:{nom:'Prêt',c:'#C2610F',d:'#6B2E0A',t:'#FBEBDD',rgb:'217,115,26'},
  rdv:{nom:'Rendez-vous',c:'#2F62C9',d:'#14306B',t:'#E6EDFA',rgb:'47,98,201'},
  atelier:{nom:'Atelier',c:'#0E7C74',d:'#084843',t:'#E3F2F0',rgb:'14,124,116'}
};
function calType(e){
  const t=String(e.titre||'').toLowerCase();
  if(String(e.id||'').startsWith('pret-')||/\bpr[eê]t\b|voiture de pr|courtoisie/.test(t))return 'pret';
  if(/cabine|peinture|d[eé]mont|remont|atelier|travaux|r[eé]paration|carrosserie|pi[eè]ces?/.test(t))return 'atelier';
  return 'rdv';
}
function calISO(d){return d.toLocaleDateString('en-CA')}
function calDate(iso){const [y,m,j]=iso.split('-').map(Number);return new Date(y,m-1,j)}
function calNiveau(e){
  const auj=calISO(new Date());
  if(e.statut==='Terminé')return 'fait';
  if(e.date<auj)return 'urgent';
  if(e.date===auj){const h=e.heure||'23:59';const maint=new Date().toTimeString().slice(0,5);return h<maint?'urgent':'afaire'}
  return '';
}
// Plus l'échéance approche, plus la couleur est forte (semaine prochaine : très pâle, puis ça fonce jour après jour)
function calEcart(iso){return Math.round((calDate(iso)-calDate(calISO(new Date())))/864e5)}
function calAlpha(iso){const n=calEcart(iso);return n<=0?.55:n===1?.42:n<=3?.28:n<=7?.16:.07}
function calJourFond(iso){
  const ev=calDuJour(iso).filter(e=>e.statut!=='Terminé');if(!ev.length)return '';
  const T=CAL_TYPES[calType(ev.find(e=>calType(e)==='pret')||ev[0])];
  return ev.some(e=>calNiveau(e)==='urgent')?`background:${T.d};color:#fff;border-color:${T.d};`:`background:rgba(${T.rgb},${calAlpha(iso)*.7});border-color:rgba(${T.rgb},.35);`;
}
function calDuJour(iso){return db.planning.filter(e=>e.date===iso).sort((a,b)=>(a.heure||'99').localeCompare(b.heure||'99'))}
function calAller(iso){cal.anim=iso>cal.jour?'cal-anim-g':iso<cal.jour?'cal-anim-d':'';cal.jour=iso;render();cal.anim=''}
function calDecaler(n){const d=calDate(cal.jour);d.setDate(d.getDate()+n);calAller(calISO(d))}
// Glisser le doigt : sur la barre des jours = semaine, ailleurs = jour
(function(){let x0=null,y0=0,surSemaine=false;
  document.addEventListener('touchstart',e=>{if(page!=='planning'||cal.vue==='liste'||document.getElementById('modalhost').innerHTML){x0=null;return}const t=e.touches[0];x0=t.clientX;y0=t.clientY;surSemaine=!!(e.target.closest&&e.target.closest('#calSemaine,#calSemaine2'));if(!surSemaine&&!(e.target.closest&&e.target.closest('#calZone')))x0=null},{passive:true});
  document.addEventListener('touchend',e=>{if(x0===null)return;const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;x0=null;if(Math.abs(dx)<60||Math.abs(dy)>Math.abs(dx)*0.7)return;{const sens=dx<0?1:-1;if(cal.mode==='mois')calMois(sens);else calDecaler(sens*(surSemaine||cal.mode==='semaine'?7:1))}},{passive:true});
})();
function calFait(ev,id){ev.stopPropagation();const e=db.planning.find(x=>x.id===id);if(!e)return;e.statut=e.statut==='Terminé'?'Prévu':'Terminé';save(true);render();toast(e.statut==='Terminé'?'Fait ✓':'Remis à faire')}
function calAjouter(){edit('planning');const i=document.getElementById('f_date');if(i)i.value=cal.jour;const hh=document.getElementById('f_heure');if(hh&&!hh.value)hh.value='08:00';const s=document.getElementById('f_statut');if(s&&!s.value)s.value='Prévu';document.getElementById('f_heure')?.focus()}
function calVue(v){cal.vue=v;render()}
// Mois précédent = bleu-gris, mois en cours = blanc, mois suivant = sable
// Nom de la bande : « Cette semaine » seulement si elle contient aujourd'hui, sinon « Semaine du 23 nov. »
function calNomSemaine(dec){
  const sel=calDate(cal.jour),l=new Date(sel);l.setDate(sel.getDate()-((sel.getDay()+6)%7)+dec);
  const a=new Date(),la=new Date(a.getFullYear(),a.getMonth(),a.getDate());la.setDate(la.getDate()-((la.getDay()+6)%7));
  const n=Math.round((l-la)/(7*864e5));
  return {'-1':'Semaine dernière','0':'Cette semaine','1':'Semaine prochaine','2':'Dans 2 semaines'}[n]||'Semaine du '+l.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
}
function calMoisClasse(d){
  // Repère = aujourd'hui. La semaine en cours reste blanche. Mois passés en bleu, mois en cours blanc, mois suivant sable, celui d'après vert pâle.
  const a=new Date(),la=new Date(a.getFullYear(),a.getMonth(),a.getDate());la.setDate(la.getDate()-((la.getDay()+6)%7));
  const ld=new Date(d.getFullYear(),d.getMonth(),d.getDate());if(ld<la)return ' mois-prec';if(ld<new Date(la.getTime()+7*864e5))return '';
  const n=(d.getFullYear()*12+d.getMonth())-(a.getFullYear()*12+a.getMonth());
  return n<0?' mois-prec':n===0?'':n%2===1?' mois-suiv':' mois-suiv2';
}
// Toucher une date : on l'ouvre (vue Jour) et on descend directement sur ses rendez-vous
function calOuvrir(iso){cal.mode='jour';calAller(iso);setTimeout(()=>{const z=document.getElementById('calZone'),w=document.getElementById('calSel')||z;if(z){const y=w.getBoundingClientRect().top+window.scrollY-90;window.scrollTo({top:y,behavior:'smooth'});z.classList.remove('cal-flash');void z.offsetWidth;z.classList.add('cal-flash')}},60)}
// Raccourcis client : retrouve un numéro (dans le texte, ou chez le client du même nom) → boutons Appeler / SMS
function telTrouve(...txts){
  for(const t of txts){const m=String(t||'').match(/(?:\+33\s?|0)[1-9](?:[\s.-]?\d{2}){4}/);if(m)return m[0]}
  return '';
}
function telDe(e){
  let t=telTrouve(e.telephone,e.titre,e.notes);if(t)return t;
  const txt=String(e.client||e.titre||'').toLowerCase();
  const c=db.clients.find(c=>c.nom&&c.telephone&&txt.includes(String(c.nom).toLowerCase().replace(/^(m\.|mr|mme|monsieur|madame)\s*/,'')));
  return c?c.telephone:'';
}
function rappelRetour(e){
  const m=String(e.id||'').match(/^pret-(.+)-ret$/);if(!m)return '';
  const p=db.prets.find(x=>x.id===m[1]);if(!p||p.statut==='Retourné')return '';
  const G=garage().identite,d=p.date_retour?p.date_retour.split('-').reverse().join('/'):'',h=p.heure_retour?p.heure_retour.replace(':','h'):'';
  return `Bonjour ${p.client||''}, petit rappel de ${G.raison||'votre garage'} : le véhicule de prêt ${p.nom||''} est à rendre le ${d}${h?' à '+h:''}, comme convenu dans le contrat. En cas d’empêchement, appelez-nous au ${G.tel||''}. Merci !`;
}
function telBoutons(tel,petit,corps){
  if(!tel)return '';const n=String(tel).replace(/[^\d+]/g,'');
  return `<span class="tel-bt${petit?' petit':''}" onclick="event.stopPropagation()"><a href="tel:${esc(n)}" aria-label="Appeler ${esc(tel)}">📞<em> Appeler</em></a><a href="sms:${esc(n)}${corps?'?body='+encodeURIComponent(corps):''}" aria-label="${corps?'Envoyer le rappel de retour':'Envoyer un SMS au '+esc(tel)}">💬<em>${corps?' Rappel retour':' SMS'}</em></a></span>`;
}
function calMode(m){cal.anim='';cal.mode=m;render()}
function calMois(n){const d=calDate(cal.jour);d.setDate(1);d.setMonth(d.getMonth()+n);cal.anim=n>0?'cal-anim-g':'cal-anim-d';cal.jour=calISO(d);render();cal.anim=''}
function calOnglets(){return `<div class="cal-modes" role="tablist">${[['jour','Jour'],['semaine','Semaine'],['mois','Mois']].map(([m,l])=>`<button role="tab" aria-selected="${cal.mode===m}" class="${cal.mode===m?'on':''}" onclick="calMode('${m}')">${l}</button>`).join('')}</div>`}
function calLigne(e){const T=CAL_TYPES[calType(e)],niv=calNiveau(e);return `<div class="cal-ev ${niv}" style="--c:${T.c};--d:${T.d};--t:rgba(${T.rgb},${calAlpha(e.date)*.6});${niv===''&&e.statut!=='Terminé'?'background:var(--t)':''}" role="button" tabindex="0" onclick="edit('planning','${esc(e.id)}')"><span class="cal-h">${esc(e.heure||'—')}</span><span class="cal-txt"><b>${esc(e.titre||'Sans titre')}</b><span class="cal-type">${T.nom}${e.responsable?' · '+esc(e.responsable):''}${niv==='urgent'?' · en retard':niv==='afaire'?' · aujourd’hui':''}</span></span>${telBoutons(telDe(e),1)} ${telBoutons(telDe(e),1)}<button class="cal-ok" onclick="calFait(event,'${esc(e.id)}')" aria-label="${e.statut==='Terminé'?'Remettre à faire':'Marquer comme fait'}">${e.statut==='Terminé'?'↺':'✓'}</button></div>`}
function calEntete(titre,prec,suiv,retour){return header('Planning','',`<button class="btn btn-primary" onclick="calAjouter()">+ Ajouter</button>`)+calOnglets()+`<div class="cal-nav"><button class="cal-btn" onclick="${prec}" aria-label="Précédent">‹</button><span class="cal-mois">${esc(titre)}</span>${retour}<button class="cal-btn" onclick="${suiv}" aria-label="Suivant">›</button></div>`}
function planningSemaine(){
  const sel=calDate(cal.jour),auj=calISO(new Date());
  const lundi=new Date(sel);lundi.setDate(sel.getDate()-((sel.getDay()+6)%7));
  const dim=new Date(lundi);dim.setDate(lundi.getDate()+6);
  const f=d=>d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
  const dansSemaine=auj>=calISO(lundi)&&auj<=calISO(dim);
  const jours=[...Array(7)].map((_,i)=>{const d=new Date(lundi);d.setDate(lundi.getDate()+i);const iso=calISO(d),evs=calDuJour(iso);
    return `<div class="cal-sj${iso===auj?' auj':''}"><button class="cal-sj-tete" onclick="calOuvrir('${iso}')"><b>${esc(d.toLocaleDateString('fr-FR',{weekday:'long'}))}</b><span>${d.getDate()} ${esc(d.toLocaleDateString('fr-FR',{month:'short'}))}${iso===auj?' · aujourd’hui':''}</span></button>${evs.length?evs.map(calLigne).join(''):'<div class="cal-sj-vide">—</div>'}</div>`}).join('');
  return calEntete(`Semaine du ${f(lundi)} au ${f(dim)}`,'calDecaler(-7)','calDecaler(7)',dansSemaine?'':`<button class="cal-btn" onclick="calAller('${auj}')">Cette semaine</button>`).replace('class="cal-mois"','class="cal-mois" style="text-transform:none;font-size:15px"')
    +`<div id="calZone" class="${cal.anim||''}">${jours}<div class="cal-astuce">← Glisse le doigt pour changer de semaine →</div></div></section>`;
}
function planningMois(){
  const sel=calDate(cal.jour),auj=calISO(new Date());
  const premier=new Date(sel.getFullYear(),sel.getMonth(),1);
  const debut=new Date(premier);debut.setDate(1-((premier.getDay()+6)%7));
  const cases=[...Array(42)].map((_,i)=>{const d=new Date(debut);d.setDate(debut.getDate()+i);return d});
  const derniere=cases.findLastIndex(d=>d.getMonth()===sel.getMonth());const nb=Math.ceil((derniere+1)/7)*7;
  const grille=cases.slice(0,nb).map(d=>{const iso=calISO(d),evs=calDuJour(iso),hors=d.getMonth()!==sel.getMonth();
    const pts=evs.slice(0,3).map(e=>`<i style="background:${e.statut==='Terminé'?'#C5CAD3':CAL_TYPES[calType(e)].c}"></i>`).join('');
    return `<button class="cal-mc${calMoisClasse(d,sel)}${iso===auj?' auj':''}${iso===cal.jour?' sel':''}" style="${iso===cal.jour||hors?'':calJourFond(iso)}" onclick="calOuvrir('${iso}')" aria-label="${esc(d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}))}, ${evs.length} rendez-vous"><b>${d.getDate()}</b><span class="cal-points">${pts}</span>${evs.length>3?`<small>+${evs.length-3}</small>`:''}</button>`}).join('');
  const titre=sel.toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
  const ceMois=auj.slice(0,7)===cal.jour.slice(0,7);
  return calEntete(titre,'calMois(-1)','calMois(1)',ceMois?'':`<button class="cal-btn" onclick="calAller('${auj}')">Ce mois</button>`)
    +`<div id="calZone" class="${cal.anim||''}"><div class="cal-mt">${['L','M','M','J','V','S','D'].map(j=>`<span>${j}</span>`).join('')}</div><div class="cal-mg">${grille}</div>
    <div class="cal-legende" style="margin-top:14px">${Object.values(CAL_TYPES).map(T=>`<span style="--c:${T.c};--t:${T.t}">● ${T.nom}</span>`).join('')}</div>
    <div class="cal-astuce">Touche un jour pour l’ouvrir · glisse le doigt pour changer de mois</div></div></section>`;
}
function planningPage(){
  if(cal.mode==='semaine')return planningSemaine();
  if(cal.mode==='mois')return planningMois();
  const sel=calDate(cal.jour),auj=calISO(new Date());
  const lundi=new Date(sel);lundi.setDate(sel.getDate()-((sel.getDay()+6)%7));
  const jours=[...Array(7)].map((_,i)=>{const d=new Date(lundi);d.setDate(lundi.getDate()+i);return d});
  const mois=sel.toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
  const bande=ds=>ds.map(d=>{const iso=calISO(d),evs=calDuJour(iso);const pts=evs.slice(0,4).map(e=>`<i style="background:${CAL_TYPES[calType(e)].c}"></i>`).join('');
    const pr=d.getDate()===1;
    return `<button class="cal-jour${iso===auj?' auj':''}${iso===cal.jour?' sel':''}${calMoisClasse(d,sel)}${pr?' premier':''}" style="${iso===cal.jour?'':calJourFond(iso)}" onclick="calOuvrir('${iso}')" aria-label="${esc(d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}))}, ${evs.length} rendez-vous"><small>${pr?d.toLocaleDateString('fr-FR',{month:'short'}).replace('.',''):d.toLocaleDateString('fr-FR',{weekday:'short'}).replace('.','')}</small><b>${d.getDate()}</b><span class="cal-points">${pts}</span></button>`}).join('');
  const semaine=bande(jours);
  const apres2=bande(jours.map(d=>{const x=new Date(d);x.setDate(d.getDate()+14);return x}));
  const suivants=jours.map(d=>{const x=new Date(d);x.setDate(d.getDate()+7);return x});
  const prochaine=bande(suivants);
  const avant=bande(jours.map(d=>{const x=new Date(d);x.setDate(d.getDate()-7);return x}));
  const evs=calDuJour(cal.jour);
  const liste=evs.length?evs.map(e=>{const T=CAL_TYPES[calType(e)],niv=calNiveau(e);
    return `<div class="cal-ev ${niv}" style="--c:${T.c};--d:${T.d};--t:rgba(${T.rgb},${calAlpha(e.date)*.6});${niv===''&&e.statut!=='Terminé'?'background:var(--t)':''}" role="button" tabindex="0" onclick="edit('planning','${esc(e.id)}')"><span class="cal-h">${esc(e.heure||'—')}</span><span class="cal-txt"><b>${esc(e.titre||'Sans titre')}</b><span class="cal-type">${T.nom}${e.responsable?' · '+esc(e.responsable):''}${niv==='urgent'?' · en retard':niv==='afaire'?' · aujourd’hui':''}</span></span> ${telBoutons(telDe(e),1)}<button class="cal-ok" onclick="calFait(event,'${esc(e.id)}')" aria-label="${e.statut==='Terminé'?'Remettre à faire':'Marquer comme fait'}">${e.statut==='Terminé'?'↺':'✓'}</button></div>`}).join('')
    :`<div class="empty" style="padding:28px 0">Rien de prévu ce jour-là.<div class="buttons" style="justify-content:center"><button class="btn btn-primary" onclick="calAjouter()">+ Ajouter un rendez-vous</button></div></div>`;
  return header('Planning','',`<button class="btn btn-primary" onclick="calAjouter()">+ Ajouter</button>`)+calOnglets()
  +`<div class="cal-nav"><button class="cal-btn" onclick="calDecaler(-7)" aria-label="Semaine précédente">‹</button><span class="cal-mois">${esc(mois)}</span>${cal.jour!==auj?`<button class="cal-btn" onclick="calAller('${auj}')">Aujourd’hui</button>`:''}<button class="cal-btn" onclick="calDecaler(7)" aria-label="Semaine suivante">›</button></div>
  <div id="calSemaine" class="${cal.anim||''}"><div class="cal-sp-titre cal-sa-titre">${calNomSemaine(-7)}</div><div class="cal-semaine cal-sa">${avant}</div><div class="cal-sp-titre cal-sc-titre" id="calSel">${calNomSemaine(0)}</div><div class="cal-semaine">${semaine}</div></div>
  <div id="calZone" class="cal-dedans ${cal.anim||''}" style="--fl:${(((sel.getDay()+6)%7)+.5)/7*100}%"><div class="cal-titre">${cal.jour===auj?'Aujourd’hui · ':cal.jour===calISO(new Date(Date.now()+864e5))?'Demain · ':''}${esc(sel.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}))}</div>
  ${liste}<div class="cal-astuce">← Glisse le doigt pour changer de jour · sur la barre des jours pour changer de semaine →</div></div>
  <div id="calSemaine2"><div class="cal-sp-titre">${calNomSemaine(7)}</div><div class="cal-semaine cal-sp">${prochaine}</div><div class="cal-sp-titre">${calNomSemaine(14)}</div><div class="cal-semaine cal-sp">${apres2}</div></div>
  <div class="cal-legende">${Object.values(CAL_TYPES).map(T=>`<span style="--c:${T.c};--t:${T.t}">● ${T.nom}</span>`).join('')}</div>
  <div class="cal-legmois">${(()=>{const a=new Date();return '<span class="lp">Passé</span>'+[[0,'lc'],[1,'ls'],[2,'ls2']].map(([k,c])=>`<span class="${c}">${esc(new Date(a.getFullYear(),a.getMonth()+k,1).toLocaleDateString('fr-FR',{month:'long'}))}</span>`).join('')})()}</div>
  <div class="buttons" style="justify-content:flex-start;margin-top:10px"><button class="btn btn-dark" onclick="calVue('liste')">Voir tout en liste</button></div></section>`;
}

    <button class="ck-tuile" style="background:#E6EDFA;color:#1F4699" onclick="calAller('${auj}');go('planning')"><b>${rdv.filter(e=>e.statut!=='Terminé').length}</b><span>RDV du jour</span></button>
    <button class="ck-tuile" style="background:#FBEBDD;color:#8F4A0C" onclick="go('prets')"><b>${libres}/${flotte.length}</b><span>Prêts libres</span></button>
  </div>
  ${prio?`<div class="ck-prio" style="background:${prio.sec}"><small>${prio.lib}</small><p>${esc(prio.txt)}</p><button onclick="${prio.on}">${prio.bt} →</button></div>`:`<div class="ck-ok">✓ Rien d’urgent pour l’instant.</div>`}
  <div class="ck-bloc"><div class="ck-titre"><i style="background:#2F62C9"></i><h2 class="ck-h">Rendez-vous du jour</h2><button style="color:#1F4699" onclick="calAller('${auj}');go('planning')">Planning →</button></div>
    ${rdv.length?rdv.slice(0,4).map(e=>{const T=CAL_TYPES[calType(e)],n=calNiveau(e);const st=n==='urgent'?`background:${T.d};color:#fff;border-color:${T.d}`:n==='fait'?'opacity:.5':n==='afaire'?`background:${T.t};border-color:${T.t}`:'';return `<button class="ck-ligne" style="border-left:5px solid ${T.c};${st}" onclick="edit('planning','${esc(e.id)}')"><b style="color:${n==='urgent'?'#fff':T.d}">${esc(e.heure||'—')}</b><span>${esc(e.titre||'')}</span>${telBoutons(telDe(e),1)}</button>`}).join(''):'<div class="ck-vide">Aucun rendez-vous aujourd’hui.</div>'}
  </div>
  <div class="ck-bloc"><div class="ck-titre"><i style="background:#D9731A"></i><h2 class="ck-h">Voitures de prêt</h2><button style="color:#8F4A0C" onclick="go('prets')">Prêts →</button></div>
    <div class="ck-pre">${etats.map(e=>{const c=coulPre[e.n];return `<button style="background:${c[0]};color:${e.n===4?'#fff':'var(--ink)'};border-color:${c[2]}" onclick="${e.id?`edit('prets','${esc(e.id)}')`:`pretNouveau('${esc(e.f.nom)}')`}"><b>${esc(e.f.nom.replace(/^(Peugeot|Renault|Ford|Alfa Romeo)\s*/,m=>m.startsWith('Alfa')?'Alfa ':''))}</b><span style="color:${c[1]}">${esc(e.t)}</span></button>`}).join('')}</div>
  </div>
  <div class="ck-bloc"><div class="ck-titre"><i style="background:#0E7C74"></i><h2 class="ck-h">Atelier</h2><button style="color:#0B5F59" onclick="go('vehicules')">Dossiers →</button></div>
    <div class="ck-at">${etapes.map(([et,bg,fg])=>`<button style="background:${bg};color:${fg}" onclick="go('vehicules');filter='${et}';render()"><b>${dossiers.filter(x=>x.statut===et).length}</b><span>${et==='Prêt à livrer'?'À livrer':et}</span></button>`).join('')}</div>
  </div>
  <button class="btn btn-primary" style="justify-content:center" onclick="pgOpen()">🎙 Parler au pilote</button>
  </div>`;
}

// V14 — SIGNATURE À DISTANCE : le client reçoit un message clair + un lien, signe au doigt, la signature revient ici
function distanceTexte(p,lien){
  const G=garage().identite,dhx=(d,h)=>d?d.split('-').reverse().join('/')+(h?' à '+h.replace(':','h'):''):'à convenir';
  return `Bonjour ${p.client||''},
Voici votre contrat de prêt de véhicule – ${G.raison||'le garage'}.

🚗 Véhicule : ${p.nom||''}
📅 Départ : ${dhx(p.date_depart,p.heure_depart)}
🔙 Retour prévu : ${dhx(p.date_retour,p.heure_retour)}

Points importants :
• Vous êtes seul(e) responsable des infractions pendant le prêt (radar, stationnement, péage) et vous acceptez d’être désigné(e) comme conducteur.
• Retour à la date et à l’heure prévues, dans le même état et avec le même niveau de carburant.
• Vous seul(e) conduisez le véhicule, avec un permis valide.
• En cas d’accident ou de problème, appelez le garage au ${G.tel||''}.

👉 Ouvrez ce lien pour accepter l’heure de retour, prendre la photo de votre permis et signer avec le doigt :
${lien}

Merci !`;
}
function distanceSheet(p){
  if(!p)return;
  if(!p.sign_jeton||(p.sign_expire&&Date.parse(p.sign_expire)<Date.now())){p.sign_jeton=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now()).replace(/-/g,'');p.sign_expire=new Date(Date.now()+7*864e5).toISOString();save(true);if(typeof syncNow==='function')syncNow()}
  const lien=`${location.origin}/signer.html?p=${encodeURIComponent(p.id)}&j=${p.sign_jeton}`;
  const t=distanceTexte(p,lien),tel=String(p.telephone||'').replace(/[^\d+]/g,'');
  const sujet=`Contrat de prêt – ${p.nom||'véhicule'} – ${garage().identite.raison||''}`;
  document.getElementById('modalhost').innerHTML=`<div class="modalback" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()"><h2>📩 Faire signer à distance</h2><p class="t-muted" style="margin-top:-8px">Le client reçoit ce message, ouvre le lien, signe avec le doigt (et peut joindre son permis). La signature arrive toute seule dans le prêt.</p>${sync.code?'':'<div class="voice-warning">Ce téléphone n’est pas relié à la base partagée : le lien ne marchera pas tant que tu n’as pas saisi le code d’équipe.</div>'}<div class="sms-texte" id="smsT">${esc(t)}</div><div class="buttons">${tel?`<a class="btn btn-primary" style="text-decoration:none" href="sms:${esc(tel)}?body=${encodeURIComponent(t)}">📱 SMS</a>`:''}<a class="btn btn-secondary" style="text-decoration:none" href="mailto:${esc(p.email||'')}?subject=${encodeURIComponent(sujet)}&body=${encodeURIComponent(t)}">✉️ E-mail</a><button type="button" class="btn btn-dark" onclick="smsCopier()">Copier</button><button type="button" class="btn btn-dark" onclick="closeModal()">Fermer</button></div><p class="t-muted" style="font-size:13px">Lien valable 7 jours, une seule signature.${tel?'':' Ajoute le téléphone du client pour l’envoi par SMS.'}</p></div></div>`;
}

// V14 — BIQUETTE, la chèvre du cockpit : suit ton doigt des yeux, saute, danse, broute, parle
var chv={n:0,t:0,appui:null,parle:0};
const CHV_PHRASES=()=>{
  const g=typeof garage==='function'?garage():{flotte:[]},auj=localISO();
  const libres=g.flotte.filter(f=>!db.prets.some(p=>p.nom===f.nom&&(p.statut==='Prêté'||p.statut==='Réservé'))).length;
  const rdv=db.planning.filter(e=>e.date===auj&&e.statut!=='Terminé').length;
  const qui=(typeof sync!=='undefined'&&sync.nom&&sync.nom!=='Aurel')?sync.nom:'Aurélien';
  return ['Bêêê !','Coucou '+qui+' !',...(qui==='Enzo'?['Salut Enzo, ton père t’embrasse ❤️']:[]),libres+' voiture'+(libres>1?'s':'')+' de prêt libre'+(libres>1?'s':'')+' 🚗',rdv?rdv+' rendez-vous aujourd’hui 📅':'Rien au planning aujourd’hui 😌','On lâche rien ! 💪','Miam, du bon foin…','La peinture sèche ? 🎨'];
};
function chvDire(t){const b=document.getElementById('chvBulle');if(!b)return;b.textContent=t;b.classList.add('on');clearTimeout(chv.parle);chv.parle=setTimeout(()=>b.classList.remove('on'),2200)}
function chvCoeurs(n){const box=document.getElementById('chvBox');if(!box)return;for(let i=0;i<n;i++){const c=document.createElement('span');c.className='chv-coeur';c.textContent=['💛','💚','🧡','✨'][i%4];c.style.left=(70+Math.random()*36)+'px';c.style.top=(6+Math.random()*14)+'px';c.style.setProperty('--dx',(Math.random()*40-20)+'px');c.style.setProperty('--r',(Math.random()*40-20)+'deg');c.style.animationDelay=(i*.08)+'s';box.appendChild(c);setTimeout(()=>c.remove(),1400)}}
function chvJouer(cls,ms){const g=document.getElementById('chv');if(!g)return;g.classList.remove('saute','danse','broute');void g.getBoundingClientRect();g.classList.add(cls,'content');setTimeout(()=>{g.classList.remove(cls,'content')},ms)}
function chvToucher(){
  const now=Date.now();chv.n=now-chv.t<700?chv.n+1:1;chv.t=now;
  if(chv.n>=3){chv.n=0;chvJouer('danse',1400);chvCoeurs(6);chvDire('Youpiii ! 💃');return}
  chvJouer('saute',900);chvCoeurs(2);const ph=CHV_PHRASES();chvDire(ph[Math.floor(Math.random()*ph.length)]);
  try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}
}
function chvRegarde(x,y){
  const g=document.getElementById('chv');if(!g)return;const r=g.getBoundingClientRect();if(!r.width)return;
  const cx=r.left+r.width*.74,cy=r.top+r.height*.23,dx=x-cx,dy=y-cy,d=Math.hypot(dx,dy)||1,k=Math.min(1,d/160)*2.2;
  g.querySelectorAll('.chv-pup').forEach(p=>p.setAttribute('transform',`translate(${(dx/d*k).toFixed(2)} ${(dy/d*k).toFixed(2)})`));
}
document.addEventListener('pointermove',e=>{if(page==='dashboard')chvRegarde(e.clientX,e.clientY)},{passive:true});
document.addEventListener('pointerdown',e=>{
  if(page!=='dashboard')return;chvRegarde(e.clientX,e.clientY);
  if(!(e.target.closest&&e.target.closest('#chv')))return;
  clearTimeout(chv.appui);chv.long=false;chv.appui=setTimeout(()=>{chv.long=true;chvJouer('broute',1600);chvDire('Miam miam… 🌿')},550);
},{passive:true});
document.addEventListener('pointerup',e=>{
  if(page!=='dashboard')return;clearTimeout(chv.appui);
  if(e.target.closest&&e.target.closest('#chv')&&!chv.long)chvToucher();
},{passive:true});
// Quand personne ne touche : elle regarde autour d'elle de temps en temps
setInterval(()=>{if(page!=='dashboard'||document.hidden)return;const g=document.getElementById('chv');if(!g)return;const r=g.getBoundingClientRect();chvRegarde(r.left+(Math.random()-.5)*400,r.top+(Math.random()-.2)*300)},3200);

render();
pgRender();
syncBadge();
if(sync.code)syncNow();else syncDemanderCode();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('/sw.js').catch(()=>{});
setInterval(()=>{if(page==='dashboard'&&!document.getElementById('modalhost').innerHTML)render()},60000);
</script>
