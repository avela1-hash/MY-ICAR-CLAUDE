<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My I-Car</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#06111f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My I-Car">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<style>
:root{
  --bg:#06111f;
  --bg2:#08172a;
  --panel:#0e1c31;
  --panel2:#12233b;
  --panel3:#102139;
  --line:rgba(117,174,255,.16);
  --softline:rgba(255,255,255,.06);
  --text:#f3f7ff;
  --muted:#94a3bf;
  --teal:#73e0cd;
  --teal2:#49cbb7;
  --green:#56d7c7;
  --cyan:#73d0ff;
  --amber:#f3b35e;
  --amber-soft:rgba(243,179,94,.18);
  --red:#dd7382;
  --red-soft:rgba(221,115,130,.18);
  --violet:#8c7cff;
  --violet-soft:rgba(140,124,255,.18);
  --shadow:0 18px 44px rgba(0,0,0,.32);
  --radius:26px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 72% 18%, rgba(43,184,160,.20), transparent 22%),
    radial-gradient(circle at 40% 12%, rgba(73,103,255,.18), transparent 24%),
    linear-gradient(180deg,#040c18 0%, #081120 30%, #071320 100%);
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:0 18px 110px}
.topbar{
  position:sticky;top:0;z-index:40;
  backdrop-filter:blur(14px);
  background:linear-gradient(180deg,rgba(4,12,24,.95),rgba(4,12,24,.78));
  border-bottom:1px solid rgba(255,255,255,.05);
}
.topbar-inner{max-width:1280px;margin:0 auto;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:48px;height:48px;border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.08);display:grid;place-items:center;box-shadow:var(--shadow)}
.mark img{width:34px;height:34px;display:block;opacity:.92}
.brand-title{font-size:24px;font-weight:900;letter-spacing:-.03em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ver{font-size:12px;font-weight:900;padding:6px 10px;border-radius:999px;background:linear-gradient(180deg,rgba(115,224,205,.26),rgba(115,224,205,.14));color:#a9fff0;border:1px solid rgba(115,224,205,.26)}
.brand-sub{font-size:13px;color:var(--muted);margin-top:4px}
.top-badge{padding:10px 13px;border-radius:14px;background:rgba(115,224,205,.10);border:1px solid rgba(115,224,205,.16);color:#baffef;font-weight:800;font-size:13px}
.hero{
  margin-top:18px;
  border-radius:34px;
  padding:28px 24px;
  background:
    radial-gradient(circle at 78% 20%, rgba(115,224,205,.18), transparent 22%),
    radial-gradient(circle at 60% 10%, rgba(88,110,255,.15), transparent 28%),
    linear-gradient(180deg, rgba(15,28,49,.96), rgba(11,23,40,.96));
  border:1px solid rgba(115,208,255,.18);
  box-shadow:var(--shadow);
}
.kicker{font-size:12px;font-weight:900;letter-spacing:.24em;text-transform:uppercase;color:#87f7e2;display:flex;align-items:center;gap:8px}
.hero h1{font-size:clamp(38px,6vw,66px);line-height:1.04;letter-spacing:-.045em;margin:14px 0 14px;max-width:780px}
.hero p{font-size:clamp(18px,2.8vw,22px);line-height:1.5;color:#adc0dc;max-width:850px;margin:0}
.hero-actions{display:flex;gap:14px;flex-wrap:wrap;margin-top:24px}
.btn{border:0;border-radius:20px;padding:18px 24px;font-size:17px;font-weight:900;line-height:1;display:inline-flex;align-items:center;gap:10px}
.btn-primary{background:linear-gradient(180deg,#76e3d1,#67d8c7);color:#062222;box-shadow:0 14px 30px rgba(103,216,199,.25)}
.btn-secondary{background:rgba(13,33,53,.75);color:#9ff6e6;border:1px solid rgba(115,224,205,.22)}
.btn-dark{background:rgba(255,255,255,.03);color:#d7e6ff;border:1px solid rgba(255,255,255,.08)}
.hint-card{margin-top:20px;border-radius:24px;padding:18px 18px;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.02));border:1px solid rgba(115,208,255,.14)}
.hint-card strong{display:block;font-size:21px;margin-bottom:8px}
.hint-card span{display:block;font-size:17px;color:#afbed6;line-height:1.55}
.grid{display:grid;gap:16px}
.metrics{grid-template-columns:repeat(4,minmax(0,1fr));margin-top:18px}
.card{
  background:linear-gradient(180deg,rgba(13,27,47,.96),rgba(10,22,39,.96));
  border:1px solid rgba(112,162,234,.16);
  border-radius:30px;
  box-shadow:var(--shadow);
}
.metric{padding:22px 20px 20px;min-height:170px;display:flex;flex-direction:column;justify-content:space-between}
.metric-label{font-size:15px;font-weight:700;color:#aab9d1}
.metric-num{font-size:58px;font-weight:900;letter-spacing:-.05em;line-height:1;margin:16px 0 8px}
.metric-sub{font-size:16px;color:#91a4c0;line-height:1.45}
.metric .orange{color:#ffcb74}
.metric .mint{color:var(--teal)}
.metric .white{color:#f5f7fd}
.section{margin-top:22px;padding:22px}
.section-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.section-title{font-size:21px;font-weight:900;letter-spacing:-.03em;display:flex;align-items:center;gap:10px}
.section-badge{padding:10px 14px;border-radius:14px;font-size:14px;font-weight:900;border:1px solid transparent}
.badge-amber{background:var(--amber-soft);color:#ffcf87;border-color:rgba(243,179,94,.24)}
.badge-violet{background:var(--violet-soft);color:#c8bdff;border-color:rgba(140,124,255,.24)}
.badge-mint{background:rgba(115,224,205,.10);color:#a7fff3;border-color:rgba(115,224,205,.22)}
.alert-list{display:grid;gap:14px}
.alert-item{border-radius:22px;padding:18px;background:linear-gradient(180deg,rgba(16,33,58,.90),rgba(15,28,49,.92));border:1px solid rgba(255,255,255,.08);display:flex;gap:16px;align-items:flex-start}
.alert-icon{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:24px;font-weight:900;flex:0 0 auto;border:1px solid rgba(255,255,255,.06)}
.icon-red{background:var(--red-soft);color:#ffc3ce}
.icon-amber{background:var(--amber-soft);color:#ffcf87}
.alert-body strong{display:block;font-size:18px;line-height:1.35;margin-bottom:6px}
.alert-body p{margin:0;color:#9caeca;font-size:15px;line-height:1.5}
.alert-actions{display:flex;gap:22px;flex-wrap:wrap;margin-top:14px}
.text-link{font-size:16px;font-weight:900}
.text-link.mint{color:#8ff2df}
.text-link.muted{color:#9dacbf}
.two-col{grid-template-columns:1.15fr .85fr;margin-top:22px}
.info-card{padding:22px}
.info-card h3{font-size:19px;margin:0 0 14px;display:flex;align-items:center;gap:10px}
.info-text{padding:18px;border-radius:20px;background:linear-gradient(180deg,rgba(62,173,152,.13),rgba(62,173,152,.08));border:1px solid rgba(115,224,205,.18);font-size:17px;line-height:1.65;color:#d9edf1}
.mini-graph{height:210px;display:flex;align-items:flex-end;justify-content:center;padding:20px 10px 10px}
.spark{width:100%;max-width:320px;height:130px;position:relative}
.spark svg{width:100%;height:100%}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.search,.select,.field input,.field textarea,.field select{
  width:100%;background:rgba(9,20,36,.95);color:#f0f6ff;border:1px solid rgba(120,151,198,.18);border-radius:18px;padding:16px 17px;font-size:16px;outline:none;
}
.search:focus,.select:focus,.field input:focus,.field textarea:focus,.field select:focus{border-color:rgba(115,224,205,.35);box-shadow:0 0 0 4px rgba(115,224,205,.08)}
.grow{flex:1;min-width:230px}.w240{width:240px;max-width:100%}
.table-card{overflow:hidden}
.table-scroll{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:780px}
th,td{padding:16px 18px;text-align:left;border-bottom:1px solid rgba(255,255,255,.06)}
th{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#7f93b3;font-weight:900;background:rgba(255,255,255,.02)}
td{font-size:15px;color:#edf4ff;vertical-align:top}
tr:hover td{background:rgba(255,255,255,.012)}
.t-muted{color:#a8b6cb}
.pill{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:8px 12px;font-size:13px;font-weight:900;border:1px solid transparent;white-space:nowrap}
.pill.red{background:var(--red-soft);color:#ffc0cb;border-color:rgba(221,115,130,.22)}
.pill.orange{background:var(--amber-soft);color:#ffd08e;border-color:rgba(243,179,94,.22)}
.pill.green{background:rgba(115,224,205,.10);color:#b4fff1;border-color:rgba(115,224,205,.2)}
.pill.gray{background:rgba(255,255,255,.05);color:#cad6e8;border-color:rgba(255,255,255,.07)}
.table-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn-mini{border:0;border-radius:14px;padding:10px 12px;font-size:14px;font-weight:900}
.btn-edit{background:rgba(115,224,205,.12);color:#affff1}
.btn-del{background:rgba(221,115,130,.16);color:#ffc5d0}
.table-foot{padding:14px 18px;color:#90a2bd;font-size:14px}
.empty{padding:32px 18px;color:#9cb0cc;text-align:center;font-size:16px}
.modalback{position:fixed;inset:0;background:rgba(0,8,16,.7);display:grid;place-items:center;z-index:70;padding:18px}
.modal{width:min(760px,100%);max-height:92vh;overflow:auto;background:linear-gradient(180deg,#0d1b2f,#0b182b);border:1px solid rgba(118,164,235,.18);border-radius:28px;padding:22px;box-shadow:var(--shadow)}
.modal h2{margin:0 0 18px;font-size:30px;letter-spacing:-.04em}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{margin-bottom:14px}
.field label{display:block;font-size:14px;font-weight:900;color:#d5e4fb;margin-bottom:8px}
.field textarea{min-height:100px;resize:vertical}
.buttons{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:20px}
.notice{padding:18px;border-radius:20px;background:linear-gradient(180deg,rgba(19,43,56,.9),rgba(14,34,48,.88));border:1px solid rgba(115,224,205,.18);color:#d2edf0;font-size:16px;line-height:1.6}
.help-grid,.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.step-card,.settings-card{padding:20px}
.step-num{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:rgba(115,224,205,.14);border:1px solid rgba(115,224,205,.20);color:#b5fff1;font-weight:900;margin-bottom:12px}
.step-card h3,.settings-card h3{margin:0 0 10px;font-size:22px}
.step-card p,.settings-card p{margin:0;color:#a6b8d1;font-size:16px;line-height:1.6}
.mobile-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  padding:10px 10px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(5,12,22,.88),rgba(5,12,22,.96));backdrop-filter:blur(16px);border-top:1px solid rgba(255,255,255,.05)
}
.mobile-nav-grid{max-width:900px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.mtab{border:0;background:transparent;color:#a3b4cb;border-radius:22px;padding:12px 2px 10px;min-width:0;font-size:12px;font-weight:800;line-height:1.15;display:flex;flex-direction:column;align-items:center;gap:6px}
.mtab .ico{font-size:24px;line-height:1}
.mtab.active{background:linear-gradient(180deg,rgba(59,142,127,.32),rgba(34,90,79,.24));color:#9ff5e6;border:1px solid rgba(115,224,205,.18)}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#10283a;color:#e8f9ff;border:1px solid rgba(115,224,205,.2);padding:13px 18px;border-radius:16px;display:none;z-index:80;font-size:15px;font-weight:900}
@media (max-width:1100px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.two-col{grid-template-columns:1fr}}
@media (max-width:760px){
  .wrap{padding:0 14px 110px}
  .topbar-inner{padding:12px 14px}
  .brand-title{font-size:20px}
  .mark{width:42px;height:42px}.mark img{width:30px;height:30px}
  .top-badge{display:none}
  .hero{padding:24px 18px;border-radius:30px}
  .hero p{font-size:18px}
  .btn{width:100%;justify-content:center}
  .metrics{grid-template-columns:1fr 1fr}
  .metric{min-height:150px;padding:20px 18px}
  .metric-num{font-size:48px}
  .section{padding:18px}
  .alert-item{padding:16px}
  .fields,.help-grid,.settings-grid{grid-template-columns:1fr}
}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:16px}
.menu-tile{display:flex;align-items:center;gap:14px;padding:18px;text-align:left;color:inherit;font:inherit;cursor:pointer;border:1px solid rgba(255,255,255,.08)}
.menu-tile:active{transform:scale(.98)}
.menu-ico{width:46px;height:46px;flex:none;border-radius:16px;display:grid;place-items:center;font-size:22px;background:rgba(115,224,205,.14);color:#9ff6e6}
.menu-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}.menu-txt strong{font-size:17px}.menu-txt small{color:#9db0cc;font-size:14px}
.menu-count{font-weight:900;font-size:18px;color:#cfe0f5;background:rgba(255,255,255,.07);border-radius:12px;padding:6px 11px}
.metric.click{cursor:pointer}.metric.click:active{transform:scale(.98)}
 @media (max-width:760px){
  .table-scroll{overflow:visible}
  .table-card table,.table-card tbody,.table-card tr,.table-card td{display:block;width:100%;min-width:0}
  .table-card thead{display:none}
  .table-card tbody tr{padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.07)}
  .table-card td{border:0!important;padding:5px 0!important;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:right;white-space:normal}
  .table-card td[data-label]::before{content:attr(data-label);color:#8aa0bf;font-size:13px;font-weight:800;text-align:left;flex:none;max-width:45%}
  .table-card td:first-child{font-size:17px;font-weight:900}
  .table-card td.td-actions{padding-top:10px!important}
  .table-card .table-actions{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .table-card .btn-mini{padding:12px;font-size:15px}
  .table-card td[colspan]{display:block}
}
@media (max-width:520px){.metrics{grid-template-columns:1fr}.hero h1{font-size:34px}.metric-num{font-size:44px}.section-title{font-size:19px}.mobile-nav-grid{gap:6px}.mtab{font-size:11px}.mtab .ico{font-size:22px}}

/* Pilote vocal : contraste et ergonomie tactile */
.voice-entry{margin-top:18px;padding:18px 20px;border:1px solid rgba(115,224,205,.25);border-radius:26px;background:linear-gradient(135deg,rgba(49,141,132,.22),rgba(22,31,64,.25));display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}
.voice-entry h3{font-size:23px;margin:0 0 7px}.voice-entry p{font-size:16px;color:#b8c9dd;margin:0}.voice-entry .btn{padding:15px 20px}
.voice-shell{margin-top:18px;display:grid;gap:18px;grid-template-columns:minmax(0,1.5fr) minmax(260px,.85fr)}
.voice-panel{padding:24px;background:linear-gradient(150deg,rgba(17,37,59,.99),rgba(11,24,43,.96));border:1px solid rgba(115,224,205,.17);border-radius:30px;box-shadow:var(--shadow)}
.voice-title{font-size:clamp(25px,4vw,37px);letter-spacing:-.04em;font-weight:900;margin:10px 0 12px;line-height:1.15}
.voice-intro{font-size:17px;line-height:1.55;color:#a8bdd7}
.voice-progress{display:flex;justify-content:space-between;align-items:center;margin:20px 0 12px;color:#b9cee4;font-size:14px;font-weight:800}
.voice-progressbar{height:9px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden}
.voice-progressbar>div{height:100%;border-radius:999px;background:linear-gradient(90deg,#4cb7aa,#7bf6dd);transition:width .2s}
.voice-question{font-size:24px;font-weight:850;line-height:1.4;letter-spacing:-.025em;padding:23px;border-radius:22px;background:linear-gradient(120deg,rgba(115,224,205,.13),rgba(140,124,255,.10));border:1px solid rgba(115,224,205,.18);margin:18px 0}
.voice-state{font-size:15px;font-weight:750;color:#9fe7d8;margin:10px 0}
.voice-controls{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.voice-controls .btn{font-size:16px;padding:15px 19px}
.voice-textform{display:flex;gap:9px;margin-top:12px}.voice-textform input{min-width:0;flex:1;width:auto;background:#08172b;border:1px solid rgba(157,181,214,.26);border-radius:18px;padding:16px;color:#f3f7ff;font-size:17px}.voice-textform button{white-space:nowrap}
.voice-transcript{margin-top:12px;padding:15px;border-radius:18px;background:rgba(5,13,27,.65);border:1px solid rgba(255,255,255,.06);color:#c4d3e8;font-size:15px;line-height:1.6}
.voice-summary{display:grid;gap:9px;margin:14px 0}
.voice-srow{display:grid;grid-template-columns:minmax(135px, .9fr) 1.5fr auto;align-items:center;gap:10px;background:rgba(255,255,255,.025);border-radius:15px;padding:11px 12px;border:1px solid rgba(255,255,255,.06)}
.voice-srow small{font-size:14px;color:#97abc6}.voice-srow strong{font-size:16px;overflow-wrap:anywhere}.voice-srow button{border:0;background:rgba(115,224,205,.11);color:#b0fff1;border-radius:12px;padding:9px 12px;font-size:14px;font-weight:800}
.voice-side h3{font-size:21px;margin:0 0 12px}.voice-side p{font-size:16px;color:#adbfda;line-height:1.65}
.voice-feature{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.07);color:#e0ecff;font-size:15px;line-height:1.6}.voice-feature:last-child{border:0}
.voice-tip{color:#9df9e7;font-size:14px;font-weight:800;margin-top:12px}
.voice-warning{color:#ffd190;background:rgba(243,179,94,.10);border:1px solid rgba(243,179,94,.18);border-radius:15px;padding:12px 14px;font-size:14px;line-height:1.45;margin:10px 0}
.voice-entry-card{padding:24px;border-radius:28px;border:1px solid rgba(115,224,205,.16);background:linear-gradient(140deg,rgba(35,81,83,.28),rgba(12,24,43,.96));margin-top:18px}
.voice-entry-card h2{font-size:26px;margin:0 0 10px}.voice-entry-card p{font-size:17px;line-height:1.55;color:#adc5d5}
@media(max-width:900px){.voice-shell{grid-template-columns:1fr}.voice-panel{padding:19px}.voice-question{font-size:21px;padding:18px}.voice-srow{grid-template-columns:1fr auto;gap:5px}.voice-srow small{grid-column:1}.voice-srow strong{grid-column:1}.voice-srow button{grid-column:2;grid-row:1/3}.voice-textform{flex-direction:column}.voice-textform button{width:100%}}
/* V9 — Pilote global : bouton micro flottant + panneau de conversation, sur toutes les pages */
.pg-fab{position:fixed;right:18px;bottom:104px;z-index:60;width:68px;height:68px;border-radius:50%;border:0;background:linear-gradient(180deg,#76e3d1,#5fcfbe);color:#062222;font-size:30px;box-shadow:0 14px 34px rgba(103,216,199,.38);display:grid;place-items:center;cursor:pointer}
.pg-fab.on{background:linear-gradient(180deg,#ff8a9a,#e5677a);color:#fff;animation:pgpulse 1.2s infinite}
@keyframes pgpulse{0%{box-shadow:0 0 0 0 rgba(229,103,122,.55)}70%{box-shadow:0 0 0 18px rgba(229,103,122,0)}100%{box-shadow:0 0 0 0 rgba(229,103,122,0)}}
.pg-panel{position:fixed;right:18px;bottom:104px;z-index:65;width:min(440px,calc(100vw - 32px));max-height:min(640px,calc(100vh - 140px));display:flex;flex-direction:column;background:linear-gradient(160deg,#0f2236,#08131f);border:1px solid rgba(115,224,205,.22);border-radius:26px;box-shadow:0 26px 60px rgba(0,0,0,.55);overflow:hidden}
.pg-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid rgba(255,255,255,.07)}
.pg-head strong{font-size:18px;color:#eafcff}.pg-head small{display:block;color:#8fb2bf;font-size:13px;margin-top:3px}
.pg-x{border:0;background:rgba(255,255,255,.07);color:#cfe3f2;border-radius:12px;width:40px;height:40px;font-size:18px;cursor:pointer}
.pg-log{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:9px;min-height:120px}
.pg-msg{max-width:88%;padding:11px 14px;border-radius:17px;font-size:15.5px;line-height:1.45;overflow-wrap:anywhere}
.pg-msg.aurel{align-self:flex-end;background:rgba(115,224,205,.16);color:#dffcf6;border-bottom-right-radius:5px}
.pg-msg.pilote{align-self:flex-start;background:rgba(255,255,255,.06);color:#e3ecf8;border-bottom-left-radius:5px}
.pg-msg .pg-done{display:block;margin-top:6px;font-size:13px;color:#9df9e7;font-weight:800}
.pg-chips{display:flex;flex-wrap:wrap;gap:7px}
.pg-chip{border:1px solid rgba(115,224,205,.25);background:rgba(115,224,205,.07);color:#bff8ee;border-radius:14px;padding:9px 11px;font-size:14px;text-align:left;cursor:pointer}
.pg-foot{padding:12px 16px 16px;border-top:1px solid rgba(255,255,255,.07);display:grid;gap:10px}
.pg-state{font-size:14px;font-weight:800;color:#9fe7d8;min-height:18px}
.pg-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pg-mic{flex:1;border:0;border-radius:18px;padding:16px;font-size:17px;font-weight:900;background:linear-gradient(180deg,#76e3d1,#67d8c7);color:#062222;cursor:pointer}
.pg-mic.on{background:linear-gradient(180deg,#ff8a9a,#e5677a);color:#fff}
.pg-small{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#d5e4f3;border-radius:14px;padding:11px 12px;font-size:14px;font-weight:800;cursor:pointer}
.pg-small.ok{border-color:rgba(115,224,205,.4);color:#9df9e7}
.pg-text{display:flex;gap:8px}.pg-text input{flex:1;min-width:0;background:#08172b;border:1px solid rgba(157,181,214,.26);border-radius:14px;padding:12px;color:#f3f7ff;font-size:16px}
.pg-warn{color:#ffd190;background:rgba(243,179,94,.10);border:1px solid rgba(243,179,94,.18);border-radius:13px;padding:9px 11px;font-size:13.5px;line-height:1.4}
@media(max-width:600px){.pg-panel{right:8px;left:8px;width:auto;bottom:96px;max-height:calc(100vh - 120px)}.pg-fab{right:14px;bottom:98px}}
</style>

<script>
const STORAGE_KEY='myicar_v8_data';
const LEGACY_KEYS=['myicar_v7_data','myicar_v6_data','myicar_v5_data','myicar_v4_data'];
const initial={expertises:[],vehicules:[],prets:[],clients:[],taches:[],planning:[]};
let db=load(), page='dashboard', query='', filter='';
const sections=[
  ['dashboard','◈','Cockpit'],
  ['vehicules','▤','Dossiers'],
  ['planning','▦','Planning'],
  ['prets','▬','Prêts'],
  ['assistant','✦','Dossier vocal'],
  ['menu','☰','Plus']
];
// Pages rangées sous « Plus » : l'onglet reste allumé quand on y est.
const MENU_PAGES=['menu','clients','expertises','taches','aide','parametres','installer'];
const configs={
  expertises:{sing:'expertise',title:'Expertises',cols:[['client','Client'],['immatriculation','Immatriculation'],['date','Date RDV'],['statut','Statut'],['notes','Observations']],fields:[['client','Client','text',1],['immatriculation','Immatriculation','text'],['date','Date de rendez-vous','date'],['statut','Statut','select','',['Sans RDV','RDV fixé','Réalisée','À relancer']],['notes','Observations','textarea']]},
  vehicules:{sing:'dossier',title:'Dossiers',cols:[['client','Client'],['modele','Véhicule'],['immatriculation','Immatriculation'],['statut','Étape'],['priorite','Priorité']],fields:[['client','Client','text',1],['modele','Modèle','text'],['immatriculation','Immatriculation','text'],['statut','Étape','select','',['À chiffrer','En attente','À planifier','En travaux','Peinture','Prêt à livrer','Livré']],['priorite','Priorité (1 à 10)','number'],['montant','Montant estimé des travaux (€)','number'],['notes','Observations','textarea']]},
  prets:{sing:'prêt',title:'Prêts',cols:[['nom','Véhicule de prêt'],['client','Client'],['date_depart','Départ',r=>dateHeure(r.date_depart,r.heure_depart)],['date_retour','Retour prévu',r=>dateHeure(r.date_retour,r.heure_retour)],['statut','Statut',r=>pretEnRetard(r)?'<span class="pill red">En retard</span>':status(r.statut)]],fields:[['nom','Véhicule de prêt','text',1],['client','Client bénéficiaire','text'],['telephone','Téléphone du client','tel'],['date_depart','Date de départ','date'],['heure_depart','Heure de départ','time'],['date_retour','Retour prévu le','date'],['heure_retour','Heure de retour prévue','time'],['statut','Statut','select','',['Disponible','Réservé','Prêté','Retourné']],['km_retour','Kilométrage au retour','number'],['notes','Observations','textarea']]},
  planning:{sing:'rendez-vous',title:'Planning',cols:[['date','Date'],['heure','Heure'],['titre','Intervention / RDV'],['responsable','Responsable'],['statut','Statut']],fields:[['date','Date','date',1],['heure','Heure','time'],['titre','Intervention / RDV','text',1],['responsable','Responsable','select','',['Enzo','IB','Brahim','Aurel','Autre']],['statut','Statut','select','',['Prévu','En cours','Terminé']],['notes','Observations','textarea']]},
  clients:{sing:'client',title:'Clients',cols:[['nom','Nom'],['telephone','Téléphone'],['email','E-mail'],['vehicule','Véhicule'],['notes','Observations']],fields:[['nom','Nom du client','text',1],['telephone','Téléphone','tel'],['email','E-mail','email'],['vehicule','Véhicule','text'],['notes','Observations','textarea']]},
  taches:{sing:'signal',title:'Pilote',cols:[['titre','Tâche / signal'],['client','Client'],['echeance','Échéance'],['responsable','Responsable'],['statut','Statut']],fields:[['titre','Tâche / signal','text',1],['client','Client','text'],['echeance','Échéance','date'],['responsable','Responsable','select','',['Enzo','IB','Brahim','Aurel','Autre']],['statut','Statut','select','',['À faire','En cours','Terminée']],['notes','Observations','textarea']]}
};
function clone(v){return JSON.parse(JSON.stringify(v))}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function load(){
  try{
    const current=localStorage.getItem(STORAGE_KEY);
    if(current) return {...clone(initial),...JSON.parse(current)};
    for(const k of LEGACY_KEYS){
      const old=localStorage.getItem(k);
      if(old){
        const data={...clone(initial),...JSON.parse(old)};
        localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
        return data;
      }
    }
  }catch(e){}
  return clone(initial)
}
function save(silent=false){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(db)); if(!silent) toast('Enregistré sur cet appareil');}catch(e){alert('Sauvegarde locale indisponible.')}}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(window.__tt);window.__tt=setTimeout(()=>e.style.display='none',2200)}
function go(p){page=p;query='';filter='';render()}
function dateHeure(d,h){if(!d&&!h)return '—';const t=d?d.split('-').reverse().join('/'):'';return esc([t,h].filter(Boolean).join(' à '))}
// Une voiture prêtée est en retard si l'heure (ou, sans heure, la journée) de retour prévue est passée.
function pretEnRetard(x){if(x.statut!=='Prêté'||!x.date_retour)return false;const fin=new Date(x.date_retour+'T'+(x.heure_retour||'23:59'));return !isNaN(fin)&&fin<new Date()}

function portfolioAmount(){let total=0; db.vehicules.forEach(x=>{const m=parseFloat(String(x.montant||'').replace(',','.')); if(!isNaN(m) && String(x.statut||'')!=='Livré') total+=m}); return total}
function localISO(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function todayCount(){const t=localISO(); return db.planning.filter(x=>x.date===t && x.statut!=='Terminé').length}
function status(v){
  const s=String(v??'').trim();

  if(/Sans RDV|À faire|En attente|À relancer|À chiffrer/i.test(s)) cl='red';
  else if(/Prêté|En cours|À planifier|Réservé|Peinture|Prévu|RDV fixé|Prêt à livrer/i.test(s)) cl='orange';
  else if(/Terminé|Disponible|Livré|Réalisée|Retourné|Terminée/i.test(s)) cl='green';
  return `<span class="pill ${cl}">${esc(s||'—')}</span>`;
}

async function importData(e){const f=e.target.files[0]; if(!f) return; try{const d=JSON.parse(await f.text()); const raw=d.data||d; if(!Object.keys(initial).every(k=>Array.isArray(raw[k]))) throw Error('Structure invalide'); if(!confirm('Remplacer toutes les données locales ?')) return; db=raw; save(true); render(); toast('Import terminé')}catch(err){alert('Fichier invalide : '+err.message)}}

// Installation sur l'écran d'accueil. Chrome envoie « beforeinstallprompt » quand il accepte d'installer l'appli :
// on garde l'événement pour le bouton « Installer » (sans preventDefault, Chrome peut toujours proposer l'installation lui-même).
// Sur Android, l'appli est ensuite fabriquée par Google et posée par le Play Store : si cette étape échoue, Chrome affiche

window.addEventListener('beforeinstallprompt',e=>{installEvt=e;if(page==='installer')render()});

    :installEvt?'✓ Chrome est prêt à installer My I-Car sur cet appareil.'
    :s.iphone?'Sur iPhone, l’installation passe par le bouton Partager (étape 3).'
    :'Chrome ne propose pas le bouton sur cette page&nbsp;: passe par son menu ⋮ (étape 1). Si l’appli est déjà installée, ouvre-la depuis l’écran d’accueil.';

    ['1','Android avec Chrome','Menu ⋮ en haut à droite, puis «&nbsp;Ajouter à l’écran d’accueil&nbsp;» (ou «&nbsp;Installer l’appli&nbsp;»), puis «&nbsp;Installer&nbsp;».'],
    ['2','Chrome répond «&nbsp;Impossible d’installer&nbsp;»&nbsp;?','Sur Android, l’appli est fabriquée par Google puis posée par le Play Store. Mets à jour Chrome et le Play Store, vérifie que le Play Store est connecté à ton compte Google et qu’il reste de la place, redémarre le téléphone puis réessaie. En attendant, choisis «&nbsp;Créer un raccourci&nbsp;» au lieu de «&nbsp;Installer&nbsp;»&nbsp;: l’icône ouvre la même appli dans Chrome, avec les mêmes données.'],

  ];

    +`<div class="help-grid">${etapes.map(([n,t,p])=>`<div class="card step-card"><div class="step-num">${n}</div><h3>${t}</h3><p>${p}</p></div>`).join('')}</div></section>`;

function render(){bottomNav(); const root=document.getElementById('root'); if(page==='dashboard') root.innerHTML=dashboard(); else if(['vehicules','planning','prets','taches','expertises','clients'].includes(page)) root.innerHTML=listing(page); else if(page==='assistant') root.innerHTML=assistantPage(); else if(page==='aide') root.innerHTML=help(); else if(page==='menu') root.innerHTML=menuPage(); else if(page==='installer') root.innerHTML=installPage(); else root.innerHTML=settings(); window.scrollTo(0,0);}

// V8 - Pilote IA : la conversation passe par la fonction Netlify /api/pilote (Gemini, clé cachée côté serveur).
// Si l'IA est injoignable (fichier ouvert en local, quota atteint…), le pilote repasse sur les règles locales de la V7.
const PILOTE_URL='/api/pilote';
const SpeechRec=window.SpeechRecognition||window.webkitSpeechRecognition||null;

// ── Voix de synthèse fiable (corrige le silence sur Chrome Android) ──────────
// 1. Débloquée au premier appui sur l'écran (Chrome refuse de parler sinon).
// 2. Jamais de cancel() juste avant speak() : on attend que la file soit vide
//    (bug Chrome Android : la phrase est perdue).
// 3. La phrase est gardée en mémoire (sinon Chrome la jette avant la fin).
// 4. Si rien ne démarre, on réessaie une fois ; si Chrome ne dit toujours rien,
//    on propose un bouton « Écouter » (un appui débloque toujours la voix).
const tts={unlocked:false,current:null,voice:null,seq:0,bloque:''};
function ttsPickVoice(){
  const vs=window.speechSynthesis?.getVoices?.()||[];
  tts.voice=vs.find(v=>/^fr[-_]FR$/i.test(v.lang)&&v.localService)||vs.find(v=>/^fr[-_]FR$/i.test(v.lang))||vs.find(v=>/^fr/i.test(v.lang))||null;
}
if(window.speechSynthesis){ttsPickVoice();try{window.speechSynthesis.addEventListener('voiceschanged',ttsPickVoice)}catch(e){}}
function ttsUnlock(){
  if(!window.speechSynthesis||tts.unlocked)return;
  try{
    const u=new SpeechSynthesisUtterance(' ');u.volume=0;u.lang='fr-FR';
    window.speechSynthesis.resume();window.speechSynthesis.speak(u);tts.unlocked=true;
  }catch(e){}
}
['pointerdown','touchstart','click','keydown'].forEach(ev=>document.addEventListener(ev,ttsUnlock,{capture:true,passive:true}));
function ttsStop(){
  tts.seq++;tts.current=null;
  try{if(window.speechSynthesis&&(window.speechSynthesis.speaking||window.speechSynthesis.pending))window.speechSynthesis.cancel()}catch(e){}
}
// Lit le texte, puis appelle fini() quand c'est terminé (ou si la voix ne marche pas).
function ttsSay(texte,fini){
  const done=typeof fini==='function'?fini:()=>{};
  const ss=window.speechSynthesis;
  if(!ss||!texte){done();return}
  const id=++tts.seq;tts.bloque='';
  try{if(ss.speaking||ss.pending)ss.cancel()}catch(e){}
  let essais=0,termine=false;
  const fin=()=>{if(termine||id!==tts.seq)return;termine=true;tts.current=null;done()};
  const lancer=()=>{
    if(id!==tts.seq)return;
    essais++;
    const u=new SpeechSynthesisUtterance(texte);
    u.lang='fr-FR';u.rate=1;u.pitch=1;u.volume=1;
    if(!tts.voice)ttsPickVoice();
    if(tts.voice)u.voice=tts.voice;
    let parti=false;
    u.onstart=()=>{parti=true};
    u.onend=fin;
    u.onerror=e=>{if(e.error==='interrupted'||e.error==='canceled')return;if(!parti&&essais<2)setTimeout(lancer,300);else{tts.bloque=texte;fin()}};
    tts.current=u; // garde une référence : sinon Chrome peut l'effacer en cours de lecture
    try{ss.resume();ss.speak(u)}catch(e){tts.bloque=texte;fin();return}
    // Rien n'a démarré au bout de 2,5 s → on réessaie une fois, puis on abandonne proprement.
    setTimeout(()=>{
      if(id!==tts.seq||parti||termine)return;
      if(essais<2){try{ss.cancel()}catch(e){}setTimeout(lancer,250)}
      else{tts.bloque=texte;try{ss.cancel()}catch(e){}fin()}
    },2500);
    // Filet de sécurité : Chrome Android oublie parfois de signaler la fin.
    setTimeout(()=>{if(id===tts.seq&&parti&&!termine&&!ss.speaking)fin()},Math.min(30000,1500+texte.length*90));
  };
  // Petite pause après un éventuel cancel() : c'est elle qui évite la phrase perdue.
  setTimeout(lancer,ss.speaking||ss.pending?250:80);
}
// Rejoue la dernière phrase restée muette, directement dans l'appui (débloque toujours Chrome).

  pgRender();
}

function voiceSpeak(t, autoListen=false){

function voiceSpeakCurrent(){voiceSpeak(voiceQuestion(),true)}
function voiceListen(){
  if(voice.phase==='idle'||voice.phase==='saved'||voice.thinking)return;
  if(!window.isSecureContext || !['https:','http:'].includes(location.protocol) || (location.protocol==='http:' && !['localhost','127.0.0.1'].includes(location.hostname))){
    voice.autopilot=false;
    voice.error='Cette application a été ouverte depuis un fichier local ('+location.protocol+'). Chrome Android bloque la reconnaissance vocale ici. Ouvre My I-Car depuis une adresse HTTPS sécurisée, puis réessaie.';
    render();return;
  }
  if(!SpeechRec){voice.error='Reconnaissance vocale non prise en charge. Utilise Chrome sur Android ou la réponse écrite.';render();return;}
  if(voice.listening)return;
  try{
    ttsStop();
    const recognition=new SpeechRec();
    recognition.lang='fr-FR';recognition.interimResults=false;recognition.continuous=false;recognition.maxAlternatives=1;
    voice.recognition=recognition;voice.listening=true;voice.error='';
    recognition.onresult=e=>{const t=e.results?.[0]?.[0]?.transcript?.trim()||'';voice.listening=false;voice.recognition=null; voiceApply(t)};
    recognition.onerror=e=>{voice.listening=false;voice.recognition=null;voice.autopilot=false;voice.error=e.error==='not-allowed'?'Accès vocal refusé. Vérifie les autorisations Micro de Chrome pour ce site HTTPS, puis réessaie.':`Micro : ${e.error}. Tu peux répondre par écrit.`;render()};
    recognition.onend=()=>{voice.listening=false;voice.recognition=null;render()};
    recognition.start();render();
  }catch(e){voice.listening=false;voice.autopilot=false;voice.error='Impossible de démarrer le micro : '+e.message;render()}
}
function voiceAutoStart(){voice.autopilot=true;voiceListen()}
function voiceStop(){voice.autopilot=false;if(voice.recognition){try{voice.recognition.abort()}catch(e){}}voice.listening=false;ttsStop();render()}
function voiceTextSubmit(e){e.preventDefault();let input=document.getElementById('voiceAnswer');if(!input||voice.thinking)return;let t=input.value.trim();if(!t)return;input.value='';voiceApply(t)}
function voiceClean(t){return t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’]/g,"'").trim()}
function voiceType(t){const s=voiceClean(t);if(/grele/.test(s))return 'Grêle';if(/bris de glace|pare.brise|vitre casse/.test(s))return 'Bris de glace';if(/stationnement|parking/.test(s))return 'Stationnement';if(/vandalisme|degradation volontaire/.test(s))return 'Vandalisme';if(/choc|collision|accident|accrochage/.test(s))return 'Collision';return t.trim()}
function voiceParseBrief(t){
  voice.intro=t;
  const name=t.match(/\b(?:madame|mme\.?|monsieur|m\.?|mr\.?)\s+([a-zà-ÿ'\-]+)(?:\s+([a-zà-ÿ'\-]+))?/i);
  if(name){let n=name[1];const brand=/^(peugeot|renault|citro[eë]n|bmw|mercedes|audi|ford|toyota|kia|volkswagen|opel|ds|fiat)$/i;if(name[2]&&!brand.test(name[2]))n+=' '+name[2];voice.values.client=(name[0].split(/\s+/)[0]+' '+n).trim()}
  const car=t.match(/\b(Peugeot\s+(?:\d{3,4}|\w+)|Renault\s+(?:Clio|Megane|Mégane|Captur|Scenic|Scénic|Kangoo|\w+)|Citro[eë]n\s+(?:C\d|\w+)|BMW\s+(?:X\d|S[ée]rie\s*\d|\d{3}\w*)|Mercedes\s+(?:Classe\s+[A-Z]|\w+)|Audi\s+(?:A\d|Q\d|\w+)|Volkswagen\s+(?:Golf|Polo|Tiguan|\w+)|Ford\s+\w+|Toyota\s+\w+|Opel\s+\w+|DS\s+\d|Fiat\s+\w+)\b/i);
  if(car)voice.values.modele=car[0];
  const plate=t.toUpperCase().match(/\b[A-Z]{2}[- ]?\d{3}[- ]?[A-Z]{2}\b/);
  if(plate) voice.values.immatriculation=plate[0].replace(/[ -]/g,'').replace(/^(.{2})(.{3})(.{2})$/,'$1-$2-$3');
  const s=voiceClean(t);
  if(/grele|bris de glace|pare.brise|vitre casse|stationnement|parking|vandalisme|degradation volontaire|collision|accident|accrochage|choc/.test(s))voice.values.nature=voiceType(t);
}
function voiceNext(){
  const next=intakeFields.find(f=>!String(voice.values[f.key]??'').trim()&&!voice.skipped[f.key]);
  if(next){voice.phase='questions';voice.key=next.key}
  else{voice.phase='review';voice.key=null}
  render();voiceSpeakCurrent();
}
function voiceFormatAnswer(key,t){
  const s=voiceClean(t);
  if(key==='nature')return voiceType(t);
  if(key==='expertise'){
    if(/fait|realisee|terminee|deja passe/.test(s))return 'Réalisée';
    if(/non necessaire|pas necessaire|sans expertise/.test(s))return 'Non nécessaire';
    if(/planifier|pas encore|a faire|a prevoir|en attente/.test(s))return 'À planifier';
  }
  if(key==='priorite'){
    const words={'un':1,'une':1,'deux':2,'trois':3,'quatre':4,'cinq':5,'six':6,'sept':7,'huit':8,'neuf':9,'dix':10};
    const m=s.match(/\b(10|[1-9])\b/);if(m)return m[1];
    for(const [w,n] of Object.entries(words)) if(new RegExp('\\b'+w+'\\b').test(s))return String(n);
    return t.trim();
  }
  if(key==='dateRDV'){
    if(/aujourd'hui|ce jour/.test(s))return new Date().toLocaleDateString('en-CA');
    if(/demain/.test(s)){const d=new Date();d.setDate(d.getDate()+1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
    const iso=t.match(/\b(20\d\d)-(\d{1,2})-(\d{1,2})\b/);
    if(iso)return `${iso[1]}-${iso[2].padStart(2,'0')}-${iso[3].padStart(2,'0')}`;
    const dm=t.match(/\b(\d{1,2})\s*[\/.\-]\s*(\d{1,2})(?:\s*[\/.\-]\s*(20\d\d))?\b/);
    if(dm)return `${dm[3]||new Date().getFullYear()}-${dm[2].padStart(2,'0')}-${dm[1].padStart(2,'0')}`;
    const monthNames={janvier:1,fevrier:2,mars:3,avril:4,mai:5,juin:6,juillet:7,aout:8,septembre:9,octobre:10,novembre:11,decembre:12};
    const named=s.match(/\b(\d{1,2})\s+(janvier|fevrier|mars|avril|mai|juin|juillet|aout|septembre|octobre|novembre|decembre)(?:\s+(20\d\d))?\b/);
    if(named)return `${named[3]||new Date().getFullYear()}-${String(monthNames[named[2]]).padStart(2,'0')}-${named[1].padStart(2,'0')}`;
    return t.trim();
  }
  if(key==='immatriculation')return t.trim().toUpperCase();
  return t.trim();
}
async function voiceAI(t){
  voice.history.push({qui:'pilote',texte:voiceQuestion()},{qui:'aurel',texte:t});
  voice.thinking=true;render();
  try{
    const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),25000);
    const r=await fetch(PILOTE_URL,{method:'POST',headers:{'Content-Type':'application/json'},signal:ctrl.signal,body:JSON.stringify({historique:voice.history.slice(-30),valeurs:voice.values,passes:Object.keys(voice.skipped).filter(k=>voice.skipped[k]),aujourdhui:localISO(),phase:voice.phase})});
    clearTimeout(timer);
    const d=await r.json().catch(()=>({erreur:'réponse illisible'}));
    if(!r.ok||d.erreur) throw Error(d.erreur||('erreur '+r.status));
    if(d.ia){const b=document.getElementById('iaBadge');if(b)b.textContent='Pilote IA • '+d.ia}
    const keys=intakeFields.map(f=>f.key);
    for(const [k,v] of Object.entries(d.valeurs||{})) if(keys.includes(k)&&String(v??'').trim()){voice.values[k]=String(v).trim();delete voice.skipped[k]}
    for(const k of (d.passes||[])) if(keys.includes(k)&&!String(voice.values[k]||'').trim()) voice.skipped[k]=true;
    if(voice.phase==='intro') voice.intro=t;
    voice.thinking=false;
    if(d.termine||voice.phase==='review'){voice.phase='review';voice.key=null;voice.aiQuestion=''}
    else{voice.phase='questions';voice.key=null;voice.aiQuestion=d.question||'Autre chose à ajouter sur ce dossier ?'}
    render();voiceSpeakCurrent();return true;
  }catch(e){
    voice.thinking=false;voice.aiOff=true;voice.history.splice(-2);voice.aiQuestion='';
    voice.error='Pilote IA injoignable ('+(e.name==='AbortError'?'trop long à répondre':e.message)+'). Je continue avec les questions classiques.';
    return false;
  }
}
async function voiceApply(t){
  if(!t||voice.thinking)return;
  voice.transcript=t;voice.error='';
  const s=voiceClean(t);
  if(/^(annuler|arrete|stop)$/.test(s)){voiceCancel();return}
  if(voice.phase==='review'&&/^(oui|ok|valide|valider|enregistre|enregistrer|confirme|c'est bon|c est bon)/.test(s)){voiceSave();return;}
  if(!voice.aiOff&&!voice.editOnly&&['intro','questions','review'].includes(voice.phase)){
    if(await voiceAI(t))return;
  }
  if(voice.phase==='review'){
    voice.error=(voice.error?voice.error+' ':'')+'Pour corriger une information, appuie sur « Modifier » ; pour sauvegarder, dis « enregistre ».';render();return;
  }
  if(voice.phase==='intro'){voiceParseBrief(t);voiceNext();return}
  if(voice.phase!=='questions')return;
  if(!voice.key){voiceNext();return}
  const key=voice.key;
  if(/^(passe|je ne sais pas(?: encore)?|je sais pas|aucun|inconnu|non|pas encore|pas pour l'instant|rien|je connais pas)$/.test(s)){
    voice.skipped[key]=true;delete voice.values[key];
  }else{
    const answer=voiceFormatAnswer(key,t);
    voice.values[key]=answer;delete voice.skipped[key];
  }
  if(voice.editOnly){voice.editOnly=null;voice.phase='review';voice.key=null;render();voiceSpeakCurrent();return}
  voiceNext();
}

  }

  save(true);voice.phase='saved';voice.key=null;voice.autopilot=false;render();voiceSpeakCurrent();

ide></div>`;

// V9 — PILOTE GLOBAL À VOIX HAUTE
// Un bouton micro sur toutes les pages. Aurel parle, la fonction Netlify
// /api/pilote-global (Gemini) comprend la demande et renvoie : une réponse lue
// à voix haute + des actions (afficher une page, ajouter, modifier, supprimer).
// Les suppressions demandent une confirmation ; chaque changement peut être annulé.
// ───────────────────────────────────────────────────────────────────────────
const GLOBAL_URL='/api/pilote-global';
const PG_PAGES=['dashboard','vehicules','planning','prets','taches','clients','expertises','assistant','aide','parametres'];
const pg={open:false,listening:false,thinking:false,mainsLibres:true,log:[],pending:null,undo:null,error:'',recognition:null};
const PG_EXEMPLES=['Quelles voitures de prêt sont disponibles ?','Qu’est-ce que j’ai demain au planning ?','Prête la Clio à Monsieur Martin jusqu’à vendredi','Passe le dossier Dupont en peinture'];

function pgId(){return crypto.randomUUID?.()||String(Date.now()+Math.random())}
function pgMaintenant(){const d=new Date();const j=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'][d.getDay()];return `${localISO(d)} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}, ${j}`}
function pgOpen(){pg.open=true;pg.error='';pgRender();pgListen()}
function pgClose(){pgStopMic();ttsStop();pg.open=false;pgRender()}
function pgToggleMains(){pg.mainsLibres=!pg.mainsLibres;pgRender()}
function pgStopMic(){if(pg.recognition){try{pg.recognition.abort()}catch(e){}}pg.recognition=null;pg.listening=false}
function pgPush(qui,texte,done=''){pg.log.push({qui,texte,done});if(pg.log.length>40)pg.log.splice(0,pg.log.length-40)}

// Test du son : parle directement dans l'appui (le cas le plus sûr pour Chrome Android).
function pgTestSon(){
  pgStopMic();
  if(!window.speechSynthesis){pg.error='Ce navigateur ne sait pas lire à voix haute. Utilise Chrome.';pgRender();return}
  const n=(window.speechSynthesis.getVoices()||[]).filter(v=>/^fr/i.test(v.lang)).length;
  ttsSay('Test du son. Si tu m’entends, la voix du pilote fonctionne.',()=>{
    if(tts.bloque)pg.error='Aucun son : vérifie Paramètres du téléphone, puis Synthèse vocale : moteur Google, langue français installée.'+(n?'':' Aucune voix française trouvée sur ce téléphone.');
    pgRender();
  });
}
function pgSpeak(t){
  ttsSay(t,()=>{pgRender();if(pg.mainsLibres&&pg.open&&!pg.thinking&&!pg.listening&&!tts.bloque)setTimeout(pgListen,300)});
}

function pgListen(){
  if(!pg.open||pg.listening||pg.thinking)return;
  if(!window.isSecureContext){pg.error='Le micro ne marche que depuis l’adresse https de ton site. Tu peux écrire ta demande en dessous.';pgRender();return}
  if(!SpeechRec){pg.error='Ce navigateur ne reconnaît pas la voix. Utilise Chrome, ou écris ta demande en dessous.';pgRender();return}
  if(voice.listening||voice.autopilot)voiceStop(); // un seul micro à la fois
  try{
    ttsStop();
    const r=new SpeechRec();
    r.lang='fr-FR';r.interimResults=false;r.continuous=false;r.maxAlternatives=1;
    pg.recognition=r;pg.listening=true;pg.error='';
    r.onresult=e=>{const t=e.results?.[0]?.[0]?.transcript?.trim()||'';pgStopMic();if(t)pgSend(t);else pgRender()};
    r.onerror=e=>{pgStopMic();if(e.error==='not-allowed')pg.error='Micro refusé. Autorise le micro pour ce site dans Chrome, puis réessaie.';else if(e.error!=='no-speech'&&e.error!=='aborted')pg.error='Micro : '+e.error+'. Tu peux écrire ta demande.';pgRender()};
    r.onend=()=>{pg.listening=false;pg.recognition=null;pgRender()};
    r.start();pgRender();
  }catch(e){pgStopMic();pg.error='Impossible de lancer le micro : '+e.message;pgRender()}
}
function pgMic(){if(pg.listening){pgStopMic();pgRender()}else pgListen()}
function pgTextSubmit(e){e.preventDefault();const i=document.getElementById('pgInput');const t=(i?.value||'').trim();if(!t||pg.thinking)return;i.value='';pgSend(t)}

function pgRepond(t,done=''){pgPush('pilote',t,done);pg.thinking=false;pgRender();pgSpeak(t)}

async function pgSend(t){
  if(pg.thinking)return;
  pgPush('aurel',t);pg.error='';
  const s=voiceClean(t).replace(/[.!?,]/g,'').trim();

  // 1. Une suppression attend ta confirmation
  if(pg.pending){
    const acts=pg.pending;pg.pending=null;
    if(/^(oui|ouais|ok|vas-y|vas y|confirme|je confirme|d'accord|c'est bon|supprime|valide)\b/.test(s)){const n=pgApply(acts);pgRepond('C’est fait.',n?n+' changement(s) · tu peux annuler':'');return}
    if(/^(non|nan|laisse|annule|surtout pas|stop)\b/.test(s)){pgRepond('D’accord, je ne supprime rien.');return}
  }
  // 2. Annuler le dernier changement
  if(pg.undo&&/^(annule|annule ca|annule ça|annuler|reviens en arriere|retour en arriere|defais|defais ca)$/.test(s)){pgUndo();return}
  // 3. Fin de conversation
  if(/^(stop|arrete|tais.toi|ferme|au revoir|merci c'est tout|c'est tout|ca sera tout)$/.test(s)){pgPush('pilote','À plus tard.');pgClose();return}

  // 4. Simple navigation (« ouvre les prêts ») : faite sur place, sans appeler l'IA (gratuit et instantané)
  const direct=pgNavDirecte(s);
  if(direct){pgRepond(direct);return}

  pg.thinking=true;pgRender();
  // Seulement les 5 derniers échanges, raccourcis : l'IA n'a pas besoin de plus pour suivre le fil.
  const historique=pg.log.slice(0,-1).slice(-10).map(m=>({qui:m.qui,texte:String(m.texte).slice(0,300)}));
  const ctx=pgContexte(t);
  pg.dernierEnvoi=ctx; // pour vérifier ce qui part à l'IA
  try{
    const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),30000);
    const r=await fetch(GLOBAL_URL,{method:'POST',headers:{'Content-Type':'application/json'},signal:ctrl.signal,
      body:JSON.stringify({phrase:t,historique,page,maintenant:pgMaintenant(),resume:ctx.resume,donnees:ctx.donnees})});
    clearTimeout(timer);
    const brut=await r.text();let d;
    try{d=JSON.parse(brut)}catch{d={erreur:r.status===404?'fonction serveur introuvable (404) : le site n’a pas été redéployé':(r.status===502||r.status===504||/timed out|timeout/i.test(brut))?'le serveur a dépassé 10 secondes ('+r.status+')':'réponse illisible du serveur ('+r.status+' : '+brut.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().slice(0,80)+')'}}
    if(!r.ok||d.erreur)throw Error(d.erreur||('erreur '+r.status));
    pgNoteIA(d);
    // Les éléments ont été envoyés sous des numéros courts (v1, p2…) : on retrouve leurs vrais identifiants.
    const actions=(Array.isArray(d.actions)?d.actions:[]).map(a=>a.id?{...a,id:ctx.refs[a.id]||''}:a).filter(a=>!('id' in a)||a.id);
    pgSouvenir(actions,ctx);
    if(d.confirmation){pg.pending=actions;pgRepond(d.reponse);return}
    if(actions.some(a=>a.type==='entretien')){pg.thinking=false;pgPush('pilote',d.reponse||'Je lance l’entretien de dossier.');pgClose();go('assistant');voiceNew();return}
    const n=pgApply(actions);
    pgRepond(d.reponse,n?n+' changement(s) · tu peux annuler':'');
  }catch(e){
    pg.thinking=false;
    const local=pgLocal(s);
    const raison=e.name==='AbortError'?'le pilote a mis trop de temps':e.message;
    if(local){pgRepond(local+' (Pilote IA injoignable : '+raison+'.)')}
    else{pg.error='Pilote IA injoignable : '+raison+'. En attendant, je sais seulement ouvrir les pages (« ouvre les prêts »).';pgPush('pilote','Je n’arrive pas à joindre l’IA pour le moment.');pgRender()}
  }
}

// ── Économie : n'envoyer à l'IA que ce qui sert à la demande ─────────────────
// Au lieu de toute la base (des dizaines de milliers de mots), on envoie :
//  • un résumé chiffré (combien de dossiers par étape, de rendez-vous aujourd'hui…) ;
//  • les éléments qui citent un nom, un modèle, une plaque ou un numéro de la phrase ;
//  • pour les sujets évoqués (prêts, planning, relances…), seulement les éléments en cours ;
//  • les éléments dont on vient de parler (pour « et passe-le en peinture »).
// Les identifiants longs sont remplacés par des numéros courts (v1, p2…).
const PG_MOTS_SECTION={
  vehicules:/dossier|vehicule|atelier|peinture|travaux|chiffr|livr|priorit|carrosserie|sinistre|repar|en attente|a planifier|montant|portefeuille|devis/,
  planning:/planning|rendez.vous|\brdv\b|agenda|demain|aujourd|ce soir|ce matin|cet apres|semaine|lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche|\bheures?\b|\d+ ?h\b|journee|programme/,
  prets:/\bpret|prete|preter|dispo|rendu|rendre|\bretour|rentre|ramene|courtoisie|remplacement|amende|radar|\bpv\b|contravention|conduisait/,
  taches:/relance|relancer|tache|rappel|a faire|penser a|pense a|oublie/,
  clients:/client|telephone|numero|portable|mail|coordonnee/,
  expertises:/expertise|expert/
};
const PG_STOP=new Set(('ai as es eu vu nos vos ici voir liste besoin faudrait avez avons sait sais the les des une est pour dans avec que qui quoi quel quelle quelles quels mon mes ton tes son ses sur pas plus moi toi lui leur elle ils elles fait faire fais mets met mettre passe passer ajoute ajouter supprime supprimer enleve montre affiche ouvre donne dis dit peux veux voudrais faut combien comment quand est cest ce cet cette ces tout tous toute toutes rien aussi alors bien deja encore apres avant jusqu jusqua demain aujourd hui matin soir semaine prochain prochaine dernier derniere lundi mardi mercredi jeudi vendredi samedi dimanche heure heures dossier dossiers vehicule vehicules voiture voitures pret prets prete preter client clients cliente monsieur madame mme planning rendez vous rdv relance relances tache taches expertise expertises statut priorite numero telephone disponible disponibles dispo libre etat point chez par deux trois oui non merci stp sil plait nouveau nouvelle change changer modifie modifier annule rentre rentree rendu revenu ramene qu il elle on je tu nous en et le la de du un au aux ou si ne se me te ma ta sa ca y a ya avoir etre sont ont va vont doit dois peut').split(' '));
const PG_REF={vehicules:'v',planning:'r',prets:'p',taches:'t',clients:'c',expertises:'e'};
const PG_CHAMPS={vehicules:['client','modele','immatriculation','statut','priorite','montant','notes'],planning:['date','heure','titre','responsable','statut'],prets:['nom','client','date_depart','date_retour','statut','notes'],taches:['titre','client','echeance','responsable','statut'],clients:['nom','telephone','email','vehicule'],expertises:['client','immatriculation','date','statut']};
const PG_FINI={vehicules:'Livré',planning:'Terminé',prets:'Retourné',taches:'Terminée',expertises:'Réalisée'};

function pgDecale(n){const d=new Date();d.setDate(d.getDate()+n);return localISO(d)}
// Dates dont parle la phrase (pour ne prendre que ces jours-là dans le planning).
function pgJours(s){
  if(/apres.demain/.test(s))return [pgDecale(2)];
  if(/demain/.test(s))return [pgDecale(1)];
  if(/aujourd|ce matin|ce soir|cet apres|cette apres/.test(s))return [pgDecale(0)];
  if(/semaine prochaine/.test(s)){const j=(8-new Date().getDay())%7||7;return Array.from({length:7},(_,i)=>pgDecale(j+i))}
  const jours=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
  const cites=jours.map((j,i)=>new RegExp('\\b'+j+'\\b').test(s)?i:-1).filter(i=>i>=0);
  if(cites.length)return cites.map(i=>pgDecale(((i-new Date().getDay())+7)%7||7));
  const mois=['janvier','fevrier','mars','avril','mai','juin','juillet','aout','septembre','octobre','novembre','decembre'];
  const m=s.match(/\b(?:le )?(\d{1,2}|1er)(?: (janvier|fevrier|mars|avril|mai|juin|juillet|aout|septembre|octobre|novembre|decembre))?\b/);
  if(m&&(m[2]||/\ble (\d{1,2}|1er)\b/.test(s))){
    const jour=parseInt(m[1])||1;const now=new Date();let mo=m[2]?mois.indexOf(m[2]):now.getMonth();let an=now.getFullYear();
    if(!m[2]&&jour<now.getDate()-3)mo++;
    if(jour>=1&&jour<=31)return [localISO(new Date(an,mo,jour))];
  }
  return null; // pas de date précise → planning de la semaine à venir
}

function pgContexte(t){
  const s=voiceClean(t).replace(/[’]/g,"'");
  const compact=s.replace(/[^a-z0-9]/g,'');
  const chiffres=t.replace(/\D/g,'');
  const mots=[...new Set(s.split(/[^a-z0-9]+/).filter(w=>w&&!PG_STOP.has(w)&&(w.length>=2&&!/^\d{1,2}$/.test(w))))];
  const historique=/amende|radar|\bpv\b|contravention|conduisait|qui avait|historique|a eu|depuis|derniere fois/.test(s);
  const pertinent=Object.keys(PG_MOTS_SECTION).filter(k=>PG_MOTS_SECTION[k].test(s));
  const bilan=/\bpoint\b|bilan|resume|situation|urgent|urgence|quoi de neuf|ma journee|a faire aujourd|mes priorites|\bpriorites\b/.test(s);
  const creation=/^(?:ajoute|ajouter|cree|creer|note|noter|enregistre|programme|planifie|mets? un|nouveau|nouvelle)\b/.test(s);
  const jours=pgJours(s);
  const auj=localISO(), semaine=Array.from({length:8},(_,i)=>pgDecale(i-1));
  const choix={};const ajoute=(sec,el)=>{(choix[sec]=choix[sec]||new Map()).set(el.id,el)};
  const correspond=[];

  // 1. Ce qui cite un nom, un modèle, une plaque ou un numéro de la phrase
  for(const sec of Object.keys(PG_REF)){
    if(historique&&sec!=='prets')continue; // amende / radar : seul l'historique des prêts compte
    const candidats=[],compte={};
    for(const el of db[sec]){
      const brut=[el.client,el.nom,el.modele,el.immatriculation,el.titre,el.vehicule,el.email].filter(Boolean).join(' ');
      const motsEl=voiceClean(brut).split(/[^a-z0-9]+/);
      const touches=mots.filter(w=>motsEl.some(x=>x===w||(w.length>=4&&x.startsWith(w))));
      touches.forEach(w=>compte[w]=(compte[w]||0)+1);
      let bonus=0;
      const plaque=String(el.immatriculation||'').replace(/[^a-z0-9]/gi,'').toLowerCase();
      if(plaque.length>=5&&compact.includes(plaque))bonus+=3;
      const tel=String(el.telephone||'').replace(/\D/g,'');
      if(chiffres.length>=6&&tel.includes(chiffres))bonus+=3;
      if(touches.length||bonus)candidats.push([touches,bonus,el]);
    }
    // Un mot trop courant (« assurance », « Clio »…) ne compte pas si un mot plus précis (un nom) existe
    const precis=Object.keys(compte).filter(w=>compte[w]<=6);
    const trouves=candidats.map(([touches,bonus,el])=>[touches.filter(w=>!precis.length||precis.includes(w)).length+bonus,el]).filter(x=>x[0]>0);
    const dateDe=el=>el.date_depart||el.date||el.echeance||'';
    trouves.sort((a,b)=>b[0]-a[0]||dateDe(b[1]).localeCompare(dateDe(a[1])));
    let garde=trouves;
    // Les éléments terminés (vieux rendez-vous, prêts rendus…) ne servent que pour l'historique
    if(PG_FINI[sec]&&!historique){const fini=x=>x[1].statut===PG_FINI[sec];garde=[...garde.filter(x=>!fini(x)),...garde.filter(fini).slice(0,sec==='prets'?2:sec==='vehicules'?1:0)]}
    for(const [,el] of garde.slice(0,historique?15:8)){ajoute(sec,el);correspond.push(el.id)}
  }
  // Amende à une date donnée : toutes les voitures qui étaient prêtées ce jour-là
  if(historique&&jours){
    const j=jours[0];const tmp=[];
    db.prets.forEach(el=>{if(el.date_depart&&el.date_depart<=j&&(el.date_retour||el.date_depart)>=j)tmp.push(el)});
    tmp.slice(0,15).forEach(el=>{ajoute('prets',el);correspond.push(el.id)});
  }
  // 2. Pour les sujets évoqués : seulement ce qui est en cours
  const enCours=sec=>db[sec].filter(x=>x.statut!==PG_FINI[sec]);
  if(pertinent.includes('prets'))enCours('prets').slice(0,30).forEach(el=>ajoute('prets',el));
  if((pertinent.includes('planning')&&!historique)||bilan){
    const dates=jours||(bilan?[auj,pgDecale(1)]:semaine);
    db.planning.filter(x=>dates.includes(x.date)).sort((a,b)=>(a.date+a.heure).localeCompare(b.date+b.heure)).slice(0,30).forEach(el=>ajoute('planning',el));
  }
  if((pertinent.includes('taches')&&!creation)||bilan)enCours('taches').sort((a,b)=>String(a.echeance||'9').localeCompare(String(b.echeance||'9'))).slice(0,bilan?10:25).forEach(el=>ajoute('taches',el));
  if((pertinent.includes('expertises')&&!creation)||bilan)enCours('expertises').slice(0,bilan?10:20).forEach(el=>ajoute('expertises',el));
  if((pertinent.includes('vehicules')&&!creation&&!historique)||bilan){
    // Une étape citée (« en peinture ») → seulement les dossiers à cette étape
    const etape=(configs.vehicules.fields.find(f=>f[0]==='statut')[4]).find(e=>s.includes(voiceClean(e)));
    // Dossier cité par son nom, ou dont on vient de parler (« mets-le en priorité 9 »)
    const dossierCite=correspond.some(id=>db.vehicules.some(v=>v.id===id))||(!mots.length&&(pg.recents||[]).some(id=>db.vehicules.some(v=>v.id===id)));
    const parPriorite=l=>l.sort((a,b)=>(+b.priorite||0)-(+a.priorite||0));
    let liste;
    if(bilan)liste=parPriorite(enCours('vehicules')).slice(0,10);
    else if(dossierCite)liste=[];                       // un dossier précis est cité : lui seul suffit
    else if(etape)liste=db.vehicules.filter(x=>x.statut===etape).slice(0,30);
    else liste=parPriorite(enCours('vehicules')).slice(0,25);
    liste.forEach(el=>ajoute('vehicules',el));
  }
  // 3. Ce dont on vient de parler
  for(const id of pg.recents||[])for(const sec of Object.keys(PG_REF)){const el=db[sec].find(x=>x.id===id);if(el)ajoute(sec,el)}

  // Envoi compact : numéros courts, champs utiles, notes raccourcies
  const refs={},donnees={};
  for(const [sec,m] of Object.entries(choix)){
    let i=0;
    donnees[sec]=[...m.values()].map(el=>{
      const ref=PG_REF[sec]+(++i);refs[ref]=el.id;
      const r={id:ref};
      for(const c of PG_CHAMPS[sec]){const v=el[c];if(v!==undefined&&v!==null&&String(v).trim())r[c]=c==='notes'?String(v).replace(/\s+/g,' ').slice(0,90):String(v)}
      return r;
    });
  }
  // Résumé chiffré : de quoi répondre à « combien… » sans tout envoyer
  const parEtape={};db.vehicules.forEach(x=>{const k=x.statut||'Sans étape';parEtape[k]=(parEtape[k]||0)+1});
  const parc=[...new Set(db.prets.map(x=>x.nom).filter(Boolean))].map(nom=>{const actif=db.prets.filter(x=>x.nom===nom&&x.statut!=='Retourné').pop();return nom+' : '+(actif?actif.statut+(actif.client?' ('+actif.client+')':''):'Disponible')});
  const resume={
    dossiersParEtape:parEtape,
    voituresDePret:parc,
    rendezVous:{aujourdhui:db.planning.filter(x=>x.date===auj).length,demain:db.planning.filter(x=>x.date===pgDecale(1)).length},
    relancesOuvertes:enCours('taches').length,
    expertisesEnAttente:enCours('expertises').length,
    clients:db.clients.length
  };
  return {resume,donnees,refs,correspond};
}
// Affiche quelle IA a répondu (ChatGPT ou Gemini) et prévient si ChatGPT a dû être remplacé.
function pgNoteIA(d){
  if(!d||!d.ia)return;
  pg.ia=d.ia+(d.modele?' · '+d.modele:'');
  const b=document.getElementById('iaBadge');if(b)b.textContent='Pilote IA • '+d.ia;
  if(d.avertissement)pg.error=d.avertissement;
}
// Retient les éléments dont on vient de parler, pour les phrases qui suivent.
function pgSouvenir(actions,ctx){
  const ids=actions.map(a=>a.id).filter(Boolean);
  if(ctx.correspond.length&&ctx.correspond.length<=4)ids.push(...ctx.correspond);
  pg.recents=[...new Set([...ids,...(pg.recents||[])])].slice(0,8);
}
// « Ouvre les prêts », « montre-moi les dossiers en peinture » : fait sur place, sans IA.
function pgNavDirecte(s){
  const m=s.match(/^(?:ouvre|ouvrir|affiche|affiche.moi|montre.moi|montre|va (?:sur|dans|a|au|aux)|retourne (?:sur|au|a)|je veux voir|emmene.moi (?:sur|au|aux|a))\s+(.+)$/);
  if(!m)return '';
  const reste=m[1];
  if(PG_MOTS_SECTION.planning.test(reste)&&/demain|aujourd|matin|soir|semaine|lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche|\d/.test(reste))return ''; // « le planning de demain » → l'IA le lit

  const cible=[[/nouveau dossier|creer un dossier|entretien/,'assistant'],[/voitures? de pret|\bprets?\b/,'prets'],[/planning|agenda|rendez.vous/,'planning'],[/relances?|taches?/,'taches'],[/expertises?/,'expertises'],[/clients?/,'clients'],[/dossiers?|vehicules?|atelier/,'vehicules'],[/sauvegardes?|parametres?|export/,'parametres'],[/cockpit|accueil|tableau de bord/,'dashboard'],[/guide|aide/,'aide']].find(([re])=>re.test(reste));
  if(!cible)return '';
  const sec=cible[1];
  const opts=configs[sec]?.fields.find(f=>f[0]==='statut')?.[4]||[];
  const etape=opts.find(e=>reste.includes(voiceClean(e)));
  let restant=reste;[cible[0],etape?new RegExp(voiceClean(etape)):null].forEach(re=>{if(re)restant=restant.replace(re,' ')});
  const autres=restant.split(/[^a-z0-9]+/).filter(w=>w&&!PG_STOP.has(w)&&!/^(en|les?|la|des|du|de|mes|tous|toutes|liste|page|qui|sont|a|l|d)$/.test(w));
  if(autres.length>1)return ''; // demande plus riche → l'IA s'en occupe
  if(sec==='assistant'){go('assistant');return 'J’ouvre l’entretien de dossier.'}
  page=sec;query=autres[0]||'';filter=etape||'';render();
  const noms={prets:'les prêts',planning:'le planning',taches:'les relances',expertises:'les expertises',clients:'les clients',vehicules:'les dossiers',parametres:'les sauvegardes',dashboard:'le cockpit',aide:'le guide'};
  if(configs[sec]&&(etape||query)){const n=filteredRows(sec).length;return `Voici ${noms[sec]}${etape?' à l’étape '+etape:''}${query?' pour '+query:''} : ${n?n+' résultat'+(n>1?'s':''):'aucun résultat'}.`}
  return 'J’ouvre '+noms[sec]+'.';
}

// Applique les actions renvoyées par l'IA, en revérifiant tout côté appli.
function pgApply(actions){
  const avant=clone(db);let n=0,nav=null;
  for(const a of actions||[]){
    if(a.type==='aller'&&PG_PAGES.includes(a.page)){nav=a;continue}
    const c=configs[a.section];if(!c)continue;
    const permis=c.fields.map(f=>f[0]);
    const vals={};for(const [k,v] of Object.entries(a.valeurs||{}))if(permis.includes(k))vals[k]=String(v);
    if(a.type==='ajouter'&&Object.keys(vals).length){const nid=pgId();db[a.section].push({id:nid,...vals});n++;pg.recents=[nid,...(pg.recents||[])].slice(0,8)}
    else if(a.type==='modifier'){const el=db[a.section].find(x=>x.id===a.id);if(el&&Object.keys(vals).length){Object.assign(el,vals);n++}}
    else if(a.type==='supprimer'){const avantLen=db[a.section].length;db[a.section]=db[a.section].filter(x=>x.id!==a.id);if(db[a.section].length<avantLen)n++}
  }
  if(n){pg.undo=avant;save(true)}
  if(nav){page=nav.page;query=nav.recherche||'';filter=nav.statut||''}
  if(n||nav)render();
  return n;
}
function pgUndo(){if(!pg.undo)return;db=pg.undo;pg.undo=null;save(true);render();pgRepond('J’ai annulé le dernier changement.')}

// Secours sans IA : ouvrir une page par mot-clé.
function pgLocal(s){
  const map=[[/nouveau dossier|creer un dossier/,'assistant'],[/pret|voiture de pret/,'prets'],[/planning|agenda|rendez.vous|demain|aujourd/,'planning'],[/relance|tache/,'taches'],[/expertise/,'expertises'],[/client/,'clients'],[/dossier|vehicule|atelier/,'vehicules'],[/sauvegarde|parametre|export/,'parametres'],[/cockpit|accueil/,'dashboard']];
  const hit=map.find(([re])=>re.test(s));if(!hit)return '';
  go(hit[1]);
  return 'J’ouvre '+({assistant:'l’entretien de dossier',prets:'les prêts',planning:'le planning',taches:'les relances',expertises:'les expertises',clients:'les clients',vehicules:'les dossiers',parametres:'les sauvegardes',dashboard:'le cockpit'}[hit[1]])+'.';
}

function pgRender(){
  const host=document.getElementById('pilotehost');if(!host)return;
  const etat=pg.thinking?'⏳ Je réfléchis…':pg.listening?'🔴 Je t’écoute, parle maintenant…':pg.pending?'❓ J’attends ta confirmation (oui / non)':'Appuie sur le micro et parle';
  if(!pg.open){host.innerHTML=`<button class="pg-fab ${pg.listening?'on':''}" onclick="pgOpen()" aria-label="Parler au pilote">🎙</button>`;return}
  const log=pg.log.length?pg.log.slice(-12).map(m=>`<div class="pg-msg ${m.qui}">${esc(m.texte)}${m.done?`<span class="pg-done">✓ ${esc(m.done)}</span>`:''}</div>`).join('')
    :`<div class="pg-msg pilote">Je t’écoute. Demande-moi ce que tu veux faire dans l’appli, par exemple :</div><div class="pg-chips">${PG_EXEMPLES.map(x=>`<button class="pg-chip" onclick="pgSend(this.textContent)">${esc(x)}</button>`).join('')}</div>`;
  host.innerHTML=`<div class="pg-panel" role="dialog" aria-label="Pilote global">
    <div class="pg-head"><div><strong>🎙 Pilote global</strong><small>${pg.ia?'Réponses par '+esc(pg.ia):'Il comprend, agit sur toute l’appli et te répond à voix haute'}</small></div><button class="pg-x" onclick="pgClose()" aria-label="Fermer">✕</button></div>
    <div class="pg-log" id="pgLog">${log}</div>
    <div class="pg-foot">
      <div class="pg-state">${etat}</div>
      ${pg.error?`<div class="pg-warn">⚠ ${esc(pg.error)}</div>`:''}
      ${tts.bloque?`<div class="pg-warn">🔇 Chrome a bloqué la voix. <button class="pg-small ok" onclick="ttsRejouer()">🔊 Écouter la réponse</button></div>`:''}
      <div class="pg-row"><button class="pg-mic ${pg.listening?'on':''}" onclick="pgMic()">${pg.listening?'■ Arrêter l’écoute':pg.thinking?'⏳ Patiente…':'🎙 Parler'}</button>${pg.undo?`<button class="pg-small" onclick="pgUndo()">↩ Annuler</button>`:''}<button class="pg-small" onclick="pgTestSon()" title="Tester la voix">🔊 Test</button></div>
      <div class="pg-row"><button class="pg-small ${pg.mainsLibres?'ok':''}" onclick="pgToggleMains()">${pg.mainsLibres?'✓ Mains libres : il réécoute après chaque réponse':'Mains libres désactivé'}</button></div>
      <form class="pg-text" onsubmit="pgTextSubmit(event)"><input id="pgInput" type="text" placeholder="Ou écris ta demande…" autocomplete="off"><button class="pg-small" type="submit">↗</button></form>
    </div></div>`;
  const l=document.getElementById('pgLog');if(l)l.scrollTop=l.scrollHeight;
}

render();
pgRender();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('/sw.js').catch(()=>{});
setInterval(()=>{if(page==='dashboard'&&!document.getElementById('modalhost').innerHTML)render()},60000);
</script>
