<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My I-Car</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#F5F6F8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My I-Car">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<style>
:root{
  --bg:#06111f;
  --bg2:#08172a;
  --panel:#0e1c31;
  --panel2:#12233b;
  --panel3:#102139;
  --line:rgba(117,174,255,.16);
  --softline:rgba(255,255,255,.06);
  --text:#f3f7ff;
  --muted:#94a3bf;
  --teal:#73e0cd;
  --teal2:#49cbb7;
  --green:#56d7c7;
  --cyan:#73d0ff;
  --amber:#f3b35e;
  --amber-soft:rgba(243,179,94,.18);
  --red:#dd7382;
  --red-soft:rgba(221,115,130,.18);
  --violet:#8c7cff;
  --violet-soft:rgba(140,124,255,.18);
  --shadow:0 18px 44px rgba(0,0,0,.32);
  --radius:26px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 72% 18%, rgba(43,184,160,.20), transparent 22%),
    radial-gradient(circle at 40% 12%, rgba(73,103,255,.18), transparent 24%),
    linear-gradient(180deg,#040c18 0%, #081120 30%, #071320 100%);
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:0 18px 110px}
.topbar{
  position:sticky;top:0;z-index:40;
  backdrop-filter:blur(14px);
  background:linear-gradient(180deg,rgba(4,12,24,.95),rgba(4,12,24,.78));
  border-bottom:1px solid rgba(255,255,255,.05);
}
.topbar-inner{max-width:1280px;margin:0 auto;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:48px;height:48px;border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.08);display:grid;place-items:center;box-shadow:var(--shadow)}
.mark img{width:34px;height:34px;display:block;opacity:.92}
.brand-title{font-size:24px;font-weight:900;letter-spacing:-.03em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ver{font-size:12px;font-weight:900;padding:6px 10px;border-radius:999px;background:linear-gradient(180deg,rgba(115,224,205,.26),rgba(115,224,205,.14));color:#a9fff0;border:1px solid rgba(115,224,205,.26)}
.brand-sub{font-size:13px;color:var(--muted);margin-top:4px}
.top-badge{padding:10px 13px;border-radius:14px;background:rgba(115,224,205,.10);border:1px solid rgba(115,224,205,.16);color:#baffef;font-weight:800;font-size:13px}
.hero{
  margin-top:18px;
  border-radius:34px;
  padding:28px 24px;
  background:
    radial-gradient(circle at 78% 20%, rgba(115,224,205,.18), transparent 22%),
    radial-gradient(circle at 60% 10%, rgba(88,110,255,.15), transparent 28%),
    linear-gradient(180deg, rgba(15,28,49,.96), rgba(11,23,40,.96));
  border:1px solid rgba(115,208,255,.18);
  box-shadow:var(--shadow);
}
.kicker{font-size:12px;font-weight:900;letter-spacing:.24em;text-transform:uppercase;color:#87f7e2;display:flex;align-items:center;gap:8px}
.hero h1{font-size:clamp(38px,6vw,66px);line-height:1.04;letter-spacing:-.045em;margin:14px 0 14px;max-width:780px}
.hero p{font-size:clamp(18px,2.8vw,22px);line-height:1.5;color:#adc0dc;max-width:850px;margin:0}
.hero-actions{display:flex;gap:14px;flex-wrap:wrap;margin-top:24px}
.btn{border:0;border-radius:20px;padding:18px 24px;font-size:17px;font-weight:900;line-height:1;display:inline-flex;align-items:center;gap:10px}
.btn-primary{background:linear-gradient(180deg,#76e3d1,#67d8c7);color:#062222;box-shadow:0 14px 30px rgba(103,216,199,.25)}
.btn-secondary{background:rgba(13,33,53,.75);color:#0B5F59;border:1px solid rgba(115,224,205,.22)}
.btn-dark{background:rgba(255,255,255,.03);color:#d7e6ff;border:1px solid rgba(255,255,255,.08)}
.hint-card{margin-top:20px;border-radius:24px;padding:18px 18px;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.02));border:1px solid rgba(115,208,255,.14)}
.hint-card strong{display:block;font-size:21px;margin-bottom:8px}
.hint-card span{display:block;font-size:17px;color:#afbed6;line-height:1.55}
.grid{display:grid;gap:16px}
.metrics{grid-template-columns:repeat(4,minmax(0,1fr));margin-top:18px}
.card{
  background:linear-gradient(180deg,rgba(13,27,47,.96),rgba(10,22,39,.96));
  border:1px solid rgba(112,162,234,.16);
  border-radius:30px;
  box-shadow:var(--shadow);
}
.metric{padding:22px 20px 20px;min-height:170px;display:flex;flex-direction:column;justify-content:space-between}
.metric-label{font-size:15px;font-weight:700;color:#aab9d1}
.metric-num{font-size:58px;font-weight:900;letter-spacing:-.05em;line-height:1;margin:16px 0 8px}
.metric-sub{font-size:16px;color:#91a4c0;line-height:1.45}
.metric .orange{color:#ffcb74}
.metric .mint{color:var(--teal)}
.metric .white{color:#f5f7fd}
.section{margin-top:22px;padding:22px}
.section-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.section-title{font-size:21px;font-weight:900;letter-spacing:-.03em;display:flex;align-items:center;gap:10px}
.section-badge{padding:10px 14px;border-radius:14px;font-size:14px;font-weight:900;border:1px solid transparent}
.badge-amber{background:var(--amber-soft);color:#ffcf87;border-color:rgba(243,179,94,.24)}
.badge-violet{background:var(--violet-soft);color:#c8bdff;border-color:rgba(140,124,255,.24)}
.badge-mint{background:rgba(115,224,205,.10);color:#a7fff3;border-color:rgba(115,224,205,.22)}
.alert-list{display:grid;gap:14px}
.alert-item{border-radius:22px;padding:18px;background:linear-gradient(180deg,rgba(16,33,58,.90),rgba(15,28,49,.92));border:1px solid rgba(255,255,255,.08);display:flex;gap:16px;align-items:flex-start}
.alert-icon{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:24px;font-weight:900;flex:0 0 auto;border:1px solid rgba(255,255,255,.06)}
.icon-red{background:var(--red-soft);color:#8A2A23}
.icon-amber{background:var(--amber-soft);color:#ffcf87}
.alert-body strong{display:block;font-size:18px;line-height:1.35;margin-bottom:6px}
.alert-body p{margin:0;color:#9caeca;font-size:15px;line-height:1.5}
.alert-actions{display:flex;gap:22px;flex-wrap:wrap;margin-top:14px}
.text-link{font-size:16px;font-weight:900}
.text-link.mint{color:#8ff2df}
.text-link.muted{color:#9dacbf}
.two-col{grid-template-columns:1.15fr .85fr;margin-top:22px}
.info-card{padding:22px}
.info-card h3{font-size:19px;margin:0 0 14px;display:flex;align-items:center;gap:10px}
.info-text{padding:18px;border-radius:20px;background:linear-gradient(180deg,rgba(62,173,152,.13),rgba(62,173,152,.08));border:1px solid rgba(115,224,205,.18);font-size:17px;line-height:1.65;color:#d9edf1}
.mini-graph{height:210px;display:flex;align-items:flex-end;justify-content:center;padding:20px 10px 10px}
.spark{width:100%;max-width:320px;height:130px;position:relative}
.spark svg{width:100%;height:100%}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.search,.select,.field input,.field textarea,.field select{
  width:100%;background:rgba(9,20,36,.95);color:#f0f6ff;border:1px solid rgba(120,151,198,.18);border-radius:18px;padding:16px 17px;font-size:16px;outline:none;
}
.search:focus,.select:focus,.field input:focus,.field textarea:focus,.field select:focus{border-color:rgba(115,224,205,.35);box-shadow:0 0 0 4px rgba(115,224,205,.08)}
.grow{flex:1;min-width:230px}.w240{width:240px;max-width:100%}
.table-card{overflow:hidden}
.table-scroll{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:780px}
th,td{padding:16px 18px;text-align:left;border-bottom:1px solid rgba(255,255,255,.06)}
th{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#7f93b3;font-weight:900;background:rgba(255,255,255,.02)}
td{font-size:15px;color:#edf4ff;vertical-align:top}
tr:hover td{background:rgba(255,255,255,.012)}
.t-muted{color:#a8b6cb}
.pill{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:8px 12px;font-size:13px;font-weight:900;border:1px solid transparent;white-space:nowrap}
.pill.red{background:var(--red-soft);color:#8A2A23;border-color:rgba(221,115,130,.22)}
.pill.orange{background:var(--amber-soft);color:#ffd08e;border-color:rgba(243,179,94,.22)}
.pill.green{background:rgba(115,224,205,.10);color:#b4fff1;border-color:rgba(115,224,205,.2)}
.pill.gray{background:rgba(255,255,255,.05);color:#cad6e8;border-color:rgba(255,255,255,.07)}
.table-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn-mini{border:0;border-radius:14px;padding:10px 12px;font-size:14px;font-weight:900}
.btn-edit{background:rgba(115,224,205,.12);color:#affff1}
.btn-del{background:rgba(221,115,130,.16);color:#ffc5d0}
.table-foot{padding:14px 18px;color:#90a2bd;font-size:14px}
.empty{padding:32px 18px;color:#9cb0cc;text-align:center;font-size:16px}
.modalback{position:fixed;inset:0;background:rgba(0,8,16,.7);display:grid;place-items:center;z-index:70;padding:18px}
.modal{width:min(760px,100%);max-height:92vh;overflow:auto;background:linear-gradient(180deg,#0d1b2f,#0b182b);border:1px solid rgba(118,164,235,.18);border-radius:28px;padding:22px;box-shadow:var(--shadow)}
.modal h2{margin:0 0 18px;font-size:30px;letter-spacing:-.04em}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{margin-bottom:14px}
.field label{display:block;font-size:14px;font-weight:900;color:#d5e4fb;margin-bottom:8px}
.field textarea{min-height:100px;resize:vertical}
.contrat{background:#f4f1e8;color:#1a1a1a;border-radius:16px;padding:16px;font-size:15px;line-height:1.55;margin:4px 0 14px}
.contrat h3{margin:0 0 6px;color:#1a1a1a}
.sig-titre{font-size:14px;font-weight:900;color:#d5e4fb;margin:4px 0 8px}
.sig-wrap{border:2px dashed var(--amber);border-radius:16px;background:#fff;position:relative;touch-action:none}
.sig-wrap.done{border:2px solid var(--green)}
.sig-wrap canvas{display:block;width:100%;height:180px;touch-action:none}
.sig-ph{position:absolute;inset:0;display:grid;place-items:center;color:#9a8f7a;font-weight:800;pointer-events:none}
.sig-img{background:#fff;border-radius:12px;max-height:120px;max-width:100%;display:block;margin-bottom:8px}
.photo-permis{max-height:180px;max-width:100%;border-radius:12px;border:1px solid var(--line);margin-top:8px;display:block}
.sms-texte{white-space:pre-wrap;user-select:all;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:15px;line-height:1.5}
.buttons{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:20px}
.notice{padding:18px;border-radius:20px;background:linear-gradient(180deg,rgba(19,43,56,.9),rgba(14,34,48,.88));border:1px solid rgba(115,224,205,.18);color:#d2edf0;font-size:16px;line-height:1.6}
.help-grid,.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.step-card,.settings-card{padding:20px}
.step-num{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:rgba(115,224,205,.14);border:1px solid rgba(115,224,205,.20);color:#b5fff1;font-weight:900;margin-bottom:12px}
.step-card h3,.settings-card h3{margin:0 0 10px;font-size:22px}
.step-card p,.settings-card p{margin:0;color:#a6b8d1;font-size:16px;line-height:1.6}
.mobile-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  padding:10px 10px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(5,12,22,.88),rgba(5,12,22,.96));backdrop-filter:blur(16px);border-top:1px solid rgba(255,255,255,.05)
}
.mobile-nav-grid{max-width:900px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.mtab{border:0;background:transparent;color:#a3b4cb;border-radius:22px;padding:12px 2px 10px;min-width:0;font-size:12px;font-weight:800;line-height:1.15;display:flex;flex-direction:column;align-items:center;gap:6px}
.mtab .ico{font-size:24px;line-height:1}
.mtab.active{background:linear-gradient(180deg,rgba(59,142,127,.32),rgba(34,90,79,.24));color:#9ff5e6;border:1px solid rgba(115,224,205,.18)}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#10283a;color:#e8f9ff;border:1px solid rgba(115,224,205,.2);padding:13px 18px;border-radius:16px;display:none;z-index:80;font-size:15px;font-weight:900}
@media (max-width:1100px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.two-col{grid-template-columns:1fr}}
@media (max-width:760px){
  .wrap{padding:0 14px 110px}
  .topbar-inner{padding:12px 14px}
  .brand-title{font-size:20px}
  .mark{width:42px;height:42px}.mark img{width:30px;height:30px}
  .top-badge{display:none}
  .hero{padding:24px 18px;border-radius:30px}
  .hero p{font-size:18px}
  .btn{width:100%;justify-content:center}
  .metrics{grid-template-columns:1fr 1fr}
  .metric{min-height:150px;padding:20px 18px}
  .metric-num{font-size:48px}
  .section{padding:18px}
  .alert-item{padding:16px}
  .fields,.help-grid,.settings-grid{grid-template-columns:1fr}
}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:16px}
.menu-tile{display:flex;align-items:center;gap:14px;padding:18px;text-align:left;color:inherit;font:inherit;cursor:pointer;border:1px solid rgba(255,255,255,.08)}
.menu-tile:active{transform:scale(.98)}
.menu-ico{width:46px;height:46px;flex:none;border-radius:16px;display:grid;place-items:center;font-size:22px;background:rgba(115,224,205,.14);color:#0B5F59}
.menu-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}.menu-txt strong{font-size:17px}.menu-txt small{color:#5B6475;font-size:14px}
.menu-count{font-weight:900;font-size:18px;color:#cfe0f5;background:rgba(255,255,255,.07);border-radius:12px;padding:6px 11px}
.metric.click{cursor:pointer}.metric.click:active{transform:scale(.98)}
 @media (max-width:760px){
  .table-scroll{overflow:visible}
  .table-card table,.table-card tbody,.table-card tr,.table-card td{display:block;width:100%;min-width:0}
  .table-card thead{display:none}
  .table-card tbody tr{padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.07)}
  .table-card td{border:0!important;padding:5px 0!important;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:right;white-space:normal}
  .table-card td[data-label]::before{content:attr(data-label);color:#8aa0bf;font-size:13px;font-weight:800;text-align:left;flex:none;max-width:45%}
  .table-card td:first-child{font-size:17px;font-weight:900}
  .table-card td.td-actions{padding-top:10px!important}
  .table-card .table-actions{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .table-card .btn-mini{padding:12px;font-size:15px}
  .table-card td[colspan]{display:block}
}
@media (max-width:520px){.metrics{grid-template-columns:1fr}.hero h1{font-size:34px}.metric-num{font-size:44px}.section-title{font-size:19px}.mobile-nav-grid{gap:6px}.mtab{font-size:11px}.mtab .ico{font-size:22px}}

/* Pilote vocal : contraste et ergonomie tactile */
.voice-entry{margin-top:18px;padding:18px 20px;border:1px solid rgba(115,224,205,.25);border-radius:26px;background:linear-gradient(135deg,rgba(49,141,132,.22),rgba(22,31,64,.25));display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}
.voice-entry h3{font-size:23px;margin:0 0 7px}.voice-entry p{font-size:16px;color:#b8c9dd;margin:0}.voice-entry .btn{padding:15px 20px}
.voice-shell{margin-top:18px;display:grid;gap:18px;grid-template-columns:minmax(0,1.5fr) minmax(260px,.85fr)}
.voice-panel{padding:24px;background:linear-gradient(150deg,rgba(17,37,59,.99),rgba(11,24,43,.96));border:1px solid rgba(115,224,205,.17);border-radius:30px;box-shadow:var(--shadow)}
.voice-title{font-size:clamp(25px,4vw,37px);letter-spacing:-.04em;font-weight:900;margin:10px 0 12px;line-height:1.15}
.voice-intro{font-size:17px;line-height:1.55;color:#a8bdd7}
.voice-progress{display:flex;justify-content:space-between;align-items:center;margin:20px 0 12px;color:#b9cee4;font-size:14px;font-weight:800}
.voice-progressbar{height:9px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden}
.voice-progressbar>div{height:100%;border-radius:999px;background:linear-gradient(90deg,#4cb7aa,#7bf6dd);transition:width .2s}
.voice-question{font-size:24px;font-weight:850;line-height:1.4;letter-spacing:-.025em;padding:23px;border-radius:22px;background:linear-gradient(120deg,rgba(115,224,205,.13),rgba(140,124,255,.10));border:1px solid rgba(115,224,205,.18);margin:18px 0}
.voice-state{font-size:15px;font-weight:750;color:#9fe7d8;margin:10px 0}
.voice-controls{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.voice-controls .btn{font-size:16px;padding:15px 19px}
.voice-textform{display:flex;gap:9px;margin-top:12px}.voice-textform input{min-width:0;flex:1;width:auto;background:#08172b;border:1px solid rgba(157,181,214,.26);border-radius:18px;padding:16px;color:#f3f7ff;font-size:17px}.voice-textform button{white-space:nowrap}
.voice-transcript{margin-top:12px;padding:15px;border-radius:18px;background:rgba(5,13,27,.65);border:1px solid rgba(255,255,255,.06);color:#c4d3e8;font-size:15px;line-height:1.6}
.voice-summary{display:grid;gap:9px;margin:14px 0}
.voice-srow{display:grid;grid-template-columns:minmax(135px, .9fr) 1.5fr auto;align-items:center;gap:10px;background:rgba(255,255,255,.025);border-radius:15px;padding:11px 12px;border:1px solid rgba(255,255,255,.06)}
.voice-srow small{font-size:14px;color:#97abc6}.voice-srow strong{font-size:16px;overflow-wrap:anywhere}.voice-srow button{border:0;background:rgba(115,224,205,.11);color:#b0fff1;border-radius:12px;padding:9px 12px;font-size:14px;font-weight:800}
.voice-side h3{font-size:21px;margin:0 0 12px}.voice-side p{font-size:16px;color:#adbfda;line-height:1.65}
.voice-feature{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.07);color:#e0ecff;font-size:15px;line-height:1.6}.voice-feature:last-child{border:0}
.voice-tip{color:#9df9e7;font-size:14px;font-weight:800;margin-top:12px}
.voice-warning{color:#ffd190;background:rgba(243,179,94,.10);border:1px solid rgba(243,179,94,.18);border-radius:15px;padding:12px 14px;font-size:14px;line-height:1.45;margin:10px 0}
.voice-entry-card{padding:24px;border-radius:28px;border:1px solid rgba(115,224,205,.16);background:linear-gradient(140deg,rgba(35,81,83,.28),rgba(12,24,43,.96));margin-top:18px}
.voice-entry-card h2{font-size:26px;margin:0 0 10px}.voice-entry-card p{font-size:17px;line-height:1.55;color:#adc5d5}

/* V9 — Pilote global : bouton micro flottant + panneau de conversation, sur toutes les pages */

#toast{background:var(--ink)!important;color:#fff!important;border:0!important;border-radius:14px!important;box-shadow:0 12px 30px rgba(20,33,61,.3)}
.pg-fab{background:var(--ink)!important;color:#fff!important;box-shadow:0 10px 26px rgba(20,33,61,.35)!important}
.pg-panel{background:#fff!important;border:1px solid var(--bord)!important;box-shadow:0 30px 70px rgba(20,33,61,.25)!important;animation:monte .28s cubic-bezier(.2,.9,.3,1.2)}
.pg-head strong{color:var(--ink)!important}.pg-head small,.pg-state{color:var(--mut)!important}.pg-x,.pg-small{background:#F1F3F6!important;color:var(--ink)!important;border:0!important}
.pg-msg.aurel{background:var(--ink)!important;color:#fff!important}.pg-msg.pilote{background:#F1F3F6!important;color:var(--ink)!important}.pg-msg .pg-done{color:#0B5F59!important}
.pg-chip{background:#fff!important;border:1px solid var(--bord)!important;color:var(--ink)!important}.pg-mic{background:var(--ink)!important;color:#fff!important}
.pg-head,.pg-foot{border-color:#EEF0F3!important}
.voice-question{background:var(--st)!important;border:0!important;color:var(--ink)}.voice-feature{color:var(--ink)!important;border-color:#EEF0F3!important}.voice-transcript,.voice-srow{background:#F8F9FB!important;color:var(--ink)!important;border-color:#EEF0F3!important}.voice-srow small{color:var(--mut)!important}.voice-srow button{background:var(--st)!important;color:var(--sd)!important}.voice-state,.voice-tip{color:var(--s)!important}.voice-progress{color:var(--mut)!important}.voice-progressbar{background:#EEF0F3!important}.voice-progressbar>div{background:var(--s)!important}

/* Calendrier en clair */
.cal-btn{background:#fff!important;border:1px solid var(--bord)!important;color:var(--ink)!important}
.cal-jour{background:#fff!important;border:1px solid var(--bord)!important;color:var(--ink);transition:transform .15s,background .25s}
.cal-jour.auj{border:2px solid #2F62C9!important}.cal-jour.sel{background:var(--ink)!important;color:#fff!important;border-color:var(--ink)!important;box-shadow:0 8px 18px rgba(20,33,61,.25)}.cal-jour.sel small{color:#C9D2E3!important}
.cal-sp-titre{color:#6B4FBB!important}.cal-sp .cal-jour{border-style:dashed!important;border-color:#CFC6EE!important}
.cal-ev{background:#fff!important;border:1px solid var(--bord)!important;border-left:5px solid var(--c)!important;color:var(--ink)!important;box-shadow:0 1px 2px rgba(20,33,61,.04);transition:transform .15s}
.cal-ev.afaire{background:var(--t)!important}.cal-ev.afaire .cal-h,.cal-ev.afaire .cal-type{color:var(--d)!important;opacity:1}
.cal-ev.urgent{background:var(--d)!important;border-color:var(--d)!important;color:#fff!important;box-shadow:0 10px 22px rgba(20,33,61,.22)}.cal-ev.urgent .cal-h,.cal-ev.urgent .cal-type{color:#fff!important}.cal-ev.urgent .cal-type{opacity:.85}.cal-ev.urgent .cal-ok{border-color:rgba(255,255,255,.4)!important;color:#fff}
.cal-ok{border:1px solid #D5D9E0!important;background:#fff!important;color:var(--ink)}.cal-ev.urgent .cal-ok{background:transparent!important}
/* ════ Cockpit ════ */
.ck{display:flex;flex-direction:column;gap:18px;margin-top:18px}
.dedicace{margin:26px auto 6px;display:flex;flex-direction:column;align-items:center;gap:2px;color:#14213D;text-align:center}
.dedicace span{font-family:'Fraunces',Georgia,serif;font-size:20px}.dedicace small{font-size:13px;color:#5B6475;font-style:italic}
.dedicace-coeur{color:#C2413A;font-size:22px!important;animation:battement 1.6s ease-in-out infinite}
@keyframes battement{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
.chv-box{position:relative;flex:none;display:inline-block;margin:2px -6px -8px 0}
.ck-chevre{width:124px;height:102px;display:block;cursor:pointer;overflow:visible;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.ck-chevre .chv-corps{transform-box:view-box;transform-origin:74px 110px}
.ck-chevre .chv-tete{transform-box:view-box;transform-origin:104px 50px;animation:chvRespire 3.6s ease-in-out infinite}
.ck-chevre .chv-queue{transform-box:fill-box;transform-origin:95% 85%;animation:chvQueue 1.3s ease-in-out infinite}
.ck-chevre .chv-oeil{transform-box:fill-box;transform-origin:50% 50%;animation:chvCligne 4.6s infinite}
.ck-chevre .chv-pup{transition:transform .18s ease-out}
.ck-chevre .chv-sourcil,.ck-chevre .chv-bouche{transform-box:fill-box;transform-origin:50% 50%;transition:transform .25s}
@keyframes chvRespire{0%,100%{transform:rotate(0)}50%{transform:rotate(-2.5deg) translateY(-.6px)}}
@keyframes chvQueue{0%,100%{transform:rotate(0)}50%{transform:rotate(-16deg)}}
@keyframes chvCligne{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
/* Saut à la Disney : on se tasse (anticipation), on s'étire en l'air, on s'écrase à l'atterrissage */
.ck-chevre.saute .chv-corps{animation:chvSaut .9s cubic-bezier(.3,.7,.4,1)}
.ck-chevre.saute .chv-ombre{transform-box:fill-box;transform-origin:50% 50%;animation:chvOmbre .9s ease}
@keyframes chvSaut{0%{transform:none}15%{transform:scale(1.12,.84)}40%{transform:translateY(-12px) scale(.9,1.14) rotate(-6deg)}62%{transform:translateY(-4px) scale(.96,1.05)}74%{transform:scale(1.14,.86)}86%{transform:scale(.97,1.04)}100%{transform:none}}
@keyframes chvOmbre{40%{transform:scale(.55);opacity:.04}74%{transform:scale(1.15)}}
/* Danse (3 touches rapides) */
.ck-chevre.danse .chv-corps{animation:chvDanse 1.4s ease-in-out}
@keyframes chvDanse{0%,100%{transform:none}20%{transform:rotate(-10deg) translateY(-8px)}40%{transform:rotate(10deg) translateY(-14px)}60%{transform:rotate(-8deg) translateY(-8px)}80%{transform:rotate(6deg) translateY(-3px)}}
/* Appui long : elle broute */
.ck-chevre.broute .chv-tete{animation:chvBroute 1.6s ease-in-out}
@keyframes chvBroute{0%,100%{transform:none}25%,80%{transform:rotate(34deg) translateY(10px)}35%,55%{transform:rotate(30deg) translateY(12px)}45%,65%{transform:rotate(36deg) translateY(10px)}}
.ck-chevre.content .chv-sourcil{transform:translateY(-1.6px)}.ck-chevre.content .chv-bouche{transform:scale(1.25,1.5)}
.chv-bulle{position:absolute;right:112px;top:14px;background:#14213D;color:#fff;font-size:13px;font-weight:700;padding:7px 11px;border-radius:14px 14px 4px 14px;width:max-content;max-width:170px;white-space:normal;text-align:right;line-height:1.25;pointer-events:none;opacity:0;transform:translateY(6px) scale(.9);transform-origin:100% 100%;transition:opacity .2s,transform .25s cubic-bezier(.3,1.5,.5,1);box-shadow:0 8px 18px rgba(20,33,61,.22);z-index:2}
.chv-bulle.on{opacity:1;transform:none}
.chv-coeur{position:absolute;pointer-events:none;font-size:16px;animation:chvCoeur 1.1s ease-out forwards;z-index:2}
@keyframes chvCoeur{0%{opacity:0;transform:translate(0,0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-46px) scale(1.15) rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){.ck-chevre *{animation:none!important}}
.ck-chevre.saute{animation:sautChevre .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes broute{0%,100%{transform:rotate(0)}50%{transform:rotate(-3deg) translateY(1px)}}
@keyframes sautChevre{0%{transform:translateY(0)}40%{transform:translateY(-22px) rotate(-8deg)}100%{transform:translateY(0)}}
.ck-hello small{font-size:13px;font-weight:700;color:var(--mut);letter-spacing:.07em;text-transform:uppercase}
.ck-hello h1{margin:4px 0 0;font-size:32px;font-weight:600;line-height:1.1}
.ck-tuiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ck-tuile{border:0;border-radius:18px;padding:14px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;cursor:pointer;font:inherit;transition:transform .15s}
.ck-tuile b{font-family:'Fraunces',Georgia,serif;font-size:32px;font-weight:600;line-height:1.05}.ck-tuile span{font-size:12.5px;font-weight:700}
.ck-prio{border-radius:22px;padding:18px;color:#fff;display:flex;flex-direction:column;gap:10px;box-shadow:0 14px 30px rgba(20,33,61,.22)}
.ck-prio small{font-size:12px;font-weight:800;letter-spacing:.09em;opacity:.8}.ck-prio p{margin:0;font-size:16px;line-height:1.45}
.ck-prio button{align-self:flex-start;border:0;background:#fff;color:var(--ink);font:inherit;font-weight:800;font-size:14px;padding:11px 16px;border-radius:12px;cursor:pointer}
.ck-ok{border-radius:22px;padding:16px 18px;background:#E3F2F0;color:#084843;font-weight:700}
.ck-bloc{display:flex;flex-direction:column;gap:10px}
.ck-titre{display:flex;align-items:center;gap:10px}.ck-titre i{width:4px;height:20px;border-radius:2px}.ck-h{margin:0;font-size:21px;font-weight:600;flex:1}.ck-titre button{border:0;background:none;font:inherit;font-size:14px;font-weight:700;cursor:pointer;padding:8px 0}
.ck-ligne{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--bord);border-radius:14px;padding:12px 14px;cursor:pointer;width:100%;font:inherit;color:inherit;text-align:left;transition:transform .15s}
.ck-ligne b{width:48px;font-size:15px;flex-shrink:0}.ck-ligne span{flex:1;font-size:15px;min-width:0;overflow-wrap:anywhere}
.ck-pre{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.ck-pre button{border-radius:12px;padding:10px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font:inherit;border:1px solid #F1D5BC;background:#fff;color:var(--ink);transition:transform .15s}
.ck-pre b{font-size:13px;text-align:center;line-height:1.15}.ck-pre span{font-size:11px;font-weight:700}
.ck-at{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.ck-at button{border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px;cursor:pointer;font:inherit;text-align:left;border:1px solid #CDE7E3;transition:transform .15s}
.ck-at b{font-size:20px;font-family:'Fraunces',Georgia,serif}.ck-at span{font-size:11.5px;font-weight:700}
.ck-vide{font-size:14px;color:var(--mut);padding:4px 2px}
/* ════ Effets : transitions de page, entrée en cascade ════ */
@keyframes fondu{from{opacity:0}}
@keyframes monte{from{opacity:0;transform:translateY(24px) scale(.98)}}
@keyframes entre{from{opacity:0;transform:translateY(14px)}}
#root.entree>*{animation:entre .45s cubic-bezier(.2,.8,.2,1) both}
#root.entree>*:nth-child(2){animation-delay:.05s}#root.entree>*:nth-child(3){animation-delay:.1s}#root.entree>*:nth-child(4){animation-delay:.15s}#root.entree>*:nth-child(5){animation-delay:.2s}#root.entree>*:nth-child(n+6){animation-delay:.25s}
#root.entree .ck>*{animation:entre .5s cubic-bezier(.2,.8,.2,1) both}
#root.entree .ck>*:nth-child(2){animation-delay:.06s}#root.entree .ck>*:nth-child(3){animation-delay:.12s}#root.entree .ck>*:nth-child(4){animation-delay:.18s}#root.entree .ck>*:nth-child(5){animation-delay:.24s}#root.entree .ck>*:nth-child(n+6){animation-delay:.3s}
#root.entree .cal-ev{animation:entre .4s cubic-bezier(.2,.8,.2,1) both}
#root.entree .cal-ev:nth-of-type(2){animation-delay:.05s}#root.entree .cal-ev:nth-of-type(3){animation-delay:.1s}#root.entree .cal-ev:nth-of-type(n+4){animation-delay:.15s}
::view-transition-old(root){animation:.22s ease-in both vtSort}
::view-transition-new(root){animation:.32s cubic-bezier(.2,.8,.2,1) both vtEntre}
@keyframes vtSort{to{opacity:0;transform:scale(.985)}}
@keyframes vtEntre{from{opacity:0;transform:translateY(18px)}}
.mobile-nav,.topbar{view-transition-name:none}
@media (prefers-reduced-motion:reduce){*,::view-transition-old(root),::view-transition-new(root){animation:none!important;transition:none!important}}
</style>

<script>
const STORAGE_KEY='myicar_v8_data';
const LEGACY_KEYS=['myicar_v7_data','myicar_v6_data','myicar_v5_data','myicar_v4_data'];
const initial={expertises:[],vehicules:[],prets:[],clients:[],taches:[],planning:[]};
let db=load(), page='dashboard', query='', filter='';
const sections=[
  ['dashboard','◈','Cockpit'],
  ['vehicules','▤','Dossiers'],
  ['planning','▦','Planning'],
  ['prets','▬','Prêts'],
  ['assistant','✦','Dossier vocal'],
  ['menu','☰','Plus']
];
// Pages rangées sous « Plus » : l'onglet reste allumé quand on y est.
const MENU_PAGES=['menu','garage','clients','expertises','taches','aide','parametres','education','installer'];
const configs={
  expertises:{sing:'expertise',title:'Expertises',cols:[['client','Client'],['immatriculation','Immatriculation'],['date','Date RDV'],['statut','Statut'],['notes','Observations']],fields:[['client','Client','text',1],['immatriculation','Immatriculation','text'],['date','Date de rendez-vous','date'],['statut','Statut','select','',['Sans RDV','RDV fixé','Réalisée','À relancer']],['notes','Observations','textarea']]},
  vehicules:{sing:'dossier',title:'Dossiers',cols:[['client','Client'],['modele','Véhicule'],['immatriculation','Immatriculation'],['statut','Étape'],['priorite','Priorité']],fields:[['client','Client','text',1],['modele','Modèle','text'],['immatriculation','Immatriculation','text'],['statut','Étape','select','',['À chiffrer','En attente','À planifier','En travaux','Peinture','Prêt à livrer','Livré']],['priorite','Priorité (1 à 10)','number'],['telephone','Téléphone client','tel'],['sinistre','Sinistre','text'],['assurance','Assurance','text'],['expertise','Expertise','select','',['À prévoir','RDV fixé','Faite','Non nécessaire']],['prochaine_action','Prochaine action','text'],['date_action','Pour quand','date'],['responsable','Responsable','select','',['Enzo','IB','Brahim','Aurel','Autre']],['montant','Montant estimé des travaux (€)','number'],['notes','Observations','textarea']]},
  prets:{sing:'prêt',title:'Prêts',cols:[['nom','Véhicule de prêt'],['client','Client'],['date_depart','Départ',r=>dateHeure(r.date_depart,r.heure_depart)],['date_retour','Retour prévu',r=>dateHeure(r.date_retour,r.heure_retour)],['statut','Statut',r=>pretEnRetard(r)?'<span class="pill red">En retard</span>':status(r.statut)],['signature','Contrat',r=>r.signature?`<span class="pill green">✍️ Signé${r.signe_distance?' à distance':''}</span>`:r.sign_jeton?'<span class="pill orange">📩 Envoyé, en attente</span>':r.statut==='Prêté'?'<span class="pill red">Non signé</span>':'—']],fields:[['nom','Véhicule de prêt','text',1],['client','Client bénéficiaire','text'],['telephone','Téléphone du client','tel'],['email','E-mail du client (facultatif)','email'],['date_depart','Date de départ','date'],['heure_depart','Heure de départ','time'],['date_retour','Retour prévu le','date'],['heure_retour','Heure de retour prévue','time'],['statut','Statut','select','',['Disponible','Réservé','Prêté','Retourné']],['dossier','Dossier atelier du client (sa voiture en réparation)','select','',[]],['km_retour','Kilométrage au retour','number'],['notes','Observations','textarea']]},
  planning:{sing:'rendez-vous',title:'Planning',cols:[['date','Date'],['heure','Heure'],['titre','Intervention / RDV'],['responsable','Responsable'],['statut','Statut']],fields:[['date','Date','date',1],['heure','Heure','time'],['titre','Intervention / RDV','text',1],['responsable','Responsable','select','',['Enzo','IB','Brahim','Aurel','Autre']],['statut','Statut','select','',['Prévu','En cours','Terminé']],['notes','Observations','textarea']]},
  clients:{sing:'client',title:'Clients',cols:[['nom','Nom'],['telephone','Téléphone'],['email','E-mail'],['vehicule','Véhicule'],['notes','Observations']],fields:[['nom','Nom du client','text',1],['telephone','Téléphone','tel'],['email','E-mail','email'],['vehicule','Véhicule','text'],['notes','Observations','textarea']]},
  taches:{sing:'signal',title:'Pilote',cols:[['titre','Tâche / signal'],['client','Client'],['echeance','Échéance'],['responsable','Responsable'],['statut','Statut']],fields:[['titre','Tâche / signal','text',1],['client','Client','text'],['echeance','Échéance','date'],['responsable','Responsable','select','',['Enzo','IB','Brahim','Aurel','Autre']],['statut','Statut','select','',['À faire','En cours','Terminée']],['notes','Observations','textarea']]}
};
function clone(v){return JSON.parse(JSON.stringify(v))}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function load(){
  try{
    const current=localStorage.getItem(STORAGE_KEY);
    if(current) return {...clone(initial),...JSON.parse(current)};
    for(const k of LEGACY_KEYS){
      const old=localStorage.getItem(k);
      if(old){
        const data={...clone(initial),...JSON.parse(old)};
        localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
        return data;
      }
    }
  }catch(e){}
  return clone(initial)
}
function save(silent=false){if(typeof planningDesPrets==='function')planningDesPrets();try{localStorage.setItem(STORAGE_KEY,JSON.stringify(db)); if(!silent) toast(sync.etat==='ok'?'Enregistré pour toute l’équipe':'Enregistré');}catch(e){toast('Mémoire du téléphone pleine : exporte une sauvegarde')} if(typeof syncPlus==='function')syncPlus()}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(window.__tt);window.__tt=setTimeout(()=>e.style.display='none',2200)}
function go(p){page=p;query='';filter='';render()}
function dateHeure(d,h){if(!d&&!h)return '—';const t=d?d.split('-').reverse().join('/'):'';return esc([t,h].filter(Boolean).join(' à '))}
// Une voiture prêtée est en retard si l'heure (ou, sans heure, la journée) de retour prévue est passée.
function pretEnRetard(x){if(x.statut!=='Prêté'||!x.date_retour)return false;const fin=new Date(x.date_retour+'T'+(x.heure_retour||'23:59'));return !isNaN(fin)&&fin<new Date()}
function countActive(){return db.vehicules.filter(x=>String(x.statut||'')!=='Livré').length}
function countRisk(){return db.prets.filter(pretEnRetard).length + (typeof pretAlertes==='function'?pretAlertes().length:0) + db.expertises.filter(x=>x.statut==='Sans RDV'||!x.date).length + db.taches.filter(x=>x.statut!=='Terminée').length}
function countLoansActive(){return db.prets.filter(x=>x.statut==='Prêté').length}
function countLoansAvailable(){return db.prets.filter(x=>x.statut==='Disponible').length}
function portfolioAmount(){let total=0; db.vehicules.forEach(x=>{const m=parseFloat(String(x.montant||'').replace(',','.')); if(!isNaN(m) && String(x.statut||'')!=='Livré') total+=m}); return total}
function localISO(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function todayCount(){const t=localISO(); return db.planning.filter(x=>x.date===t && x.statut!=='Terminé').length}
function status(v){
  const s=String(v??'').trim();
  let cl='gray';
  if(/Sans RDV|À faire|En attente|À relancer|À chiffrer/i.test(s)) cl='red';

// Lit le texte, puis appelle fini() quand c'est terminé (ou si la voix ne marche pas).
function ttsSay(texte,fini){

    setTimeout(()=>{if(id===tts.seq&&!termine)fin()},Math.min(40000,3000+texte.length*110));

  }

    <form class="voice-textform" onsubmit="voiceTextSubmit(event)"><input id="voiceAnswer" type="text" placeholder="Ou écrire une réponse ici…" autocomplete="off" aria-label="Réponse écrite"><button class="btn btn-secondary" type="submit">Envoyer ↗</button></form>`}
  ${voice.transcript?`<div class="voice-transcript">Dernière réponse : « ${esc(voice.transcript)} »</div>`:''}`;
  return `<section class="hero"><div class="kicker">✦ Copilote de dossier</div><h1>Parle. Je construis le dossier.</h1><p>Une information à la fois, sans perdre le fil. Le pilote prépare la fiche et te demande confirmation avant de l’enregistrer.</p></section><div class="voice-shell"><section class="voice-panel"><div class="kicker">🎙️ Entretien guidé</div><div class="voice-title">${voice.phase==='review'?'Vérification finale':voice.phase==='saved'?'Dossier prêt':'Création interactive'}</div>${content}${voice.error?`<div class="voice-warning">⚠ ${esc(voice.error)}</div>`:''}</section><aside class="voice-panel voice-side"><h3>Comment ça marche ?</h3><div class="voice-feature">1. Tu racontes le dossier à ta façon.</div><div class="voice-feature">2. Le pilote IA comprend tout ce que tu dis, même plusieurs infos d’un coup.</div><div class="voice-feature">3. Il pose seulement les questions qui manquent.</div><div class="voice-feature">4. Il te montre le récap, tu corriges en parlant, puis tu confirmes.</div><p>${voice.aiOff?'⚠ Pilote IA injoignable pour l’instant : questions classiques (règles locales).':'Le pilote utilise l’IA (ChatGPT, ou Gemini en secours) via ton site Netlify. Tes clés restent cachées sur le serveur.'}</p><p>${micOK?'✅ Reconnaissance vocale détectée dans ce navigateur.':'⚠ Reconnaissance vocale indisponible dans ce navigateur. La saisie écrite reste utilisable.'}</p><p>Le navigateur peut demander l’autorisation d’utiliser le micro. Selon l’appareil, tu devras retoucher le bouton micro à chaque réponse.</p><div class="voice-tip">Tu peux dire « passe », « je ne sais pas », « annuler » ou « enregistre » lors de la confirmation.</div><div class="voice-controls"><button class="btn btn-dark" onclick="go('expertises')">Expertises</button><button class="btn btn-dark" onclick="go('clients')">Clients</button><button class="btn btn-dark" onclick="go('taches')">Relances</button><button class="btn btn-dark" onclick="go('parametres')">Sauvegardes</button></div></as // V9 — PILOTE GLOBAL À VOIX HAUTE
// Un bouton micro sur toutes les pages. Aurel parle, la fonction Netlify
// /api/pilote-global (Gemini) comprend la demande et renvoie : une réponse lue
// à voix haute + des actions (afficher une page, ajouter, modifier, supprimer).
// Les suppressions demandent une confirmation ; chaque changement peut être annulé.
// ───────────────────────────────────────────────────────────────────────────
const GLOBAL_URL='/api/pilote-global';
const PG_PAGES=['dashboard','vehicules','planning','prets','taches','clients','expertises','assistant','aide','parametres','education','garage'];
const pg={open:false,listening:false,thinking:false,mainsLibres:true,log:[],pending:null,undo:null,error:'',recognition:null};
const PG_EXEMPLES=['Quelles voitures de prêt sont disponibles ?','Qu’est-ce que j’ai demain au planning ?','Prête la Clio à Monsieur Martin jusqu’à vendredi','Passe le dossier Dupont en peinture'];

function pgId(){return crypto.randomUUID?.()||String(Date.now()+Math.random())}
function pgMaintenant(){const d=new Date();const j=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'][d.getDay()];return `${localISO(d)} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}, ${j}`}
function pgOpen(){pg.open=true;pg.error='';pgRender();pgListen()}
function pgClose(){pg.actif=false;pgStopMic();ttsStop();pg.open=false;pgRender()}
function pgToggleMains(){pg.mainsLibres=!pg.mainsLibres;pgRender()}
function pgStopMic(){if(pg.recognition){try{pg.recognition.abort()}catch(e){}}pg.recognition=null;pg.listening=false}
function pgPush(qui,texte,done=''){pg.log.push({qui,texte,done});if(pg.log.length>40)pg.log.splice(0,pg.log.length-40)}

// Test du son : parle directement dans l'appui (le cas le plus sûr pour Chrome Android).
function pgTestSon(){
  pgStopMic();
  if(!window.speechSynthesis){pg.error='Ce navigateur ne sait pas lire à voix haute. Utilise Chrome.';pgRender();return}
  const n=(window.speechSynthesis.getVoices()||[]).filter(v=>/^fr/i.test(v.lang)).length;
  ttsSay('Test du son. Si tu m’entends, la voix du pilote fonctionne.',()=>{
    if(tts.bloque)pg.error='Aucun son : vérifie Paramètres du téléphone, puis Synthèse vocale : moteur Google, langue français installée.'+(n?'':' Aucune voix française trouvée sur ce téléphone.');
    pgRender();

}
function pgSpeak(t){
  ttsSay(t,()=>{pgRender();if(pg.actif)pgRelance();else if(pg.mainsLibres&&pg.open&&!pg.thinking&&!pg.listening&&!tts.bloque)setTimeout(pgListen,300)});
}

function pgListen(){
  if(!pg.open||pg.listening||pg.thinking)return;
  if(!window.isSecureContext){pg.error='Le micro ne marche que depuis l’adresse https de ton site. Tu peux écrire ta demande en dessous.';pgRender();return}
  if(!SpeechRec){pg.error='Ce navigateur ne reconnaît pas la voix. Utilise Chrome, ou écris ta demande en dessous.';pgRender();return}
  if(voice.listening||voice.autopilot)voiceStop(); // un seul micro à la fois
  try{
    ttsStop();
    const r=new SpeechRec();
    r.lang='fr-FR';r.interimResults=false;r.continuous=false;r.maxAlternatives=1;
    pg.recognition=r;pg.listening=true;pg.error='';if(pg.mainsLibres)pg.actif=true;
    r.onresult=e=>{const t=e.results?.[0]?.[0]?.transcript?.trim()||'';pgStopMic();if(t){pg.echecs=0;pgSend(t)}else pgRender()};
    r.onerror=e=>{pgStopMic();if(e.error==='not-allowed'||e.error==='service-not-allowed'){pg.actif=false;pg.error='Micro refusé. Autorise le micro pour ce site dans Chrome, puis réessaie.'}else if(e.error!=='no-speech'&&e.error!=='aborted'){pg.echecs=(pg.echecs||0)+1;pg.error='Micro : '+e.error+'. Tu peux écrire ta demande.'}pgRender()};
    r.onend=()=>{pg.listening=false;pg.recognition=null;pgRender();pgRelance()};
    r.start();pgRender();
  }catch(e){pgStopMic();pg.error='Impossible de lancer le micro : '+e.message;pgRender()}
}
function pgMic(){if(pg.listening||pg.actif){pg.actif=false;pgStopMic();pgRender()}else{pg.echecs=0;pgListen()}}
// Mains libres : Chrome coupe le micro après quelques secondes de silence. Tant que la conversation
// est ouverte, on le relance tout seul (sauf pendant que le pilote réfléchit ou parle).
function pgRelance(){
  clearTimeout(pg.relance);
  if(!pg.actif||!pg.mainsLibres||!pg.open||pg.thinking||pg.listening)return;
  if((pg.echecs||0)>=3){pg.actif=false;pg.error='Le micro s’est coupé plusieurs fois. Appuie sur Parler pour reprendre.';pgRender();return}
  if(document.visibilityState!=='visible')return; // reprendra au retour dans l'appli
  // Attend que la voix du pilote ait fini (sinon il s'entendrait lui-même), mais jamais plus de 20 s.
  if(tts.enCours&&tts.enCours===tts.seq){pg.attente=(pg.attente||0)+1;if(pg.attente<100){pg.relance=setTimeout(pgRelance,400);return}}
  pg.attente=0;
  pg.relance=setTimeout(()=>{if(pg.actif&&!pg.listening&&!pg.thinking)pgListen()},250);
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')pgRelance();else if(pg.listening)pgStopMic()});
function pgTextSubmit(e){e.preventDefault();const i=document.getElementById('pgInput');const t=(i?.value||'').trim();if(!t||pg.thinking)return;i.value='';pgSend(t)}

function pgRepond(t,done=''){pgPush('pilote',t,done);pg.thinking=false;pgRender();pgSpeak(t)}

async function pgSend(t,reessai){
  if(pg.thinking&&!reessai)return;
  pg.thinking=false;
  pgPush('aurel',t);pg.error='';
  const s=voiceClean(t).replace(/[.!?,]/g,'').trim();

  // 1. Une suppression attend ta confirmation
  if(pg.pending){
    const acts=pg.pending;pg.pending=null;
    if(/^(oui|ouais|ok|vas-y|vas y|confirme|je confirme|d'accord|c'est bon|supprime|valide)\b/.test(s)){const n=pgApply(acts);pgRepond('C’est fait.',n?n+' changement(s) · tu peux annuler':'');return}
    if(/^(non|nan|laisse|annule|surtout pas|stop)\b/.test(s)){pgRepond('D’accord, je ne supprime rien.');return}
  }
  // 2. Annuler le dernier changement
  if(pg.undo&&/^(annule|annule ca|annule ça|annuler|reviens en arriere|retour en arriere|defais|defais ca)$/.test(s)){pgUndo();return}
  // 3. Fin de conversation
  if(/^(stop|arrete|tais.toi|ferme|au revoir|merci c'est tout|c'est tout|ca sera tout)$/.test(s)){pgPush('pilote','À plus tard.');pgClose();return}

  // 4. Simple navigation (« ouvre les prêts ») : faite sur place, sans appeler l'IA (gratuit et instantané)
  const direct=pgNavDirecte(s);
  if(direct){pgRepond(direct);return}

  pg.thinking=true;pgRender();
  // Seulement les 5 derniers échanges, raccourcis : l'IA n'a pas besoin de plus pour suivre le fil.
  const historique=pg.log.slice(0,-1).slice(-10).map(m=>({qui:m.qui,texte:String(m.texte).slice(0,300)}));
  const ctx=pgContexte(t);
  pg.dernierEnvoi=ctx; // pour vérifier ce qui part à l'IA
  try{
    const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),30000);
    const r=await fetch(GLOBAL_URL,{method:'POST',headers:{'Content-Type':'application/json'},signal:ctrl.signal,
      body:JSON.stringify({phrase:t,historique,page,maintenant:pgMaintenant(),resume:ctx.resume,donnees:ctx.donnees,education:{questions:eduActives(),consignes:edu().consignes}})});
    clearTimeout(timer);
    const brut=await r.text();let d;
    try{d=JSON.parse(brut)}catch{d={erreur:r.status===404?'fonction serveur introuvable (404) : le site n’a pas été redéployé':(r.status===502||r.status===504||/timed out|timeout/i.test(brut))?'le serveur a dépassé 10 secondes ('+r.status+')':'réponse illisible du serveur ('+r.status+' : '+brut.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().slice(0,80)+')'}}
    if(!r.ok||d.erreur)throw Error(d.erreur||('erreur '+r.status));
    pgNoteIA(d);
    // Les éléments ont été envoyés sous des numéros courts (v1, p2…) : on retrouve leurs vrais identifiants.
    const actions=(Array.isArray(d.actions)?d.actions:[]).map(a=>a.id?{...a,id:ctx.refs[a.id]||''}:a).filter(a=>!('id' in a)||a.id);
    pgSouvenir(actions,ctx);
    if(d.confirmation){pg.pending=actions;pgRepond(d.reponse);return}
    if(actions.some(a=>a.type==='entretien')){pg.thinking=false;pgPush('pilote',d.reponse||'Je lance l’entretien de dossier.');pgClose();go('assistant');voiceNew();return}
    const n=pgApply(actions);
    pgRepond(d.reponse,n?n+' changement(s) · tu peux annuler':'');
    const ct=actions.find(a=>a.type==='contrat');
    if(ct){const pr=db.prets.find(x=>x.id===ct.id);if(pr)setTimeout(()=>{pgClose();distanceSheet(pr)},900)}
  }catch(e){
    pg.thinking=false;
    const local=pgLocal(s);
    const raison=e.name==='AbortError'?'le pilote a mis trop de temps':e.message;
    // Gemini rame ou un serveur est saturé : on relance tout seul une fois, il passera sur un autre modèle.
    if(!reessai&&/trop de temps|trop lent|surcharg|quota|10 secondes|50[234]|429|vide/i.test(raison)){pgPush('pilote','Gemini rame, je passe sur un autre serveur…');pgRender();{const i=pg.log.map(m=>m.qui).lastIndexOf('aurel');if(i>=0)pg.log.splice(i,1)}return pgSend(t,true)}
    if(local){pgRepond(local+' (Pilote IA injoignable : '+raison+'.)')}
    else{pg.error='Pilote IA injoignable : '+raison+'. En attendant, je sais seulement ouvrir les pages (« ouvre les prêts »).';pgPush('pilote','Je n’arrive pas à joindre l’IA pour le moment ('+raison+').');pgRender();pgRelance()}
  }
}

// ── Économie : n'envoyer à l'IA que ce qui sert à la demande ─────────────────
// Au lieu de toute la base (des dizaines de milliers de mots), on envoie :
//  • un résumé chiffré (combien de dossiers par étape, de rendez-vous aujourd'hui…) ;
//  • les éléments qui citent un nom, un modèle, une plaque ou un numéro de la phrase ;
//  • pour les sujets évoqués (prêts, planning, relances…), seulement les éléments en cours ;
//  • les éléments dont on vient de parler (pour « et passe-le en peinture »).
// Les identifiants longs sont remplacés par des numéros courts (v1, p2…).
const PG_MOTS_SECTION={
  vehicules:/dossier|vehicule|atelier|peinture|travaux|chiffr|livr|priorit|carrosserie|sinistre|repar|en attente|a planifier|montant|portefeuille|devis/,
  planning:/planning|rendez.vous|\brdv\b|agenda|demain|aujourd|ce soir|ce matin|cet apres|semaine|lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche|\bheures?\b|\d+ ?h\b|journee|programme/,
  prets:/\bpret|prete|preter|dispo|rendu|rendre|\bretour|rentre|ramene|courtoisie|remplacement|amende|radar|\bpv\b|contravention|conduisait/,
  taches:/relance|relancer|tache|rappel|a faire|penser a|pense a|oublie/,
  clients:/client|telephone|numero|portable|mail|coordonnee/,
  expertises:/expertise|expert/
};
const PG_STOP=new Set(('ai as es eu vu nos vos ici voir liste besoin faudrait avez avons sait sais the les des une est pour dans avec que qui quoi quel quelle quelles quels mon mes ton tes son ses sur pas plus moi toi lui leur elle ils elles fait faire fais mets met mettre passe passer ajoute ajouter supprime supprimer enleve montre affiche ouvre donne dis dit peux veux voudrais faut combien comment quand est cest ce cet cette ces tout tous toute toutes rien aussi alors bien deja encore apres avant jusqu jusqua demain aujourd hui matin soir semaine prochain prochaine dernier derniere lundi mardi mercredi jeudi vendredi samedi dimanche heure heures dossier dossiers vehicule vehicules voiture voitures pret prets prete preter client clients cliente monsieur madame mme planning rendez vous rdv relance relances tache taches expertise expertises statut priorite numero telephone disponible disponibles dispo libre etat point chez par deux trois oui non merci stp sil plait nouveau nouvelle change changer modifie modifier annule rentre rentree rendu revenu ramene qu il elle on je tu nous en et le la de du un au aux ou si ne se me te ma ta sa ca y a ya avoir etre sont ont va vont doit dois peut').split(' '));
const PG_REF={vehicules:'v',planning:'r',prets:'p',taches:'t',clients:'c',expertises:'e'};
const PG_CHAMPS={vehicules:['client','modele','immatriculation','statut','telephone','sinistre','assurance','expertise','prochaine_action','date_action','responsable','priorite','montant','notes','manque'],planning:['date','heure','titre','responsable','statut'],prets:['nom','client','telephone','date_depart','heure_depart','date_retour','heure_retour','statut','signature','notes'],taches:['titre','client','echeance','responsable','statut'],clients:['nom','telephone','email','vehicule'],expertises:['client','immatriculation','date','statut']};
const PG_FINI={vehicules:'Livré',planning:'Terminé',prets:'Retourné',taches:'Terminée',expertises:'Réalisée'};

function pgDecale(n){const d=new Date();d.setDate(d.getDate()+n);return localISO(d)}
// Dates dont parle la phrase (pour ne prendre que ces jours-là dans le planning).
function pgJours(s){
  if(/apres.demain/.test(s))return [pgDecale(2)];
  if(/demain/.test(s))return [pgDecale(1)];
  if(/aujourd|ce matin|ce soir|cet apres|cette apres/.test(s))return [pgDecale(0)];
  if(/semaine prochaine/.test(s)){const j=(8-new Date().getDay())%7||7;return Array.from({length:7},(_,i)=>pgDecale(j+i))}
  const jours=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
  const cites=jours.map((j,i)=>new RegExp('\\b'+j+'\\b').test(s)?i:-1).filter(i=>i>=0);
  if(cites.length)return cites.map(i=>pgDecale(((i-new Date().getDay())+7)%7||7));
  const mois=['janvier','fevrier','mars','avril','mai','juin','juillet','aout','septembre','octobre','novembre','decembre'];
  const m=s.match(/\b(?:le )?(\d{1,2}|1er)(?: (janvier|fevrier|mars|avril|mai|juin|juillet|aout|septembre|octobre|novembre|decembre))?\b/);
  if(m&&(m[2]||/\ble (\d{1,2}|1er)\b/.test(s))){
    const jour=parseInt(m[1])||1;const now=new Date();let mo=m[2]?mois.indexOf(m[2]):now.getMonth();let an=now.getFullYear();
    if(!m[2]&&jour<now.getDate()-3)mo++;
    if(jour>=1&&jour<=31)return [localISO(new Date(an,mo,jour))];
  }
  return null; // pas de date précise → planning de la semaine à venir
}

function pgContexte(t){
  const s=voiceClean(t).replace(/[’]/g,"'");
  const compact=s.replace(/[^a-z0-9]/g,'');
  const chiffres=t.replace(/\D/g,'');
  const mots=[...new Set(s.split(/[^a-z0-9]+/).filter(w=>w&&!PG_STOP.has(w)&&(w.length>=2&&!/^\d{1,2}$/.test(w))))];
  const historique=/amende|radar|\bpv\b|contravention|conduisait|qui avait|historique|a eu|depuis|derniere fois/.test(s);
  const pertinent=Object.keys(PG_MOTS_SECTION).filter(k=>PG_MOTS_SECTION[k].test(s));
  const bilan=/\bpoint\b|bilan|resume|situation|urgent|urgence|quoi de neuf|ma journee|a faire aujourd|mes priorites|\bpriorites\b/.test(s);
  const creation=/^(?:ajoute|ajouter|cree|creer|note|noter|enregistre|programme|planifie|mets? un|nouveau|nouvelle)\b/.test(s);
  const jours=pgJours(s);
  const auj=localISO(), semaine=Array.from({length:8},(_,i)=>pgDecale(i-1));
  const choix={};const ajoute=(sec,el)=>{(choix[sec]=choix[sec]||new Map()).set(el.id,el)};
  const correspond=[];

  // 1. Ce qui cite un nom, un modèle, une plaque ou un numéro de la phrase
  for(const sec of Object.keys(PG_REF)){
    if(historique&&sec!=='prets')continue; // amende / radar : seul l'historique des prêts compte
    const candidats=[],compte={};
    for(const el of db[sec]){
      const brut=[el.client,el.nom,el.modele,el.immatriculation,el.titre,el.vehicule,el.email].filter(Boolean).join(' ');
      const motsEl=voiceClean(brut).split(/[^a-z0-9]+/);
      const touches=mots.filter(w=>motsEl.some(x=>x===w||(w.length>=4&&x.startsWith(w))));
      touches.forEach(w=>compte[w]=(compte[w]||0)+1);
      let bonus=0;
      const plaque=String(el.immatriculation||'').replace(/[^a-z0-9]/gi,'').toLowerCase();
      if(plaque.length>=5&&compact.includes(plaque))bonus+=3;
      const tel=String(el.telephone||'').replace(/\D/g,'');
      if(chiffres.length>=6&&tel.includes(chiffres))bonus+=3;
      if(touches.length||bonus)candidats.push([touches,bonus,el]);
    }
    // Un mot trop courant (« assurance », « Clio »…) ne compte pas si un mot plus précis (un nom) existe
    const precis=Object.keys(compte).filter(w=>compte[w]<=6);
    const trouves=candidats.map(([touches,bonus,el])=>[touches.filter(w=>!precis.length||precis.includes(w)).length+bonus,el]).filter(x=>x[0]>0);
    const dateDe=el=>el.date_depart||el.date||el.echeance||'';
    trouves.sort((a,b)=>b[0]-a[0]||dateDe(b[1]).localeCompare(dateDe(a[1])));
    let garde=trouves;
    // Les éléments terminés (vieux rendez-vous, prêts rendus…) ne servent que pour l'historique
    if(PG_FINI[sec]&&!historique){const fini=x=>x[1].statut===PG_FINI[sec];garde=[...garde.filter(x=>!fini(x)),...garde.filter(fini).slice(0,sec==='prets'?2:sec==='vehicules'?1:0)]}
    for(const [,el] of garde.slice(0,historique?15:8)){ajoute(sec,el);correspond.push(el.id)}
  }
  // Amende à une date donnée : toutes les voitures qui étaient prêtées ce jour-là
  if(historique&&jours){
    const j=jours[0];const tmp=[];
    db.prets.forEach(el=>{if(el.date_depart&&el.date_depart<=j&&(el.date_retour||el.date_depart)>=j)tmp.push(el)});
    tmp.slice(0,15).forEach(el=>{ajoute('prets',el);correspond.push(el.id)});
  }
  // 2. Pour les sujets évoqués : seulement ce qui est en cours
  const enCours=sec=>db[sec].filter(x=>x.statut!==PG_FINI[sec]);
  if(pertinent.includes('prets'))enCours('prets').slice(0,30).forEach(el=>ajoute('prets',el));
  if((pertinent.includes('planning')&&!historique)||bilan){
    const dates=jours||(bilan?[auj,pgDecale(1)]:semaine);
    db.planning.filter(x=>dates.includes(x.date)).sort((a,b)=>(a.date+a.heure).localeCompare(b.date+b.heure)).slice(0,30).forEach(el=>ajoute('planning',el));
  }
  if((pertinent.includes('taches')&&!creation)||bilan)enCours('taches').sort((a,b)=>String(a.echeance||'9').localeCompare(String(b.echeance||'9'))).slice(0,bilan?10:25).forEach(el=>ajoute('taches',el));
  if((pertinent.includes('expertises')&&!creation)||bilan)enCours('expertises').slice(0,bilan?10:20).forEach(el=>ajoute('expertises',el));
  if((pertinent.includes('vehicules')&&!creation&&!historique)||bilan){
    // Une étape citée (« en peinture ») → seulement les dossiers à cette étape
    const etape=(configs.vehicules.fields.find(f=>f[0]==='statut')[4]).find(e=>s.includes(voiceClean(e)));
    // Dossier cité par son nom, ou dont on vient de parler (« mets-le en priorité 9 »)
    const dossierCite=correspond.some(id=>db.vehicules.some(v=>v.id===id))||(!mots.length&&(pg.recents||[]).some(id=>db.vehicules.some(v=>v.id===id)));
    const parPriorite=l=>l.sort((a,b)=>(+b.priorite||0)-(+a.priorite||0));
    let liste;
    if(bilan)liste=parPriorite(enCours('vehicules')).slice(0,10);
    else if(dossierCite)liste=[];                       // un dossier précis est cité : lui seul suffit
    else if(etape)liste=db.vehicules.filter(x=>x.statut===etape).slice(0,30);
    else liste=parPriorite(enCours('vehicules')).slice(0,25);
    liste.forEach(el=>ajoute('vehicules',el));
  }
  // 3. Ce dont on vient de parler
  for(const id of pg.recents||[])for(const sec of Object.keys(PG_REF)){const el=db[sec].find(x=>x.id===id);if(el)ajoute(sec,el)}

  // Envoi compact : numéros courts, champs utiles, notes raccourcies
  const refs={},donnees={};
  for(const [sec,m] of Object.entries(choix)){
    let i=0;
    donnees[sec]=[...m.values()].map(el=>{
      const ref=PG_REF[sec]+(++i);refs[ref]=el.id;
      const r={id:ref};
      const el2=sec==='vehicules'?{...el,manque:eduManque(el).map(q=>q.champ).join(', ')}:el;
      for(const c of PG_CHAMPS[sec]){const v=c==='signature'?(el2.signature?'oui':(el2.sign_jeton?'envoyé, en attente':'')):el2[c];if(v!==undefined&&v!==null&&String(v).trim())r[c]=c==='notes'?String(v).replace(/\s+/g,' ').slice(0,90):String(v)}
      return r;
    });
  }
  // Résumé chiffré : de quoi répondre à « combien… » sans tout envoyer
  const parEtape={};db.vehicules.forEach(x=>{const k=x.statut||'Sans étape';parEtape[k]=(parEtape[k]||0)+1});
  const parc=[...new Set([...garage().flotte.map(v=>v.nom),...db.prets.map(x=>x.nom)].filter(Boolean))].map(nom=>{const actif=db.prets.filter(x=>x.nom===nom&&x.statut!=='Retourné').pop();return nom+' : '+(actif?actif.statut+(actif.client?' ('+actif.client+')':''):'Disponible')});
  const resume={
    dossiersParEtape:parEtape,
    voituresDePret:parc,
    equipe:garage().equipe.map(m=>m.court+(m.role?' ('+m.role+')':'')).join(', '),
    rendezVous:{aujourdhui:db.planning.filter(x=>x.date===auj).length,demain:db.planning.filter(x=>x.date===pgDecale(1)).length},
    relancesOuvertes:enCours('taches').length,
    expertisesEnAttente:enCours('expertises').length,
    clients:db.clients.length
  };
  return {resume,donnees,refs,correspond};
}

// « Ouvre les prêts », « montre-moi les dossiers en peinture » : fait sur place, sans IA.
function pgNavDirecte(s){
  const m=s.match(/^(?:ouvre|ouvrir|affiche|affiche.moi|montre.moi|montre|va (?:sur|dans|a|au|aux)|retourne (?:sur|au|a)|je veux voir|emmene.moi (?:sur|au|aux|a))\s+(.+)$/);
  if(!m)return '';
  const reste=m[1];
  if(PG_MOTS_SECTION.planning.test(reste)&&/demain|aujourd|matin|soir|semaine|lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche|\d/.test(reste))return ''; // « le planning de demain » → l'IA le lit

  const cible=[[/nouveau dossier|creer un dossier|entretien/,'assistant'],[/mon garage|equipe|siret|taux horaire|identite/,'garage'],[/voitures? de pret|\bprets?\b/,'prets'],[/planning|agenda|rendez.vous/,'planning'],[/relances?|taches?/,'taches'],[/expertises?/,'expertises'],[/clients?/,'clients'],[/dossiers?|vehicules?|atelier/,'vehicules'],[/sauvegardes?|parametres?|export/,'parametres'],[/cockpit|accueil|tableau de bord/,'dashboard'],[/guide|aide/,'aide']].find(([re])=>re.test(reste));
  if(!cible)return '';
  const sec=cible[1];
  const opts=configs[sec]?.fields.find(f=>f[0]==='statut')?.[4]||[];
  const etape=opts.find(e=>reste.includes(voiceClean(e)));
  let restant=reste;[cible[0],etape?new RegExp(voiceClean(etape)):null].forEach(re=>{if(re)restant=restant.replace(re,' ')});
  const autres=restant.split(/[^a-z0-9]+/).filter(w=>w&&!PG_STOP.has(w)&&!/^(en|les?|la|des|du|de|mes|tous|toutes|liste|page|qui|sont|a|l|d)$/.test(w));
  if(autres.length>1)return ''; // demande plus riche → l'IA s'en occupe
  if(sec==='assistant'){go('assistant');return 'J’ouvre l’entretien de dossier.'}
  page=sec;query=autres[0]||'';filter=etape||'';render();
  const noms={prets:'les prêts',planning:'le planning',taches:'les relances',expertises:'les expertises',clients:'les clients',vehicules:'les dossiers',parametres:'les sauvegardes',dashboard:'le cockpit',aide:'le guide',garage:'ton garage'};
  if(configs[sec]&&(etape||query)){const n=filteredRows(sec).length;return `Voici ${noms[sec]}${etape?' à l’étape '+etape:''}${query?' pour '+query:''} : ${n?n+' résultat'+(n>1?'s':''):'aucun résultat'}.`}
  return 'J’ouvre '+noms[sec]+'.';
}

// Applique les actions renvoyées par l'IA, en revérifiant tout côté appli.
function pgApply(actions){
  const avant=clone(db);let n=0,nav=null;
  const manqueAvant=new Map(db.vehicules.map(v=>[v.id,eduManque(v).length]));
  for(const a of actions||[]){
    if(a.type==='aller'&&PG_PAGES.includes(a.page)){nav=a;continue}
    if(a.type==='retenir'&&a.texte){edu().consignes.push(String(a.texte).slice(0,300));n++;continue}
    if(a.type==='question'&&a.question){edu().questions.push({champ:EDU_CHAMPS[a.champ]?a.champ:'autre',question:String(a.question).slice(0,200),actif:true});n++;continue}
    const c=configs[a.section];if(!c)continue;
    const permis=c.fields.map(f=>f[0]);
    const vals={};for(const [k,v] of Object.entries(a.valeurs||{}))if(permis.includes(k))vals[k]=String(v);
    if(a.type==='ajouter'&&Object.keys(vals).length){const nid=pgId();db[a.section].push({id:nid,...vals});n++;pg.recents=[nid,...(pg.recents||[])].slice(0,8)}
    else if(a.type==='modifier'){const el=db[a.section].find(x=>x.id===a.id);if(el&&Object.keys(vals).length){Object.assign(el,vals);n++}}
    else if(a.type==='supprimer'){const avantLen=db[a.section].length;db[a.section]=db[a.section].filter(x=>x.id!==a.id);if(db[a.section].length<avantLen)n++}
  }
  if(n){pg.undo=avant;save(true);for(const v of db.vehicules)if(dossierComplet(v,manqueAvant.has(v.id)?manqueAvant.get(v.id):Infinity))break}
  if(nav){page=nav.page;query=nav.recherche||'';filter=nav.statut||''}
  if(n||nav)render();
  return n;
}

function syncMarque(){
  const base=sync.base||{},now=new Date().toISOString();db.supprimes=db.supprimes||{};
  for(const sec of SYNC_SECS){
    const avant=new Map((base[sec]||[]).map(x=>[x.id,JSON.stringify(x)]));
    for(const el of db[sec]||[]){if(!el.id)el.id=pgId();const p=avant.get(el.id);if(p===undefined||p!==JSON.stringify(el))el.maj=now}
    const ids=new Set((db[sec]||[]).map(x=>x.id));
    for(const x of base[sec]||[])if(!ids.has(x.id))db.supprimes[x.id]=now;
  }
  if(JSON.stringify(db.education||null)!==JSON.stringify(base.education||null))db.educationMaj=now;
  if(base.garage&&JSON.stringify(db.garage||null)!==JSON.stringify(base.garage))db.garageMaj=now;
}
function syncFusion(a,b){
  b=b||{};const out={...clone(initial)};
  const supp={...(b.supprimes||{})};for(const [k,v] of Object.entries(a.supprimes||{}))if(!supp[k]||v>supp[k])supp[k]=v;
  const limite=new Date(Date.now()-90*864e5).toISOString();
  for(const k of Object.keys(supp))if(supp[k]<limite)delete supp[k];
  for(const sec of SYNC_SECS){
    const m=new Map();
    for(const el of b[sec]||[])if(el&&el.id)m.set(el.id,el);
    for(const el of a[sec]||[]){if(!el||!el.id)continue;const s=m.get(el.id);if(!s||String(el.maj||'')>String(s.maj||''))m.set(el.id,el)}
    out[sec]=[...m.values()].filter(el=>!(supp[el.id]&&supp[el.id]>=String(el.maj||'')));
  }
  out.supprimes=supp;
  const eduA=String(a.educationMaj||''),eduB=String(b.educationMaj||'');
  const prendA=a.education&&(!b.education||eduA>eduB);
  out.education=clone(prendA?a.education:(b.education||a.education||EDU_DEFAUT));out.educationMaj=prendA?eduA:(eduB||eduA);
  const gA=String(a.garageMaj||''),gB=String(b.garageMaj||'');
  const prendGA=a.garage&&(!b.garage||gA>gB);
  out.garage=clone(prendGA?a.garage:(b.garage||a.garage||GARAGE_DEFAUT));out.garageMaj=prendGA?gA:(gB||gA);
  return out;
}

      if(g.status===503){sync.etat='nonconfig';return}

      if(JSON.stringify(fusion)!==JSON.stringify(serveur)){
        const p=await syncApi('PUT',{version:g.d.version||0,data:fusion});
        if(p.status===409)continue;
        if(p.status!==200)throw Error('serveur '+p.status);
      }
      const change=JSON.stringify(fusion)!==JSON.stringify(db);
      db=fusion;sync.base=clone(fusion);
      try{localStorage.setItem(STORAGE_KEY,JSON.stringify(db));localStorage.setItem('myicar_base',JSON.stringify(sync.base))}catch(e){}
      if(sync.invite){sync.invite=false;setTimeout(()=>toast('✅ Bienvenue dans l’équipe'+(g.d.nom?' '+g.d.nom:'')+' !'),300)}
      sync.etat='ok';sync.derniere=new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
      if(change&&syncTranquille())render();
      return;
    }
    throw Error('trop d’enregistrements simultanés');
  }catch(e){sync.etat='horsligne'}
  finally{sync.enCours=false;syncBadge();if(sync.encore){sync.encore=false;syncPlus()}}
}

function sigPad(){
  const c=document.getElementById('sig'),w=document.getElementById('sigWrap'),ph=document.getElementById('sigPh');
  const ratio=window.devicePixelRatio||1;c.width=(c.offsetWidth||600)*ratio;c.height=180*ratio;
  const g=c.getContext('2d');g.scale(ratio,ratio);g.lineWidth=2.6;g.lineCap='round';g.lineJoin='round';g.strokeStyle='#14213d';
  let trace=false,utilise=false,der=null;
  const pos=e=>{const r=c.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  c.onpointerdown=e=>{e.preventDefault();try{c.setPointerCapture(e.pointerId)}catch(_){}trace=true;der=pos(e)};
  c.onpointermove=e=>{if(!trace)return;const p=pos(e);g.beginPath();g.moveTo(...der);g.lineTo(...p);g.stroke();der=p;if(!utilise){utilise=true;ph.hidden=true;w.classList.add('done')}};
  c.onpointerup=c.onpointercancel=()=>trace=false;
  return{
    vide:()=>!utilise,
    effacer:()=>{g.clearRect(0,0,c.width,c.height);utilise=false;ph.hidden=false;w.classList.remove('done')},
    // Image réduite (environ 10 Ko) pour que la base de l'équipe reste légère.
    image:()=>{const t=document.createElement('canvas');t.width=Math.min(c.width,400);t.height=Math.round(c.height*t.width/c.width);const tg=t.getContext('2d');tg.fillStyle='#fff';tg.fillRect(0,0,t.width,t.height);tg.drawImage(c,0,0,t.width,t.height);return t.toDataURL('image/png')}
  };
}
function reduirePhoto(file,max,qualite){return new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',qualite))};im.onerror=ko;im.src=r.result};r.onerror=ko;r.readAsDataURL(file)})}

function fanfare(el){
  try{
    const A=new (window.AudioContext||window.webkitAudioContext)();
    const N={D4:293.66,E4:329.63,'F#4':369.99,G4:392,A4:440,B4:493.88,C5:523.25,D5:587.33};
    const seq=[['D4',.75],['D4',.25],['G4',1],['G4',1],['A4',1],['A4',1],['D5',1.5],['B4',.5],['G4',.75],['G4',.25],['B4',.75],['G4',.25],['E4',1],['C5',2],['A4',.75],['F#4',.25],['G4',2]];
    const temps=.32;let t=A.currentTime+.05;
    for(const [n,d] of seq){const o=A.createOscillator(),g=A.createGain();o.type='triangle';o.frequency.value=N[n];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.22,t+.02);g.gain.setValueAtTime(.22,t+d*temps*.8);g.gain.linearRampToValueAtTime(0,t+d*temps*.98);o.connect(g).connect(A.destination);o.start(t);o.stop(t+d*temps);t+=d*temps}
    setTimeout(()=>A.close(),(t-A.currentTime)*1000+400);
  }catch(e){}
  setTimeout(()=>toast('🇫🇷 Dossier complet'+(el&&el.client?' : '+el.client:'')+' !'),400);
}

// V12 — PLANNING : chaque prêt place tout seul son départ et son retour dans le Planning de l'appli
function planningDesPrets(){
  const P=db.planning,vus=new Set();
  const poser=(id,date,heure,titre,statut,notes)=>{
    vus.add(id);let x=P.find(e=>e.id===id);
    if(!x){x={id,responsable:''};P.push(x)}
    const v={date,heure:heure||'',titre,statut,notes};
    for(const k in v)if(x[k]!==v[k])x[k]=v[k];
  };
  for(const pr of db.prets){
    if(!pr.id||!['Réservé','Prêté','Retourné'].includes(pr.statut))continue;
    const qui=(pr.nom||'Voiture de prêt')+' – '+(pr.client||'client'),tel=pr.telephone?'Tél. client : '+pr.telephone:'';
    if(pr.date_depart)poser('pret-'+pr.id+'-dep',pr.date_depart,pr.heure_depart,'🚗 Départ prêt '+qui,pr.statut==='Réservé'?'Prévu':'Terminé',tel);
    if(pr.date_retour)poser('pret-'+pr.id+'-ret',pr.date_retour,pr.heure_retour,'🔙 Retour prêt '+qui,pr.statut==='Retourné'?'Terminé':'Prévu',tel);
  }
  db.planning=P.filter(e=>!String(e.id||'').startsWith('pret-')||vus.has(e.id));
}

// V12 — VOITURES DE PRÊT : tableau des voitures, lien avec le dossier atelier, pas de double réservation
const DOSSIER_FINI=['Prêt à livrer','Livré'];
function dossierLabel(v){return [v.client,v.modele,v.immatriculation].filter(Boolean).join(' · ')}
function dossiersOuverts(){return db.vehicules.filter(v=>v.statut!=='Livré').map(dossierLabel).filter(Boolean)}
function dossierDe(p){return p.dossier?db.vehicules.find(v=>dossierLabel(v)===p.dossier):null}
function pretDebut(p){return new Date((p.date_depart||new Date().toLocaleDateString('en-CA'))+'T'+(p.heure_depart||'00:00'))}
function pretFin(p){
  if(!p.date_retour)return new Date(8.64e15);
  let f=new Date(p.date_retour+'T'+(p.heure_retour||'23:59'));
  if(p.statut==='Prêté'&&f<new Date())f=new Date(8.64e15); // pas rentrée : bloquée jusqu'à son retour
  return f;
}
function pretPeriode(p){return (p.date_depart?'du '+dh(p.date_depart,p.heure_depart):'')+(p.date_retour?' au '+dh(p.date_retour,p.heure_retour):' sans date de retour')}
function pretActif(p){return p.statut==='Prêté'||p.statut==='Réservé'}
function pretConflit(v,id){
  if(!pretActif(v)||!v.nom)return null;
  const a=pretDebut(v),b=pretFin({...v,statut:'Réservé'});
  return db.prets.find(p=>p.id!==id&&pretActif(p)&&String(p.nom).trim().toLowerCase()===String(v.nom).trim().toLowerCase()&&pretDebut(p)<b&&a<pretFin(p))||null;
}
function voituresLibres(v,id){return garage().flotte.map(f=>f.nom).filter(nom=>!pretConflit({...v,nom,statut:'Réservé'},id))}
// Alertes : la voiture du client n'est pas prête alors que le retour approche, et la voiture est réservée après
function pretAlertes(){
  const out=[],now=new Date(),j2=new Date(now.getTime()+2*864e5);
  for(const p of db.prets.filter(x=>x.statut==='Prêté')){
    const d=dossierDe(p),fin=p.date_retour?new Date(p.date_retour+'T'+(p.heure_retour||'18:00')):null;
    const suivant=db.prets.filter(x=>x.id!==p.id&&x.statut==='Réservé'&&x.nom===p.nom&&(!fin||pretDebut(x)>=fin)).sort((a,b)=>pretDebut(a)-pretDebut(b))[0];
    if(d&&!DOSSIER_FINI.includes(d.statut)&&fin&&fin<j2){
      const libres=suivant?voituresLibres({...suivant,statut:'Réservé'},suivant.id).filter(n=>n!==p.nom):[];
      out.push({p,texte:`${p.nom} chez ${p.client} : retour prévu ${dh(p.date_retour,p.heure_retour)}, mais sa voiture est encore « ${d.statut||'sans étape'} ».`+(suivant?` Elle est réservée pour ${suivant.client} le ${dh(suivant.date_depart,suivant.heure_depart)}${libres.length?' → libre à la place : '+libres.join(', '):' → aucune autre voiture libre'}.`:'')});
    } else if(pretEnRetard(p)&&suivant){
      out.push({p,texte:`${p.nom} pas rentrée (chez ${p.client}) alors qu’elle est réservée pour ${suivant.client} le ${dh(suivant.date_depart,suivant.heure_depart)}.`});
    }
  }
  return out;
}
function flotteTableau(){
  const now=new Date();
  const cartes=garage().flotte.map(f=>{
    const ps=db.prets.filter(p=>p.nom===f.nom&&pretActif(p));
    const enCours=ps.find(p=>p.statut==='Prêté');
    const proch=ps.filter(p=>p.statut==='Réservé'&&pretFin(p)>now).sort((a,b)=>pretDebut(a)-pretDebut(b))[0];
    let ico='🟢',etat='Au garage',detail='';
    if(enCours){ico=pretEnRetard(enCours)?'🔴':'🔵';etat=pretEnRetard(enCours)?'En retard · '+enCours.client:'Chez '+enCours.client;detail=enCours.date_retour?'Retour '+dh(enCours.date_retour,enCours.heure_retour):'Retour non fixé';const d=dossierDe(enCours);if(d)detail+=' · sa voiture : '+(d.statut||'—')}
    if(proch)detail+=(detail?'<br>':'')+'🟠 Réservée '+esc(dh(proch.date_depart,proch.heure_depart))+' · '+esc(proch.client||'');
    const id=(enCours||proch||{}).id;
    return `<div class="card flotte-wrap"><button class="flotte-carte" onclick="${id?`edit('prets','${esc(id)}')`:`pretNouveau('${esc(f.nom)}')`}"><div class="flotte-nom">${ico} ${esc(f.nom)}</div><div class="flotte-etat">${esc(etat)}</div><small>${detail}</small></button>${enCours&&enCours.telephone?`<div class="flotte-tel">${telBoutons(enCours.telephone,1)}</div>`:''}</div>`;
  }).join('');
  const al=pretAlertes();
  return (al.length?`<div class="notice" style="margin-bottom:12px;background:var(--red-soft);border-color:rgba(221,115,130,.3);color:#8A2A23">${al.map(a=>'⚠️ '+esc(a.texte)).join('<br><br>')}</div>`:'')+`<div class="flotte-grille">${cartes}</div>`;
}
